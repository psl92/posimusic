<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posimusic 步丝丝音乐完整版</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", system-ui, sans-serif;
}
body{
    background: radial-gradient(circle at 15% 10%, #7026d8 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, #5218a6 0%, transparent 48%),
                #2c0b52;
    padding:12px;
    min-height: 100vh;
    color:#ffffff;
}
.wrapper{
    width:100%;
    max-width:1900px;
    height:96vh;
    position:relative;
}
.top-bar{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    padding:10px 0;
}
.search-box{
    display:flex;
    align-items:center;
}
#searchInput{
    padding:7px 14px;
    border:none;
    border-radius:9999px 0 0 9999px;
    outline:none;
    background:rgb(233, 236, 237);
    color:#fff;
    width:220px;
}
#searchInput::placeholder{
    color:#cccccc;
}
#searchBtn{
    padding:7px 16px;
    border:none;
    border-radius:0 9999px 9999px 0;
    background: linear-gradient(145deg,#8844e0,#5921b8);
    color:#fff;
    cursor:pointer;
}
.top-bar button{
    padding:7px 20px;
    border:none;
    border-radius:9999px;
    background: linear-gradient(145deg,#8844e0,#5921b8);
    color:#fff;
    cursor:pointer;
    box-shadow: 0 3px 12px rgba(136,68,224,0.4), inset 0 1px 0 rgb(188, 188, 167);
    transition: all 0.25s ease;
}
.top-bar button:hover{
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(136,68,224,0.55), inset 0 1px 0 rgb(210, 210, 183);
}
.top-bar button.active{
    background: linear-gradient(145deg,#a264ff,#743cb4);
    box-shadow: 0 0 14px rgba(162,100,255,0.6);
}
.top-right{
    display:flex;
    gap:10px;
    margin-left: auto;
}
.main-container{
    display:flex;
    gap:20px;
    height:calc(100% - 120px);
}
.display-area{
    flex:1;
    overflow-y:auto;
}
.card-grid{
    display:grid;
    gap:18px;
    padding:10px;
}
.home-grid{grid-template-columns: repeat(4, 1fr);}
.music-grid{grid-template-columns: repeat(7, 1fr);}
.video-grid{grid-template-columns: repeat(4, 1fr);}
.item-card{
    background: linear-gradient(135deg,rgba(110,40,200,0.3),rgba(70,20,140,0.2));
    backdrop-filter: blur(10px);
    border:1px solid rgb(220, 220, 169);
    border-radius:22px;
    overflow:hidden;
    padding-bottom:12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 10px rgba(120,40,220,0.15);
    transition: transform 0.3s ease;
}
.item-card:hover{
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 18px rgba(140,60,255,0.28);
}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}
.card-info{padding:10px 12px;}
.card-name{font-weight:bold;font-size:15px;margin-bottom:5px;}
.card-singer{font-size:13px;opacity:0.85;margin-bottom:8px;}
.card-data-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
.card-bottom-btn{display:flex;gap:6px;}
.comment-card-btn{
    font-size:11px;padding:3px 12px;border:none;border-radius:9999px;
    background: linear-gradient(135deg,#914cdf,#6633aa);
    color:#fff;cursor:pointer;transition:0.2s;
}
.comment-card-btn:hover{filter:brightness(1.15);}
.like-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;transition:0.2s;}
.like-btn:hover{transform:scale(1.2);}
.like-btn.liked{color:#ff5577;text-shadow:0 0 6px #ff5577;}
.sidebar{
    width:240px;
    flex-shrink:0;
}
.sidebar-block{
    background: linear-gradient(135deg,rgba(90,30,170,0.28),rgba(50,15,100,0.18));
    backdrop-filter: blur(12px);border:1px solid rgb(225, 225, 171);
    border-radius:20px;padding:14px;margin-bottom:22px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.block-title{font-size:14px;padding-bottom:8px;border-bottom:1px solid rgb(216, 216, 175);margin-bottom:10px;}
.history-item{display:flex;justify-content:space-between;padding:6px 6px;border-radius:12;cursor:pointer;font-size:13;transition:0.2s;}
.history-item:hover{background:rgba(130,60,230,0.25);}
.del-tag{width:18px;height:18px;background:#f44336;border-radius:9999px;text-align:center;font-size:11px;line-height:18px;}
.db-tab-group{display:flex;gap:6px;margin:10px 0;}
.db-tab{flex:1;padding:5px;border:none;border-radius:9999px;background:rgba(80,30,150,0.4);color:#fff;cursor:pointer;transition:0.2s;}
.db-tab.active{background: linear-gradient(135deg,#8642e2,#743cb4);box-shadow:0 0 10px rgba(120,40,220,0.4);}
.db-item{padding:8px;font-size:13px;margin:6px 0;border-radius:14px;background:rgba(75,25,140,0.35);}
.db-btn-group{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.db-btn{font-size:10px;padding:3px 9px;border:none;border-radius:9999px;color:#fff;cursor:pointer;}
.db-btn-home{background:#3674d8;}.btn-music{background:#279e48;}.btn-video{background:#d6bb99;}.btn-del{background:#dd3333;}
.btn-del {
    pointer-events: auto !important;
    position: relative;
    z-index: 5;
}
#dbWrap {
    max-height: 52vh;
    overflow-y: auto !important;
    overflow-x: hidden;
    padding-right: 6px;
    pointer-events: auto;
    position: relative;
    z-index: 2;
    scrollbar-width: auto;
}
#dbWrap::-webkit-scrollbar{
    display:block;
    width:4px;
}
#dbWrap::-webkit-scrollbar-thumb{
    background:#9c68ff;border-radius:4px;
}
.bottom-control{
    position:absolute;
    bottom:10px;
    left:0;
    width:100%;
    padding:0 10px;
    position: relative;
}
.bottom-progress-wrap{
    width:100%;
    margin-bottom:12px;
    position: relative;
}
#bottomProgress{
    width:100%;
    accent-color:#a264ff;
}
#timeStart{
    position:absolute;
    left:5px;
    bottom:-20px;
    font-size:12px;
    color:#eee;
}
#timeEnd{
    position:absolute;
    right:5px;
    bottom:-20px;
    font-size:12px;
    color:#eee;
}
.control-buttons{display:flex;justify-content:center;gap:22px;align-items:center;}
.ctrl-btn{width:38px;height:38px;border:none;border-radius:9999px;background: linear-gradient(145deg,#8844e0,#5921b8);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(110,40,200,0.35);transition:0.2s;}
.ctrl-btn:hover{transform:scale(1.1);}
.play-main{width:56px;height:56px;font-size:22px;background: linear-gradient(145deg,#b370ff,#743cb4);box-shadow:0 0 16px rgba(160,90,0.5);}
.modal{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);justify-content:center;align-items:center;z-index:999;
}
.modal-box{
    z-index: 1000;
    background: linear-gradient(135deg,rgba(85,30,165,0.35),rgba(40,10,80,0.22));
    backdrop-filter: blur(14px);border:1px solid rgba(255,255,0.18);
    color:#fff;padding:26px;border-radius:24px;width:480px;max-height:80vh;overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    pointer-events: auto !important;
}
.input-item{margin:10px 0;}
.input-item input, .input-item textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#ffffff !important;
    color:#000000 !important;
    outline:none;
    pointer-events: auto !important;
    user-select: text !important;
    -webkit-user-select: text !important;
}
.input-item input:focus, .input-item textarea:focus{
    border-color:#a264ff;
    box-shadow:0 0 8px rgba(162,100,255,0.4);
    background:#ffffff !important;
    color:#000000 !important;
}
.input-item input::placeholder, .input-item textarea::placeholder {
    color:#777777;
}
.modal-buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;}
.modal-buttons button{padding:7px 22px;border:none;border-radius:9999px;background: linear-gradient(135deg,#8844e0,#5921b8);color:#fff;cursor:pointer;transition:0.2s;}
.modal-buttons button:hover{filter:brightness(1.15);}
.home-view,.music-view,.video-view{display:none;}.active-view{display:block;}
#uploadOpenBtn,#statOpenBtn,#dbBoxWrap,#aiControlPanel{display: none;}
.comment-item{padding:10px;border-bottom:1px solid rgba(255,255,0.12);font-size:13px;}
.comment-name{font-weight:bold;color:#d8b8ff;}.comment-time{font-size:11px;color:#ccc;}
.comment-del{float:right;background:#f44336;color:#fff;border:none;font-size:10px;padding:2px 6px;border-radius:9999px;}
.donate-img-box{display:flex;gap:10px;flex-wrap:wrap;margin:10px;}
.donate-img-box img{width:160px;border-radius:12px;border:1px solid #ffffff33;}
.switch-btn{
    background:transparent;border:none;color:#a264ff;margin-top:8px;cursor:pointer;text-align:left;
}
.play-modal-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(25,10,40,0.72);
    z-index:10000;
    align-items:center;
    justify-content:center;
}
.play-modal-box{
    width:85%;
    max-width:1300px;
    background: linear-gradient(135deg, rgba(230,170,245,0.18), rgba(160,120,240,0.22));
    backdrop-filter:blur(20px);
    border-radius:28px;
    border:1px solid rgba(235, 190, 255, 0.35);
    padding:30px;
    color:#fff;
    position:relative;
    box-shadow: 0 0 35px rgba(210,140,255,0.18);
}
.play-modal-box:fullscreen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-modal-box:-webkit-fullscreen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-close{
    position:absolute;
    top:16px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.play-content-row{
    display:grid;
    grid-template-columns:64% 34%;
    gap:2%;
}
.media-view{
    width:100%;
    border-radius:18px;
    background:#000;
    overflow:hidden;
}
#fixedVideo{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    border-radius: 18px;
    object-fit: contain;
    crossorigin:anonymous;
    preload:auto;
    position:relative;
    z-index:2;
}
.audio-cover-box{
    padding:40px;
    text-align:center;
}
.audio-cover-box img{
    width:320px;
    border-radius:16px;
}
.lyric-area{
    height:380px;
    overflow-y:auto;
    padding:15px;
    scrollbar-width: none;
}
.play-control-bar{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:16px;
}
.play-control-bar button{
    background: linear-gradient(145deg,#8844e0,#5921b8) !important;
    border:none;
    color:#fff !important;
    border-radius:999px;
    padding:10px 18px;
    font-size:18px;
    cursor:pointer;
    transition: filter 0.2s ease;
}
.play-control-bar button:hover{
    filter: brightness(1.18);
}
.play-progress{
    flex:1;
}
.lyric-area::-webkit-scrollbar,
.display-area::-webkit-scrollbar,
.sidebar::-webkit-scrollbar,
.modal-box::-webkit-scrollbar{
    width: 0 !important;
    height: 0 !important;
    display: none !important;
}
.lyric-area, .display-area, .sidebar, .modal-box{
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}
.lyric-wrap{
    transition: transform 0.35s ease-out;
}
.lyric-line{
    padding:12px 0;
    font-size:18px;
    text-align:center;
    cursor: pointer;
    line-height: 1.8;
}
.lyric-char {
    color: rgba(255, 255, 255, 0.32);
    transition: color 0.1s ease, text-shadow 0.1s ease;
    letter-spacing: 2px;
}
.lyric-char.active {
    color: #ffffff;
    text-shadow: 0 0 6px #ff9cff,
                 0 0 12px #e26cff,
                 0 0 20px #b340ff,
                 0 0 32px #8c1cff;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="top-bar">
        <div class="search-box">
            <input id="searchInput" placeholder="搜索歌曲/歌手" type="text">
            <button id="searchBtn">搜索</button>
        </div>
        <button class="nav-switch active" data-view="home">首页</button>
        <button class="nav-switch" data-view="music">音乐</button>
        <button class="nav-switch" data-view="video">视频</button>
        <button id="uploadOpenBtn">上传</button>
        <button id="statOpenBtn">统计</button>
        <div class="top-right">
            <button id="userLoginBtn">普通用户登录</button>
            <button id="adminLoginBtn">管理员登录</button>
            <button id="donateBtn">赞赏</button>
        </div>
    </div>
    <div class="main-container">
        <div class="display-area">
            <div class="home-view active-view"><div class="card-grid home-grid" id="homeCardWrap"></div></div>
            <div class="music-view"><div class="card-grid music-grid" id="musicCardWrap"></div></div>
            <div class="video-view"><div class="card-grid video-grid" id="videoCardWrap"></div></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-block">
                <div class="block-title">播放列表（双击播放）</div>
                <div id="historyWrap"></div>
            </div>
            <div class="sidebar-block" id="dbBoxWrap">
                <div class="block-title">资源数据库(管理员专用)</div>
                <div class="db-tab-group">
                    <button class="db-tab active" data-filter="all">全部</button>
                    <button class="db-tab" data-filter="music">仓库音乐</button>
                    <button class="db-tab" data-filter="video">仓库视频</button>
                </div>
                <div id="dbWrap"></div>
            </div>
        </div>
    </div>
    <div class="bottom-control">
        <div class="bottom-progress-wrap">
            <input type="range" id="bottomProgress" min="0" max="100" value="0">
            <span id="timeStart">00:00</span>
            <span id="timeEnd">00:00</span>
        </div>
        <div class="control-buttons">
            <div>
                <button class="ctrl-btn" id="prevMainBtn">◀◀</button>
                <button class="ctrl-btn" id="backMainBtn">◀</button>
            </div>
            <button class="ctrl-btn play-main" id="playMainBtn">▶</button>
            <div>
                <button class="ctrl-btn" id="forwardMainBtn">▶</button>
                <button class="ctrl-btn" id="nextMainBtn">▶▶</button>
            </div>
        </div>
    </div>
</div>
<div style="background:rgba(0,0,0,0.4);padding:20px;border-radius:12px;margin:15px 0;color:#fff;display:none;" id="aiControlPanel">
  <h3>小哀AI模拟控制面板</h3>
  <div style="margin:10px 0;">
    <label>小哀AI总开关：</label>
    <button id="robotMainSwitch" style="padding:6px 12px;background:#2ecc71;border:none;border-radius:4px;color:#fff">已关闭</button>
  </div>
  <div style="margin:10px 0;">
    <label>设置小哀AI数量（1~1000）：</label>
    <input type="number" id="robotCountInput" min="1" max="1000" value="20" style="padding:6px;width:80px;">
  </div>
  <div style="margin:10px 0;">
    <button id="startRobotBtn" disabled style="padding:6px 15px;background:#999;border:none;border-radius:4px;color:#fff;margin-right:10px;">启动小哀AI</button>
    <button id="stopRobotBtn" style="padding:6px 15px;background:#e74c3c;border:none;border-radius:4px;color:#fff;">全部停止小哀AI</button>
  </div>
  <div style="margin-top:12px;color:#ddd;font-size:14px;">
    当前状态：<span id="robotStatusText">小哀AI未运行</span>
    <br>运行小哀AI总数：<span id="runningRobotNum">0</span>
  </div>
</div>
<div class="play-modal-mask" id="playMask">
    <div class="play-modal-box" id="playBox">
        <span class="play-close" id="closePlayer">✕</span>
        <div class="play-content-row">
            <div class="media-view">
                <video id="fixedVideo" crossorigin="anonymous"></video>
                <div class="audio-cover-wrap" id="audioCoverWrap" style="display:none;">
                    <img id="coverImg" src="">
                    <h3 id="audioName"></h3>
                    <p id="audioSinger"></p>
                </div>
            </div>
            <div class="lyric-area" id="lyricBox">
                <div class="lyric-wrap" id="lyricWrap">
                    <div class="lyric-line">等待加载歌词...</div>
                </div>
            </div>
        </div>
        <div class="play-control-bar">
            <button id="prevBtn">上一曲</button>
            <button id="playPauseBtn">播放/暂停</button>
            <button id="nextBtn">下一曲</button>
            <input type="range" class="play-progress" id="playerProgress" value="0" max="100">
            <button id="fullScreenBtn">全屏</button>
        </div>
    </div>
</div>
<!-- 普通用户登录弹窗 账号+密码 -->
<div class="modal" id="userLoginModal">
    <div class="modal-box">
        <h4>普通用户登录</h4>
        <div class="input-item"><input placeholder="输入账号" id="userAcc"></div>
        <div class="input-item"><input type="password" placeholder="输入密码" id="userPwd"></div>
        <div class="modal-buttons">
            <button id="userLoginClose">取消</button>
            <button id="toRegBtn">注册账号</button>
            <button id="userLoginSubmit">登录</button>
        </div>
    </div>
</div>
<!-- 管理员登录弹窗 仅密钥 -->
<div class="modal" id="adminLoginModal">
    <div class="modal-box">
        <h4>管理员权限验证</h4>
        <div class="input-item"><input type="password" placeholder="输入后台管理员密钥" id="adminKeyInput"></div>
        <div class="modal-buttons">
            <button id="adminLoginClose">取消</button>
            <button id="adminLoginSubmit">验证登录</button>
        </div>
    </div>
</div>
<!-- 用户注册弹窗 -->
<div class="modal" id="userRegisterModal">
    <div class="modal-box">
        <h4>用户注册账号</h4>
        <div class="input-item"><input placeholder="设置账号" id="regAcc"></div>
        <div class="input-item"><input type="password" placeholder="设置密码" id="regPwd"></div>
        <div class="input-item"><input type="password" placeholder="再次输入密码" id="regPwd2"></div>
        <div class="modal-buttons">
            <button id="regClose">取消</button>
            <button id="toLoginBtn">返回登录</button>
            <button id="regSubmit">完成注册</button>
        </div>
    </div>
</div>
<div class="modal" id="uploadModal">
    <div class="modal-box">
        <h4>新增素材（粘贴链接/本地上传双模式）</h4>
        <label><input type="radio" name="resType" value="music" checked> 音乐</label>
        <label style="margin-left:10px"><input type="radio" name="resType" value="video"> 视频</label>
        <div style="margin:12px 0;color:#fff;font-weight:bold;">===== 在线链接粘贴区 =====</div>
        <div class="input-item"><input placeholder="歌曲/视频名称" id="resName"></div>
        <div class="input-item"><input placeholder="歌手/作者名称" id="resSinger"></div>
        <div class="input-item"><input placeholder="媒体播放网络链接" id="resMediaLink"></div>
        <div class="input-item"><input placeholder="封面图片外网链接" id="resCoverLink"></div>
        <div class="input-item"><input placeholder="歌词LRC链接（仅音乐）" id="resLyricLink"></div>
        <div style="margin:12px 0;color:#fff;font-weight:bold;">===== 本地文件上传区 =====</div>
        <div class="input-item"><input type="file" accept="audio/*,video/*" id="localMediaFile"></div>
        <div class="input-item"><input type="file" accept="image/*" id="localCoverFile"></div>
        <div class="input-item"><input type="file" accept=".lrc,.txt" id="localLrcFile"></div>
        <div class="modal-buttons">
            <button id="uploadClose">取消</button>
            <button id="uploadConfirm">提交入库（链接/文件通用）</button>
        </div>
    </div>
</div>
<div class="modal" id="statModal">
    <div class="modal-box">
        <h4>后台数据统计</h4>
        <div id="statText"></div>
        <div class="modal-buttons">
            <button id="statClose">关闭</button>
        </div>
    </div>
</div>
<div class="modal" id="commentModal">
    <div class="modal-box">
        <h4>作品评论区</h4>
        <div id="commentListBox" style="max-height:300px;overflow-y:auto;margin:10px 0;"></div>
        <div class="input-item"><input placeholder="昵称（留空默认匿名）" id="commentName"></div>
        <div class="input-item"><textarea placeholder="输入评论内容" id="commentContent" rows="3"></textarea></div>
        <div class="modal-buttons">
            <button id="commentClose">关闭</button>
            <button id="commentSubmit">发表评论</button>
        </div>
    </div>
</div>
<div class="modal" id="donateModal">
    <div class="modal-box">

    return String(min).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

async function apiFetch(path, body) {
    const headers = {"Content-Type":"application/json"};
    if(adminSecret){
        headers["X-Admin-Token"] = adminSecret;
    }
    const opt = {headers};
    if(body){
        opt.method = "POST";
        opt.body = JSON.stringify(body);
    }
    try {
        const res = await fetch(`${WORKER_DOMAIN}${path}`, opt);
        const data = await res.json();
        // 管理员密钥过期/无权限
        if(data.code === 403){
            alert("管理员密钥失效，请重新登录！");
            sessionStorage.removeItem("adminSecret");
            adminSecret = "";
            isAdmin = false;
            document.getElementById("adminLoginBtn").innerText = "管理员登录";

            dbBoxWrap.style.display = "none";

            window.location.reload();
            return null;
        }

    } catch(err) {
        console.error("接口请求失败", path, err);
        alert("网络连接失败，无法访问云端服务器");
        return null;
    }
}

// LRC解析函数
function parseLrcFull(lrcText) {
    const lineReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*?)(?=\[\d{2}:|$)/gs;
    let lineList = [];
    let match;
    while ((match = lineReg.exec(lrcText)) !== null) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = parseInt(match[3]);
        const lineStartTime = min * 60 + sec + ms / 1000;
        let content = match[4];
        const charReg = /<(\d{2}):(\d{2})\.(\d{2,3})>(.)/g;
        let charList = [];
        let charMatch;
        while ((charMatch = charReg.exec(content)) !== null) {
            const cMin = parseInt(charMatch[1]);
            const cSec = parseInt(charMatch[2]);
            const cMs = parseInt(charMatch[3]);
            const charTime = cMin * 60 + cSec + cMs / 1000;
            charList.push({ char: charMatch[4], time: charTime });
        }
        if (charList.length === 0 && content.trim()) {
            [...content].forEach(ch => charList.push({ char: ch, time: null }))
        }
        if (charList.length > 0) {
            lineList.push({ startTime: lineStartTime, chars: charList });
        }
    }
    lineList.sort((a, b) => a.startTime - b.startTime);
    return lineList;
}

// 歌词高亮同步
function syncLyricHighlight(currentTime) {
    if (globalLyricData.length === 0) return;
    const lyricWrap = document.getElementById("lyricWrap");
    const lyricBox = document.getElementById("lyricBox");
    const allLines = lyricWrap.querySelectorAll(".lyric-line");
    let activeLineIdx = -1;
    for (let i = 0; i < globalLyricData.length; i++) {
        const nextLineTime = globalLyricData[i + 1]?.startTime ?? 99999;
        if (currentTime >= globalLyricData[i].startTime && currentTime < nextLineTime) {
            activeLineIdx = i;
            break;
        }
    }
    allLines.forEach((lineDom, lineIdx) => {
        const charSpans = lineDom.querySelectorAll(".lyric-char");
        if (lineIdx !== activeLineIdx) {
            charSpans.forEach(span => span.classList.remove("active"));
            return;
        }
        charSpans.forEach((span, charIdx) => {
            const charTime = parseFloat(span.dataset.charTime);
            if (currentTime >= charTime) {
                span.classList.add("active");
            } else {
                span.classList.remove("active");
            }
        })
        const boxHeight = lyricBox.clientHeight;
        const lineTop = lineDom.offsetTop;
        const lineHeight = lineDom.offsetHeight;
        lyricWrap.style.transform = `translateY(${-(lineTop - boxHeight / 2 + lineHeight / 2)}px)`;
    })
}
// 更新进度与时间
function updateAllProgress(currentTime, totalTime) {
    if (!isFinite(totalTime)) return;
    const bottomProgress = document.getElementById("bottomProgress");
    const playerProgress = document.getElementById("playerProgress");
    const timeStart = document.getElementById("timeStart");
    const timeEnd = document.getElementById("timeEnd");
    const percent = (currentTime / totalTime) * 100;
    bottomProgress.value = percent;
    playerProgress.value = percent;
    timeStart.innerText = formatTime(currentTime);
    timeEnd.innerText = formatTime(totalTime);
    syncLyricHighlight(currentTime);
}

function getRandomComment(){
  let content = "";
  const takeTop = Math.floor(Math.random() * 3) + 1;
  for(let i=0;i<takeTop;i++){
    const ran = Math.floor(Math.random() * commentTop.length);
    content += commentTop[ran] + "，";
  }
  const bottomRan = Math.floor(Math.random() * commentBottom.length);
  content += commentBottom[bottomRan];
  return content;
}
let robotGlobalSwitch = false;
let runningRobotList = [];
let isOperating = false;
const robotMainSwitch = document.getElementById("robotMainSwitch");
const robotCountInput = document.getElementById("robotCountInput");
const startRobotBtn = document.getElementById("startRobotBtn");
const stopRobotBtn = document.getElementById("stopRobotBtn");
const runningRobotNum = document.getElementById("runningRobotNum");
const robotStatusText = document.getElementById("robotStatusText");
function stopAllRobot(){
  runningRobotList.forEach(timer=>clearInterval(timer));
  runningRobotList = [];
  runningRobotNum.innerText = 0;
  robotStatusText.innerText = "小哀AI未运行";
  startRobotBtn.disabled = false;
  startRobotBtn.style.background = "#2ecc71";
}
robotMainSwitch.onclick = function(){
    if(isOperating) return;
    isOperating = true;
    robotGlobalSwitch = !robotGlobalSwitch;
    if(robotGlobalSwitch){
        this.innerText = "已开启";
        this.style.background = "#e74c3c";
        startRobotBtn.disabled = false;
        startRobotBtn.style.background = "#2ecc71";
    }else{
        this.innerText = "已关闭";
        this.style.background = "#2ecc71";
        stopAllRobot();
    }
    setTimeout(()=>isOperating = false,300);
}
stopRobotBtn.onclick = function(){
  if(isOperating) return;
  isOperating = true;
  stopAllRobot();
  setTimeout(()=>isOperating = false,300);
}
startRobotBtn.onclick = function(){
  if(isOperating || !robotGlobalSwitch || runningRobotList.length > 0) return;
  isOperating = true;
  stopAllRobot();
  let targetNum = parseInt(robotCountInput.value);
  if(isNaN(targetNum) || targetNum < 1) targetNum = 20;
  if(targetNum > 1000) targetNum = 1000;
  for(let i=0; i<targetNum; i++){
    const cycleTime = (Math.floor(Math.random() * 240) + 240) * 1000;
    const timer = setInterval(()=>{
      if(!robotGlobalSwitch) return;
      let allRes = [...resourceWarehouse];
      if(allRes.length > 0){
        const randomIdx = Math.floor(Math.random() * allRes.length);
        const randomItem = allRes[randomIdx];
        apiFetch("/addPlayCount",{id:randomItem.id});
        if(Math.random() < 0.1){
          randomItem.isLike = !randomItem.isLike;
          apiFetch("/updateResource",{id:randomItem.id,likeCount:randomItem.likeCount});
          loadWarehouse();
        }
        if(Math.random() < 0.07){
          const nick = getRandomNickname();
          const msg = getRandomComment();
          const now = new Date().toLocaleString();
          apiFetch("/sendMsg",{workId:getItemKey(randomItem),name:nick,msg,time:now});
        }
      }
    }, cycleTime);
    runningRobotList.push(timer);
  }
  runningRobotNum.innerText = targetNum;
  robotStatusText.innerText = `${targetNum}个小哀AI运行中`;
  startRobotBtn.disabled = true;
  startRobotBtn.style.background = "#999";
  setTimeout(()=>isOperating = false,300);
}
