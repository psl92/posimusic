<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#204080,#3a6fc9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
}
.nav-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.nav-btn{
    padding: 8px 18px;
    background: #fff;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.nav-btn.active{
    background:#4299e1;
    color:#fff;
}
.nav-btn:hover:not(.active){
    background:#e6f0fc;
}
.search-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 999px 0 0 999px;
    outline: none;
    font-size: 15px;
}
.search-bar button{
    padding: 0 22px;
    border: none;
    background: #4299e1;
    color: #fff;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
.card-wrap{
    width: 96%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}
.music-card{
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #b8d8f0;
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 8px;
    overflow: hidden;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #204080;
    padding: 40px 0;
}
.player-group{
    position: fixed;
    right: 20px;
    bottom: 20px;
    display:flex;
    gap:6px;
    z-index:999;
}
.playlist-sidebar{
    width: 260px;
    height: 520px;
    background:#fff;
    border-radius:16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: width 0.3s;
}
.playlist-sidebar.collapse{
    width:0;
    overflow:hidden;
}
.sidebar-head{
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
}
.sidebar-head h4{
    font-size:14px;
    color:#222;
}
.hideSideBtn{
    border:none;
    background:#e6f0fc;
    border-radius:6px;
    padding:3px 8px;
    cursor:pointer;
}
.playlist-scroll{
    flex:1;
    overflow-y:auto;
    padding:8px;
}
.playlist-scroll::-webkit-scrollbar{
    width:4px;
}
.playlist-item{
    padding:7px 10px;
    border-radius:8px;
    margin-bottom:5px;
    background:#f0f7fc;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:0.15s;
}
.playlist-item.active{
    background:#4299e1;
    color:#fff;
}
.playlist-item:hover{
    background:#dcecf9;
}
.playlist-item.active:hover{
    background:#3487c9;
}
.item-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    max-width:82%;
}
.item-del{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#ff6b6b;
    color:#fff;
    border:none;
    font-size:12px;
    cursor:pointer;
    flex-shrink:0;
}
.showSideBtn{
    position:fixed;
    bottom:140px;
    right:290px;
    padding:6px 10px;
    background:#4299e1;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    z-index:998;
    display:none;
}
.player-box{
    width: 420px;
    height: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow: hidden;
    resize: both;
    max-width: 95vw;
    max-height: 90vh;
    min-width:340px;
    min-height:420px;
    position:relative;
}
.player-drag-header{
    width:100%;
    height:44px;
    position:absolute;
    top:0;
    left:0;
    cursor:move;
    z-index:8;
    background: transparent;
}
.fullscreen-btn{
    position: absolute;
    top: 8px;
    right: 45px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    border:none;
}
.hidePlayerBtn{
    position: absolute;
    top: 8px;
    right: 8px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    border:none;
}
.lyric-toggle-btn{
    position:absolute;
    top:8px;
    left:8px;
    z-index:10;
    padding:4px 10px;
    border:none;
    border-radius:6px;
    background:rgba(0,0,0,0.4);
    color:#fff;
    cursor:pointer;
}
.play-cover{
    width: 100%;
    height: 50%;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    background: #eee;
    display: none;
    align-items: center;
    justify-content:center;
}
.play-cover img{
    width: 120px;
    height:120px;
    border-radius:12px;
    object-fit: cover;
}
.video-view{
    width: 100%;
    height: 50%;
    background: #000;
    display:none;
    object-fit: contain;
}
.control-bar{
    padding: 10px;
    height: 50%;
    display:flex;
    flex-direction:column;
    gap:8px;
}
.media-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
}
.media-buttons button{
    padding:6px 14px;
    border:none;
    border-radius:6px;
    background:#4299e1;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}
.lyric-area{
    text-align: center;
    font-size: 16px;
    color: #333;
    margin-top: 8px;
    line-height: 1.8;
    padding:8px;
    min-height:80px;
}
/* 卡拉OK逐字样式：未播放灰色，当前高亮蓝色 */
.lyric-normal{color:#666;}
.lyric-active{color:#2596ff;font-weight:bold;}
.float-lyric-wrap{
    position: fixed;
    bottom: 30px;
    left: 30px;
    min-width:260px;
    min-height:90px;
    width:340px;
    z-index:9999;
    cursor:move;
    user-select:none;
    resize:both;
    overflow:hidden;
    display:block;
    background: transparent;
}
.lyric-line{
    padding:8px 14px;
    margin:4px 0;
    border-radius:8px;
    background:rgba(0,0,0,0.38);
    backdrop-filter:blur(6px);
    font-size:clamp(16px,2vw,26px);
    letter-spacing:2px;
}
.prev-line{
    color:#ffffff;
    opacity:0.55;
    text-align:left;
}
.curr-line{
    text-align:right;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页 Home</button>
    <button class="nav-btn" data-type="music">音乐 Music</button>
    <button class="nav-btn" data-type="video">视频 Video</button>
    <button class="nav-btn" data-type="image">图片</button>
    <button class="nav-btn" data-type="reward">赞赏</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索 Search</button>
</div>

<div class="card-wrap" id="cardContainer">
    <div class="load-tip">正在加载资源，请稍等...</div>
</div>

<div class="player-group" id="playerGroup">
    <div class="playlist-sidebar" id="playlistSide">
        <div class="sidebar-head">
            <h4>播放目录</h4>
            <button class="hideSideBtn" id="hideSideBtn">收起</button>
        </div>
        <div class="playlist-scroll" id="playlistScroll"></div>
    </div>
    <div class="player-box" id="playerWrap">
        <div class="player-drag-header" id="playerDragHead"></div>
        <button class="lyric-toggle-btn" id="lyricToggleBtn">悬浮歌词</button>
        <button class="fullscreen-btn" id="fullBtn">⛶</button>
        <button class="hidePlayerBtn" id="hidePlayerBtn">−</button>
        <div class="play-cover" id="playCoverBox">
            <img id="playCoverImg">
        </div>
        <video class="video-view" id="mainVideo" controls playsinline webkit-playsinline></video>
        <div class="control-bar">
            <div class="media-buttons">
                <button id="prevBtn">后退10s</button>
                <button id="playPauseBtn">暂停</button>
                <button id="nextBtn">前进10s</button>
            </div>
            <div class="lyric-area" id="lyricBox">暂无播放内容</div>
        </div>
    </div>
</div>
<button class="showSideBtn" id="showSideBtn">展开播放目录</button>

<div class="float-lyric-wrap" id="floatLyricWrap">
    <div class="lyric-line prev-line" id="prevLyric"></div>
    <div class="lyric-line curr-line" id="currLyric"></div>
</div>

<audio id="mainAudio" preload="auto">

<script>
const API_BASE = "https://api.busisi.com";
let currentPlayList = [];
let currentTabType = "all";
let allResourceList = [];
let nowPlayingItem = null;
let parsedLyricList = [];
let lastPlayTime = 0;
let playerCollapsed = false;

const dom = {
    cardContainer: document.getElementById("cardContainer"),
    searchInput: document.getElementById("searchInput"),
    searchBtn: document.getElementById("searchBtn"),
    navBtns: document.querySelectorAll(".nav-btn"),
    fullBtn: document.getElementById("fullBtn"),
    hidePlayerBtn: document.getElementById("hidePlayerBtn"),
    mainVideo: document.getElementById("mainVideo"),
    mainAudio: document.getElementById("mainAudio"),
    playCoverBox: document.getElementById("playCoverBox"),
    playCoverImg: document.getElementById("playCoverImg"),
    lyricBox: document.getElementById("lyricBox"),
    floatLyricWrap: document.getElementById("floatLyricWrap"),
    prevLyric: document.getElementById("prevLyric"),
    currLyric: document.getElementById("currLyric"),
    lyricToggleBtn: document.getElementById("lyricToggleBtn"),
    playerWrap: document.getElementById("playerWrap"),
    playerDragHead:document.getElementById("playerDragHead"),
    playlistSide:document.getElementById("playlistSide"),
    playlistScroll:document.getElementById("playlistScroll"),
    hideSideBtn:document.getElementById("hideSideBtn"),
    showSideBtn:document.getElementById("showSideBtn"),
    playerGroup:document.getElementById("playerGroup"),
    prevBtn:document.getElementById("prevBtn"),
    nextBtn:document.getElementById("nextBtn"),
    playPauseBtn:document.getElementById("playPauseBtn")
};

// 侧边播放列表收起展开
dom.hideSideBtn.onclick = ()=>{
    dom.playlistSide.classList.add("collapse");
    dom.showSideBtn.style.display = "block";
}
dom.showSideBtn.onclick = ()=>{
    dom.playlistSide.classList.remove("collapse");
    dom.showSideBtn.style.display = "none";
}

// 播放器整体收起/展开
dom.hidePlayerBtn.onclick = ()=>{
    playerCollapsed = !playerCollapsed;
    if(playerCollapsed){
        dom.playerWrap.style.height = "60px";
        dom.playerWrap.style.resize = "none";
        dom.playCoverBox.style.display = "none";
        dom.mainVideo.style.display = "none";
        dom.lyricBox.style.display = "none";
    }else{
        dom.playerWrap.style.height = "520px";
        dom.playerWrap.style.resize = "both";
        dom.lyricBox.style.display = "block";
        if(nowPlayingItem?.type==="video") dom.mainVideo.style.display = "block";
        if(nowPlayingItem?.type==="music") dom.playCoverBox.style.display = "flex";
    }
}

// 播放器拖拽
(function initPlayerDrag(){
    const dragHead = dom.playerDragHead;
    const groupWrap = dom.playerGroup;
    let dragging = false, offsetX, offsetY;
    dragHead.addEventListener("mousedown",(e)=>{
        dragging=true;
        const rect = groupWrap.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        e.preventDefault();
    })
    document.addEventListener("mousemove",(e)=>{
        if(!dragging) return;
        let posX = e.clientX - offsetX;
        let posY = e.clientY - offsetY;
        posX = Math.max(0, Math.min(posX, window.innerWidth - groupWrap.offsetWidth));
        posY = Math.max(0, Math.min(posY, window.innerHeight - groupWrap.offsetHeight));
        groupWrap.style.left = `${posX}px`;
        groupWrap.style.top = `${posY}px`;
    })
    document.addEventListener("mouseup",()=>dragging=false);
})();

// 悬浮歌词拖拽
(function initLyricDrag(){
    const wrap = dom.floatLyricWrap;
    let dragging = false, ox, oy;
    wrap.addEventListener("mousedown",e=>{
        const rect = wrap.getBoundingClientRect();
        const edgeRange =14;
        const isResizeArea = e.clientX-rect.left<edgeRange || rect.right-e.clientX<edgeRange
        || e.clientY-rect.top<edgeRange || rect.bottom-e.clientY<edgeRange;
        if(isResizeArea) return;
        dragging = true;
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });
    document.addEventListener("mousemove",e=>{
        if(!dragging) return;
        let x = e.clientX-ox;
        let y = e.clientY-oy;
        x = Math.max(0, Math.min(x, window.innerWidth-wrap.offsetWidth));
        y = Math.max(0, Math.min(y, window.innerHeight-wrap.offsetHeight));
        wrap.style.left = `${x}px`;
        wrap.style.top = `${y}px`;
    });
    document.addEventListener("mouseup",()=>dragging=false);
})();

dom.lyricToggleBtn.addEventListener("click",()=>{
    dom.floatLyricWrap.style.display = dom.floatLyricWrap.style.display==="none"?"block":"none";
});

// 播放控制按钮绑定
function getCurrentMedia(){
    return nowPlayingItem?.type==="video"?dom.mainVideo:dom.mainAudio;
}
dom.prevBtn.onclick = ()=>{
    const m = getCurrentMedia(); if(!m) return; m.currentTime -=10;
}
dom.nextBtn.onclick = ()=>{
    const m = getCurrentMedia(); if(!m) return; m.currentTime +=10;
}
dom.playPauseBtn.onclick = ()=>{
    const m = getCurrentMedia(); if(!m) return;
    m.paused ? m.play() : m.pause();
}
// 同步暂停按钮文字
function syncPlayBtnText(){
    const m = getCurrentMedia();
    if(!m){dom.playPauseBtn.innerText="暂停";return;}
    dom.playPauseBtn.innerText = m.paused ? "播放" : "暂停";
}

// LRC解析 + 卡拉OK逐字拆分核心逻辑
function parseLRC(text){
    const result = [];
    const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
    text.split("\n").forEach(line=>{
        line=line.trim();
        const m=line.match(reg);
        if(!m)return;
        const time = parseInt(m[1])*60 + parseInt(m[2]) + (parseInt(m[3]||0)/1000);
        const txt=m[4].trim();
        if(!txt) return;
        // 单字均分时长，实现逐字变色
        const charCount = txt.length;
        result.push({time, text:txt, charCount});
    });
    return result.sort((a,b)=>a.time-b.time);
}
// 渲染卡拉OK逐字HTML
function renderKaraokeLine(lineText, progressRatio){
    let html = "";
    for(let i=0;i<lineText.length;i++){
        const isActive = i < Math.floor(lineText.length * progressRatio);
        html += `<span class="${isActive?'lyric-active':'lyric-normal'}">${lineText[i]}</span>`;
    }
    return html;
}
// 更新逐字变色歌词
function updateFloatLyric(nowT){
    lastPlayTime = nowT;
    syncPlayBtnText();
    if(!parsedLyricList.length){
        dom.prevLyric.innerText="";
        dom.currLyric.innerHTML="<span class='lyric-normal'>暂无歌词</span>";
        dom.lyricBox.innerHTML="<span class='lyric-normal'>暂无歌词</span>";
        return;
    }
    let currIndex=0;
    for(let i=0;i<parsedLyricList.length;i++){
        if(nowT>=parsedLyricList[i].time) currIndex=i;
        else break;
    }
    const currLine = parsedLyricList[currIndex];
    const nextTime = parsedLyricList[currIndex+1]?.time || (currLine.time + 5);
    const lineTotalDuration = nextTime - currLine.time;
    const linePassDuration = nowT - currLine.time;
    const ratio = Math.min(1, linePassDuration / lineTotalDuration);
    // 主歌词区逐字变色
    dom.lyricBox.innerHTML = renderKaraokeLine(currLine.text, ratio);
    // 悬浮歌词上下行展示
    dom.prevLyric.innerText=parsedLyricList[currIndex-1]?.text||"";
    dom.currLyric.innerHTML = renderKaraokeLine(currLine.text, ratio);
}

//全局快捷键
document.addEventListener("keydown",e=>{
    const targetTag = e.target.tagName;
    if(targetTag === "INPUT" || targetTag === "TEXTAREA") return;
    const media = getCurrentMedia();
    if(!media) return;
    switch(e.code){
        case "Space":
            e.preventDefault();
            media.paused ? media.play().catch(()=>{}) : media.pause();
            syncPlayBtnText();
            break;
        case "ArrowLeft":
            e.preventDefault();
            media.currentTime -=10;
            break;
        case "ArrowRight":
            e.preventDefault();
            media.currentTime +=10;
            break;
        case "KeyF":
            toggleFullScreen();
            break;
        case "Escape":
            if(document.fullscreenElement || document.webkitFullscreenElement){
                exitFull();
            }
            break;
    }
})

// 全屏控制
function enterFull(el){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
function exitFull(){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleFullScreen(){
    const targetBox = dom.playerWrap;
    if(document.fullscreenElement || document.webkitFullscreenElement){
        exitFull();
    }else{
        enterFull(targetBox);
    }
}
document.addEventListener('fullscreenchange',()=>{
    dom.fullBtn.innerText = document.fullscreenElement ? "⊡" : "⛶";
});
document.addEventListener('webkitfullscreenchange',()=>{
    dom.fullBtn.innerText = document.webkitFullscreenElement ? "⊡" : "⛶";
});
dom.fullBtn.addEventListener("click",toggleFullScreen);

window.addEventListener("load", async () => {
    if(location.protocol==="file:"){
        dom.cardContainer.innerHTML=`<div class="load-tip" style="color:red">禁止本地双击打开HTML，必须网页托管访问</div>`;
        return;
    }
    dom.navBtns.forEach(btn=>{
        btn.addEventListener("click",()=>{
            dom.navBtns.forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            currentTabType=btn.dataset.type;
            renderFilterList();
        });
    });
    dom.searchBtn.addEventListener("click",searchResource);
    dom.searchInput.addEventListener("keydown",e=>e.key==="Enter"&&searchResource());

    const timeUpdateFunc = function(){
        updateFloatLyric(this.currentTime);
    }
    dom.mainVideo.ontimeupdate = timeUpdateFunc;
    dom.mainAudio.ontimeupdate = timeUpdateFunc;

    try{
        const res=await fetch(`${API_BASE}/getResourceList`);
        if(!res.ok) throw new Error(`接口状态码:${res.status}`);
        allResourceList=await res.json();
        renderFilterList();
    }catch(err){
        dom.cardContainer.innerHTML=`<div class="load-tip" style="color:red">接口连接失败<br>检查Worker部署/R2绑定<br>${err.message}</div>`;
        console.error(err);
    }
});

function renderFilterList(){
    let list=allResourceList;
    if(currentTabType!=="all") list=list.filter(i=>i.type===currentTabType);
    renderCard(list);
}
function renderCard(list){
    dom.cardContainer.innerHTML="";
    if(!list.length){
        dom.cardContainer.innerHTML='<div class="load-tip">暂无资源</div>';
        return;
    }
    list.forEach(item=>{
        const card=document.createElement("div");
        card.className="music-card";
        const cover=item.coverImg?`<div class="cover-box"><img src="${item.coverImg}"></div>`:`<div class="cover-box">无封面</div>`;
        card.innerHTML=`${cover}<div class="card-text">${item.singer||"未知歌手"} - ${item.name}</div>`;
        card.onclick=()=>{
            addPlaylist(item);
            playMedia(item);
        };
        dom.cardContainer.appendChild(card);
    })
}

function addPlaylist(item){
    if(currentPlayList.some(i=>i.id===item.id))return;
    currentPlayList.push(item);
    renderPlaylist();
}

function renderPlaylist(){
    dom.playlistScroll.innerHTML="";
    if(currentPlayList.length===0){
        dom.playlistScroll.innerHTML='<div style="text-align:center;padding:20px;color:#999">播放目录为空</div>';
        return;
    }
    currentPlayList.forEach((item,index)=>{
        const div=document.createElement("div");
        div.className="playlist-item";
        if(nowPlayingItem && nowPlayingItem.id===item.id) div.classList.add("active");
        div.innerHTML=`
            <div class="item-name">${index+1}. ${item.singer||"未知歌手"} - ${item.name}</div>
            <button class="item-del">×</button>
        `;
        div.ondblclick = ()=>{
            playMedia(item);
        }
        div.querySelector(".item-del").onclick=(e)=>{
            e.stopPropagation();
            currentPlayList = currentPlayList.filter(v=>v.id!==item.id);
            renderPlaylist();
        }
        dom.playlistScroll.appendChild(div);
    })
}

async function playMedia(item){
    nowPlayingItem=item;
    dom.mainVideo.pause();
    dom.mainVideo.src = "";
    dom.mainVideo.style.display = "none";
    dom.mainAudio.pause();
    dom.mainAudio.src = "";
    dom.playCoverBox.style.display = "none";
    parsedLyricList = [];
    lastPlayTime = 0;
    dom.prevLyric.innerText = "";
    dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无歌词</span>";
    dom.lyricBox.innerHTML = "<span class='lyric-normal'>加载歌词中...</span>";
    playerCollapsed=false;
    dom.playerWrap.style.height="520px";
    dom.playerWrap.style.resize="both";
    dom.lyricBox.style.display="block";

    if(item.type === "video"){
        dom.mainVideo.style.display = "block";
        dom.mainVideo.src = item.videoLink;
        dom.mainVideo.onloadedmetadata = function(){
            dom.mainVideo.play().catch(err=>{
                dom.lyricBox.innerHTML="<span class='lyric-normal'>浏览器阻止自动播放，请手动点击播放</span>";
            });
            syncPlayBtnText();
        }
    }else if(item.type === "music"){
        dom.playCoverBox.style.display = "flex";
        dom.mainAudio.src = item.audioLink;
        dom.mainAudio.load();
        dom.mainAudio.oncanplaythrough = function(){
            dom.mainAudio.play().catch(err=>{
                dom.lyricBox.innerHTML="<span class='lyric-normal'>浏览器阻止自动播放，请手动点击播放</span>";
            });
            syncPlayBtnText();
        }
    }
    if(item.coverImg) dom.playCoverImg.src=item.coverImg;
    renderPlaylist();

    if(!item.lyricName){
        dom.lyricBox.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        return;
    }
    try{
        const lyricRes=await fetch(`${API_BASE}/getLyric?name=${encodeURIComponent(item.lyricName)}`);
        if(lyricRes.ok){
            const txt=await lyricRes.text();
            parsedLyricList=parseLRC(txt);
            updateFloatLyric(0);
        }else {
            dom.lyricBox.innerHTML="<span class='lyric-normal'>暂无匹配歌词</span>";
            dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        }
    }catch(err){
        dom.lyricBox.innerHTML="<span class='lyric-normal'>歌词加载失败</span>";
        dom.currLyric.innerHTML = "<span class='lyric-normal'>歌词加载失败</span>";
        console.log("歌词请求异常",err);
    }
}

function searchResource(){
    const kw=dom.searchInput.value.trim().toLowerCase();
    if(!kw){
        renderFilterList();
        return;
    }
    let src=currentTabType==="all"?allResourceList:allResourceList.filter(i=>i.type===currentTabType);
    const res=src.filter(v=>{
        const n=(v.name||"").toLowerCase(),s=(v.singer||"").toLowerCase();
        return n.includes(kw)||s.includes(kw);
    });
    renderCard(res);
}
</script>
</body>
