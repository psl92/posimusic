<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 360px;
}
/* 标题 */
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#204080,#3a6fc9);
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: 3px;
}
/* 导航栏 */
.nav-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.nav-btn{
    padding: 8px 18px;
    background: #fff;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.nav-btn.active{
    background:#4299e1;
    color:#fff;
}
.nav-btn:hover:not(.active){
    background:#e6f0fc;
}
/* 搜索 */
.search-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 999px 0 0 999px;
    outline: none;
    font-size: 15px;
}
.search-bar button{
    padding: 0 22px;
    border: none;
    background: #4299e1;
    color: #fff;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
/* 卡片容器 */
.card-wrap{
    width: 96%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}
/* 歌曲卡片 */
.music-card{
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #b8d8f0;
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 8px;
    overflow: hidden;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* 加载提示 */
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #204080;
    padding: 40px 0;
}
/* 悬浮播放器 */
.player-box{
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 420px;
    height: 340px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow: hidden;
    resize: both;
    z-index: 999;
}
.fullscreen-btn{
    position: absolute;
    top: 8px;
    right: 8px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 5;
}
.play-cover{
    width: 120px;
    height: 120px;
    margin: 10px auto;
    border-radius: 12px;
    overflow: hidden;
    background: #eee;
    display: none;
}
.play-cover img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.video-view{
    width: 100%;
    height: 58%;
    background: #000;
}
.control-bar{
    padding: 10px;
    height: 42%;
}
.play-list{
    height: 76px;
    overflow-x: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}
.list-item{
    position: relative;
    padding: 6px 10px;
    background: #f0f7fc;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 13px;
}
.del-btn{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: #ff6b6b;
    color: #fff;
    font-size: 11px;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    cursor: pointer;
}
.lyric-area{
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    line-height: 1.5;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页</button>
    <button class="nav-btn" data-type="music">音乐</button>
    <button class="nav-btn" data-type="video">视频</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索</button>
</div>

<div class="card-wrap" id="cardContainer">
    <div class="load-tip">正在加载资源，请稍等...</div>
</div>

<div class="player-box" id="playerWrap">
    <div class="fullscreen-btn" id="fullBtn">⛶</div>
    <div class="play-cover" id="playCoverBox">
        <img id="playCoverImg">
    </div>
    <video class="video-view" id="mainVideo" controls></video>
    <div class="control-bar">
        <div class="play-list" id="playListBox"></div>
        <div class="lyric-area" id="lyricBox">暂无播放内容</div>
    </div>
</div>

<script>
// 后端域名，和Worker自定义域名保持一致
const API_BASE = "https://api.busisi.com";
let currentPlayList = [];
let currentTabType = "all";
let allResourceList = [];

// 页面初始化
window.onload = async function(){
    // 判断本地文件打开直接提示跨域
    if(location.protocol === "file:"){
        alert("禁止本地打开HTML！会出现跨域无法连接接口，请上传网页托管访问");
        return;
    }
    try{
        const res = await fetch(`${API_BASE}/getResourceList`);
        if(!res.ok) throw new Error(`接口返回异常：${res.status}`);
        allResourceList = await res.json();
        filterAndRender();
        bindTabSwitch();
    }catch(err){
        document.getElementById("cardContainer").innerHTML = `
            <div class="load-tip" style="color:red">
                连接后端失败！<br>
                1.检查Worker是否完整部署<br>
                2.确认域名api.busisi.com已生效<br>
                3.R2桶已绑定、文件夹已创建<br>
                错误信息：${err.message}
            </div>
        `;
        console.error("加载资源列表失败：",err);
    }
}

// 导航切换
function bindTabSwitch(){
    const tabs = document.querySelectorAll(".nav-btn");
    tabs.forEach(tab=>{
        tab.onclick = function(){
            tabs.forEach(t=>t.classList.remove("active"));
            this.classList.add("active");
            currentTabType = this.dataset.type;
            filterAndRender();
        }
    })
}

// 分类筛选
function filterAndRender(){
    let list = allResourceList;
    if(currentTabType !== "all"){
        list = list.filter(item=>item.type === currentTabType);
    }
    renderCard(list);
}

// 渲染卡片（带封面）
function renderCard(list){
    const container = document.getElementById("cardContainer");
    container.innerHTML = "";
    if(list.length === 0){
        container.innerHTML = '<div class="load-tip">暂无匹配资源</div>';
        return;
    }
    list.forEach(item=>{
        const div = document.createElement("div");
        div.className = "music-card";
        let coverHtml = "";
        if(item.coverImg){
            coverHtml = `<div class="cover-box"><img src="${item.coverImg}" alt="封面"></div>`;
        }else{
            coverHtml = `<div class="cover-box">无封面</div>`;
        }
        div.innerHTML = `
            ${coverHtml}
            <div class="card-text">${item.singer || "未知歌手"} - ${item.name}</div>
        `;
        div.onclick = ()=>{
            addToPlayList(item);
            playMedia(item);
        }
        container.appendChild(div);
    })
}

// 添加到播放列表（去重）
function addToPlayList(item){
    const exist = currentPlayList.find(v=>v.id === item.id);
    if(exist) return;
    currentPlayList.push(item);
    renderPlayList();
}

// 渲染播放列表
function renderPlayList(){
    const box = document.getElementById("playListBox");
    box.innerHTML = "";
    currentPlayList.forEach(item=>{
        const dom = document.createElement("div");
        dom.className = "list-item";
        dom.innerHTML = `
            ${item.singer} - ${item.name}
            <span class="del-btn">×</span>
        `;
        // 切换播放
        dom.onclick = e=>{
            if(e.target.className === "del-btn") return;
            playMedia(item);
        }
        // 删除歌曲
        dom.querySelector(".del-btn").onclick = e=>{
            e.stopPropagation();
            currentPlayList = currentPlayList.filter(v=>v.id !== item.id);
            renderPlayList();
        }
        box.appendChild(dom);
    })
}

// 播放媒体+加载歌词+更新封面
async function playMedia(item){
    const video = document.getElementById("mainVideo");
    const coverBox = document.getElementById("playCoverBox");
    const coverImg = document.getElementById("playCoverImg");
    const lyricBox = document.getElementById("lyricBox");

    video.pause();
    video.src = "";
    lyricBox.innerText = "加载歌词中...";

    // 赋值播放地址
    if(item.type === "video" && item.videoLink){
        video.src = item.videoLink;
    }else if(item.audioLink){
        video.src = item.audioLink;
    }
    if(video.src) video.play().catch(e=>console.log("播放拦截：",e));

    // 播放器封面
    if(item.coverImg){
        coverBox.style.display = "block";
        coverImg.src = item.coverImg;
    }else{
        coverBox.style.display = "none";
    }

    // 请求歌词接口
    try{
        const lyricRes = await fetch(`${API_BASE}/getLyric?name=${item.lyricName}`);
        if(lyricRes.ok){
            const text = await lyricRes.text();
            lyricBox.innerText = text.slice(0,130)+"...";
        }else{
            lyricBox.innerText = "暂无匹配歌词";
        }
    }catch{
        lyricBox.innerText = "歌词加载失败";
    }
}

// 全屏控制
document.getElementById("fullBtn").onclick = function(){
    const video = document.getElementById("mainVideo");
    if(document.fullscreenElement){
        document.exitFullscreen();
        this.innerText = "⛶";
    }else{
        video.requestFullscreen?.();
        this.innerText = "⊡";
    }
}

// 搜索功能
document.getElementById("searchBtn").onclick = function(){
    const key = document.getElementById("searchInput").value.trim().toLowerCase();
    if(!key) return filterAndRender();
    let source = allResourceList;
    if(currentTabType !== "all") source = source.filter(i=>i.type === currentTabType);
    const result = source.filter(v=>{
        const n = (v.name||"").toLowerCase();
        const s = (v.singer||"").toLowerCase();
        return n.includes(key) || s.includes(key);
    })
    renderCard(result);
}
</script>
</body>
</html>
