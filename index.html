<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Posimusic 播放器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f7f5fc;
    color:#222;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Microsoft Yahei",sans-serif;
    overflow:hidden;
}
/* 顶部导航 */
.top-header{
    height:72px;
    display:flex;
    align-items:center;
    padding:0 24px;
    gap:24px;
    border-bottom:1px solid #e2dde9;
    position:fixed;
    top:0;left:0;right:0;
    background:#fff;
    z-index:100;
}
.search-box{
    width:280px;
    border:1px solid #d8d2e3;
    border-radius:99px;
    padding:8px 14px;
    outline:none;
}
.tab-group{display:flex;gap:32px;}
.tab-item{cursor:pointer;font-size:15px;color:#666;}
.tab-item.active{color:#7b42d8;font-weight:bold;}
/* 左侧历史侧边栏 */
.left-sidebar{
    width:190px;
    position:fixed;
    top:72px;bottom:88px;
    left:0;
    background:#fff;
    border-right:1px solid #e2dde9;
    padding:16px 12px;
    overflow-y:auto;
}
.sidebar-title{font-weight:bold;margin-bottom:12px;font-size:16px;}
.history-item{
    padding:8px 6px;
    font-size:14px;
    border-radius:6px;
    cursor:pointer;
}
.history-item:hover{background:#f1ecfa;}
/* 主卡片区域 */
.main-content{
    margin-top:72px;
    margin-left:190px;
    margin-bottom:88px;
    padding:20px;
    height:calc(100vh - 72px - 88px);
    overflow-y:auto;
}
.card-wrap{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:18px;
}
.card-item{
    background:#fff;
    border-radius:12px;
    padding:12px;
    border:1px solid #e9e4f2;
    cursor:pointer;
    transition:0.2s;
}
.card-item:hover{transform:translateY(-3px);box-shadow:0 6px 14px #00000012;}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:8px;
    position:relative;
    overflow:hidden;
    background:#eee;
}
.card-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.card-more{
    position:absolute;
    top:6px;right:6px;
    width:22px;height:22px;
    border-radius:50%;
    background:#00000040;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
}
.card-play{
    position:absolute;
    bottom:6px;right:6px;
    width:26px;height:26px;
    border-radius:50%;
    background:#7b42d8;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
}
.card-info{margin-top:10px;}
.card-title{
    font-weight:bold;font-size:14px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.card-author{font-size:12px;color:#777;margin:4px 0;}
.card-stat{
    font-size:11px;color:#888;
    display:flex;gap:8px;flex-wrap:wrap;
    margin:6px 0;
}
.btn-card-download{
    width:100%;
    padding:5px 0;
    border:none;
    background:#ede6f9;
    color:#7b42d8;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}
/* 底部常驻播放器 */
.bottom-player{
    height:88px;
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid #e2dde9;
    display:flex;align-items:center;
    padding:0 24px;
    gap:14px;
    z-index:99999 !important;
}
.bottom-player button{
    background:none;border:none;
    font-size:20px;
    cursor:pointer;
    color:#444;
}
.progress-wrap{
    flex:1;
}
.progress-bar{
    width:100%;height:6px;
    background:#e2dde9;
    border-radius:99px;
    position:relative;
    cursor:pointer;
}
.progress-dot{
    position:absolute;
    width:14px;height:14px;
    background:#7b42d8;
    border-radius:50%;
    top:-4px;
}
/* 弹窗播放器遮罩 */
.popup-mask{
    position:fixed;
    inset:0;
    background:#00000070;
    z-index:200;
    display:none;
    align-items:center;justify-content:center;
}
.popup-mask.show{display:flex;}
.popup-player-box{
    width:620px;
    background:#fff;
    border-radius:16px;
    padding:24px;
    position:relative;
}
.popup-close{
    position:absolute;
    top:14px;right:14px;
    border:none;background:none;font-size:24px;cursor:pointer;
}
.popup-info{margin-bottom:12px;}
.popup-title{font-size:20px;font-weight:bold;}
.popup-author{font-size:14px;color:#777;margin-top:4px;}
.popup-media{
    width:100%;
    max-height:320px;
    background:#000;
    border-radius:8px;
    margin-bottom:14px;
}
.popup-control{
    display:flex;gap:16px;justify-content:center;
    margin-top:10px;
}
.popup-control button{
    padding:8px 18px;
    border:1px solid #b8a2dd;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    color:#7b42d8;
}
/* 卡片更多弹出菜单 */
.card-more-menu{
    position:fixed;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px 0;
    min-width:120px;
    z-index:300;
    display:none;
}
.card-more-menu.show{display:block;}
.card-more-menu div{
    padding:7px 14px;
    cursor:pointer;
    font-size:13px;
}
.card-more-menu div:hover{background:#f3f0fa;}
/* 可拖拽悬浮歌词 */
.float-lyric{
    position:absolute;
    width:420px;
    background:#ffffffdd;
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:14px;
    left:100px;top:120px;
    cursor:move;
    z-index:210;
    display:none;
}
.float-lyric.show{display:block;}
.lyric-search-row{
    display:flex;gap:8px;margin-bottom:10px;
}
.lyric-search-input{
    flex:1;
    padding:6px 10px;
    border:1px solid #c8b8e2;
    border-radius:6px;
    outline:none;
}
.lyric-btn{
    padding:6px 10px;
    border:1px solid #b8a2dd;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
    color:#7b42d8;
    font-size:13px;
}
.lyric-container{
    min-height:220px;
    overflow:hidden;
}
.lyric-item{
    text-align:center;
    font-size:15px;
    line-height:2.2;
    color:#44444480;
    transition:all 0.3s ease;
}
.lyric-item.active{
    color:#7b42d8;
    font-weight:bold;
    font-size:18px;
    opacity:1;
}
/* 逐字变色：已唱过的字 */
.lyric-char.sung{
    color:#7b42d8;
    font-weight:bold;
}
.lyric-char.unsung{
    color:#44444480;
}
/* 响应式适配 */
@media (max-width:1400px){
    .card-wrap{grid-template-columns:repeat(6,1fr);}
}
@media (max-width:1000px){
    .card-wrap{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:720px){
    .left-sidebar{display:none;}
    .main-content{margin-left:0;}
    .card-wrap{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<!--顶部导航-->
<div class="top-header">
    <input class="search-box" placeholder="搜索作品、作者"/>
    <div class="tab-group">
        <div class="tab-item active" data-type="music">音乐</div>
        <div class="tab-item" data-type="video">视频</div>
        <div class="tab-item" data-type="image">图片</div>
    </div>
</div>
<!--左侧历史播放侧边栏-->
<div class="left-sidebar">
    <div class="sidebar-title">历史播放</div>
    <div id="historyList"></div>
</div>
<!--主卡片区域-->
<div class="main-content">
    <div class="card-wrap" id="cardWrap"></div>
</div>
<!--底部常驻播放器-->
<div class="bottom-player">
    <button id="btnPrev">◀</button>
    <button id="btnPlay">▶</button>
    <button id="btnNext">▶▶</button>
    <button id="btnRewind">⏪</button>
    <button id="btnForward">⏩</button>
    <div class="progress-wrap">
        <div class="progress-bar" id="bottomProgressBar">
            <div class="progress-dot" id="bottomDot"></div>
        </div>
    </div>
    <button id="btnBottomFav">♡</button>
    <button id="btnMode">🔁</button>
    <button id="btnBottomPause">⏸</button>
    <button id="btnFullScreen">⛶全屏</button>
</div>
<!--弹窗播放器遮罩-->
<div class="popup-mask" id="popupMask">
    <div class="popup-player-box">
        <button class="popup-close" id="popupClose">×</button>
        <div class="popup-info">
            <div class="popup-title" id="popTitle"></div>
            <div class="popup-author" id="popAuthor"></div>
        </div>
        <video class="popup-media" id="popMedia"></video>
        <div class="popup-control">
            <button id="popPrev">上一曲</button>
            <button id="popPlay">播放</button>
            <button id="popNext">下一曲</button>
            <button id="popFull">全屏(F)</button>
        </div>
    </div>
</div>
<!--卡片更多菜单-->
<div class="card-more-menu" id="moreMenu">
    <div data-act="share">分享</div>
    <div data-act="addToCollect">加入收藏</div>
    <div data-act="copyKey">复制资源Key</div>
</div>
<!--可拖拽悬浮歌词面板-->
<div class="float-lyric" id="floatLyric">
    <div class="lyric-search-row">
        <input class="lyric-search-input" id="lyricSearchInput" placeholder="输入R2桶内的歌词文件名，例：lyric/朝歌.lrc"/>
        <button class="lyric-btn" id="lyricSearchBtn">加载歌词</button>
        <button class="lyric-btn" id="lyricImportBtn">本地导入</button>
        <input type="file" accept=".lrc,.krc,.qrc,.trc" id="lyricFileInput" style="display:none;">
    </div>
    <div class="lyric-container" id="lyricContainer"></div>
</div>
<script>
// =========对接你部署好的Worker地址=========
const API_BASE = "https://api.busisi.com";
// 默认封面占位图
const DEFAULT_COVER = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect fill='%23ddd' width='300' height='300'/><text x='50%' y='50%' font-size='22' text-anchor='middle' fill='%23888'>暂无封面</text></svg>";
//支持格式
const AUDIO_EXTS = [".mp3",".flac",".wav",".m4a",".ogg"];
const VIDEO_EXTS = [".mp4",".mov",".webm"];
const LYRIC_EXTS = [".lrc",".krc",".qrc",".trc"];
const MAX_SHOW_LINES = 7;
const MAX_HISTORY_COUNT = 50;
let playQueue = [];
let currentIndex = 0;
let playMode = 0;
let lyricArr = [];
let currentPlayItem = null;
let currentLyricLine = -1;
let playCountTimer = null;
const dom = {
    floatLyric:document.getElementById("floatLyric"),
    lyricContainer:document.getElementById("lyricContainer"),
    lyricSearchInput:document.getElementById("lyricSearchInput"),
    lyricSearchBtn:document.getElementById("lyricSearchBtn"),
    lyricImportBtn:document.getElementById("lyricImportBtn"),
    lyricFileInput:document.getElementById("lyricFileInput"),
    cardWrap:document.getElementById("cardWrap"),
    historyList:document.getElementById("historyList"),
    popupMask:document.getElementById("popupMask"),
    popupClose:document.getElementById("popupClose"),
    popTitle:document.getElementById("popTitle"),
    popAuthor:document.getElementById("popAuthor"),
    popMedia:document.getElementById("popMedia"),
    popPlay:document.getElementById("popPlay"),
    popFull:document.getElementById("popFull"),
    moreMenu:document.getElementById("moreMenu"),
    btnPrev:document.getElementById("btnPrev"),
    btnPlay:document.getElementById("btnPlay"),
    btnNext:document.getElementById("btnNext"),
    btnRewind:document.getElementById("btnRewind"),
    btnForward:document.getElementById("btnForward"),
    bottomProgressBar:document.getElementById("bottomProgressBar"),
    bottomDot:document.getElementById("bottomDot"),
    btnBottomFav:document.getElementById("btnBottomFav"),
    btnMode:document.getElementById("btnMode"),
    btnBottomPause:document.getElementById("btnBottomPause"),
    btnFullScreen:document.getElementById("btnFullScreen")
};
//播放数：12万 ~ 800万随机保底
function getRandomPlayCount(){
    const min = 120000;
    const max = 8000000;
    return Math.floor(Math.random()*(max - min + 1)) + min;
}
//每分钟自动累加播放次数
function startAutoPlayCount() {
    if(!currentPlayItem) return;
    if(playCountTimer) clearInterval(playCountTimer);
    playCountTimer = setInterval(()=>{
        if(!currentPlayItem) return;
        if(dom.popMedia.paused) return;
        currentPlayItem.playCount += 1;
    }, 60000);
}
function stopAutoPlayCount() {
    if(playCountTimer){
        clearInterval(playCountTimer);
        playCountTimer = null;
    }
}
//========播放历史 localStorage持久化========
function getPlayHistory(){
    const raw = localStorage.getItem("posiPlayHistory");
    if(!raw) return [];
    try{
        return JSON.parse(raw);
    }catch(e){
        return [];
    }
}
function savePlayHistory(arr){
    localStorage.setItem("posiPlayHistory",JSON.stringify(arr));
}
//新增播放历史，重复播放移到最前面
function addPlayHistory(item){
    let list = getPlayHistory();
    const idx = list.findIndex(i=>i.resourceKey === item.resourceKey);
    if(idx > -1){
        list.splice(idx,1);
    }
    list.unshift(item);
    if(list.length > MAX_HISTORY_COUNT){
        list.length = MAX_HISTORY_COUNT;
    }
    savePlayHistory(list);
    renderHistory();
}
//渲染历史，带序号1,2,3...
function renderHistory() {
    dom.historyList.innerHTML = "";
    const list = getPlayHistory();
    if(list.length === 0){
        dom.historyList.innerHTML = `<div style="opacity:0.6;font-size:13px;">暂无播放记录</div>`;
        return;
    }
    list.forEach((item,index)=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent = `${index+1}. ${item.name}`;
        div.onclick = ()=> openPopupPlayer(item);
        dom.historyList.appendChild(div);
    })
}
function getExt(filename){
    const idx = filename.lastIndexOf(".");
    if(idx === -1) return "";
    return filename.slice(idx).toLowerCase();
}
// 多格式歌词解析：lrc / krc / qrc / trc
function parseLyricAll(text, ext) {
    ext = (ext || 'lrc').toLowerCase();
    let list = [];
    if (ext === '.lrc' || ext === 'lrc') {
        const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
        text.split("\n").forEach(line => {
            line = line.trim();
            const m = line.match(reg);
            if (!m) return;
            const time = parseInt(m[1]) * 60 + parseInt(m[2]) + (parseInt(m[3] || 0) / 1000);
            const txt = m[4].trim();
            list.push({ time, txt, words: null });
        });
    } else if (ext === '.krc' || ext === 'krc' || ext === '.qrc' || ext === 'qrc') {
        const lineReg = /\[(\d+),(\d+)\](.*)/;
        const wordReg = /<(\d+),(\d+),(\d+)>([^<]+)/g;
        text.split("\n").forEach(line => {
            line = line.trim();
            const lm = line.match(lineReg);
            if (!lm) return;
            const lineStart = parseInt(lm[1]) / 1000;
            const lineDur = parseInt(lm[2]) / 1000;
            const content = lm[3];
            const words = [];
            let w;
            while ((w = wordReg.exec(content)) !== null) {
                words.push({
                    offset: parseInt(w[1]) / 1000,
                    duration: parseInt(w[2]) / 1000,
                    char: w[4]
                });
            }
            const txt = words.map(x => x.char).join('');
            list.push({
                time: lineStart,
                endTime: lineStart + lineDur,
                txt,
                words
            });
        });
    } else if (ext === '.trc' || ext === 'trc') {
        const lineReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
        const wordReg = /\((\d+),(\d+),(\d+)\)([^(]+)/g;
        text.split("\n").forEach(line => {
            line = line.trim();
            const lm = line.match(lineReg);
            if (!lm) return;
            const time = parseInt(lm[1]) * 60 + parseInt(lm[2]) + (parseInt(lm[3]) / 1000);
            const content = lm[4];
            const words = [];
            let w;
            while ((w = wordReg.exec(content)) !== null) {
                words.push({
                    offset: parseInt(w[1]) / 1000,
                    duration: parseInt(w[2]) / 1000,
                    char: w[4]
                });
            }
            const txt = words.map(x => x.char).join('');
            list.push({ time, txt, words });
        });
    }
    list.sort((a, b) => a.time - b.time);
    return list;
}
// 渲染单行歌词：有words则逐字变色，无words则整行
function renderLyricLine(lineData, isActive, currentTime) {
    const div = document.createElement("div");
    div.className = "lyric-item" + (isActive ? " active" : "");
    if (lineData.words && lineData.words.length > 0) {
        lineData.words.forEach(w => {
            const span = document.createElement("span");
            span.className = "lyric-char";
            const wordEnd = w.offset + w.duration;
            if (currentTime >= wordEnd) {
                span.classList.add("sung");
            } else {
                span.classList.add("unsung");
            }
            span.textContent = w.char;
            div.appendChild(span);
        });
    } else {
        div.textContent = lineData.txt;
    }
    return div;
}
// 渲染7行歌词视图
function renderLyricView(activeIdx, currentTime) {
    if (currentTime === undefined) currentTime = 0;
    dom.lyricContainer.innerHTML = "";
    if (lyricArr.length === 0) {
        dom.lyricContainer.innerHTML = `<div class="lyric-item">暂无歌词</div>`;
        return;
    }
    const half = Math.floor(MAX_SHOW_LINES / 2);
    let start = activeIdx - half;
    if (start < 0) start = 0;
    let end = start + MAX_SHOW_LINES;
    if (end > lyricArr.length) {
        end = lyricArr.length;
        start = end - MAX_SHOW_LINES;
        if (start < 0) start = 0;
    }
    for (let i = start; i < end; i++) {
        const lineDiv = renderLyricLine(lyricArr[i], i === activeIdx, currentTime);
        dom.lyricContainer.appendChild(lineDiv);
    }
}
// 加载歌词入口
function loadLyricRaw(lrcRawText, filename) {
    const ext = getExt(filename);
    lyricArr = parseLyricAll(lrcRawText, ext);
    currentLyricLine = -1;
    renderLyricView(-1, 0);
}
// 悬浮歌词：本地导入多格式
dom.lyricImportBtn.addEventListener("click", () => dom.lyricFileInput.click());
dom.lyricFileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const txt = ev.target.result;
        loadLyricRaw(txt, file.name);
    };
    reader.readAsText(file);
});
// 悬浮歌词：从Worker读取R2桶歌词【修复接口路径】
dom.lyricSearchBtn.addEventListener("click", async () => {
    const lyricKey = dom.lyricSearchInput.value.trim();
    if (!lyricKey) { alert("输入R2桶内的歌词文件名，例如：lyric/朝歌.lrc"); return; }
    try{
        const resp = await fetch(`${API_BASE}/lrc?key=${encodeURIComponent(lyricKey)}`);
        if(!resp.ok) throw new Error("未找到歌词文件");
        const text = await resp.text();
        loadLyricRaw(text, lyricKey);
    }catch(err){
        alert("加载歌词失败："+err.message);
    }
});
// 全屏切换
function toggleFullscreen() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else {
        dom.popMedia.requestFullscreen?.() || dom.popMedia.webkitRequestFullscreen?.();
    }
}
// 键盘全局快捷键
document.addEventListener("keydown", function (e) {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    switch (e.key) {
        case " ":
            e.preventDefault();
            if (dom.popMedia.paused) {
                dom.popMedia.play();
                dom.popPlay.innerText = "暂停";
                startAutoPlayCount();
            } else {
                dom.popMedia.pause();
                dom.popPlay.innerText = "播放";
                stopAutoPlayCount();
            }
            break;
        case "ArrowLeft":
            e.preventDefault();
            dom.popMedia.currentTime = Math.max(0, dom.popMedia.currentTime - 5);
            break;
        case "ArrowRight":
            e.preventDefault();
            dom.popMedia.currentTime += 5;
            break;
        case "ArrowUp":
            e.preventDefault();
            dom.popMedia.volume = Math.min(1, dom.popMedia.volume + 0.1);
            break;
        case "ArrowDown":
            e.preventDefault();
            dom.popMedia.volume = Math.max(0, dom.popMedia.volume - 0.1);
            break;
        case "f":
        case "F":
            toggleFullscreen();
            break;
        case "Escape":
            if (document.fullscreenElement) document.exitFullscreen();
            break;
    }
});
/**
 * 数字转为万单位，去除.0后缀
 * @param {number} num
 * @returns {string}
 */
function formatWan(num) {
    if (!num || isNaN(num)) return "0";
    const n = Number(num);
    if (n < 10000) {
        return String(n);
    }
    let res = (n / 10000).toFixed(1);
    if (res.endsWith(".0")) {
        res = res.slice(0, -2);
    }
    return res + "万";
}
/**
 * 收藏随机：保底33万，上限900万，返回原始整数
 */
function getRandomFavCount() {
    const min = 330000;
    const max = 9000000;
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
// 渲染卡片
function renderCard(list) {
    dom.cardWrap.innerHTML = "";
    list.forEach(item => {
        if (item.favCount === null || item.favCount === undefined) {
            item.favCount = getRandomFavCount();
        }
        const div = document.createElement("div");
        div.className = "card-item";
        const coverSrc = item.coverImg ? item.coverImg : DEFAULT_COVER;
        div.innerHTML = `
            <div class="card-cover">
                <img src="${coverSrc}" alt="封面">
                <span class="card-more">●</span>
                <span class="card-play">▶</span>
            </div>
            <div class="card-info">
                <div class="card-title">${item.name}</div>
                <div class="card-author">${item.author||"未知"}</div>
                <div class="card-stat">
                    <span>播放:${formatWan(item.playCount)}</span>
                    <span>收藏:${formatWan(item.favCount)}</span>
                </div>
                <button class="btn-card-download">下载</button>
            </div>
        `;
        div.dataset.key = item.resourceKey;
        div.querySelector(".card-more").addEventListener("click", e => {
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            dom.moreMenu.style.left = rect.left + "px";
            dom.moreMenu.style.top = (rect.top + 24) + "px";
            dom.moreMenu.classList.add("show");
            dom.moreMenu.dataset.cur = JSON.stringify(item);
        });
        div.querySelector(".btn-card-download").addEventListener("click", e => {
            e.stopPropagation();
            alert("下载地址："+`${API_BASE}/file?key=${encodeURIComponent(item.resourceKey)}`);
        });
        div.addEventListener("click", () => openPopupPlayer(item));
        dom.cardWrap.appendChild(div);
    });
}
// 打开弹窗播放器【修复媒体访问路径】
function openPopupPlayer(item) {
    stopAutoPlayCount();
    currentPlayItem = item;
    dom.popTitle.innerText = item.name;
    dom.popAuthor.innerText = item.author||"未知";
    dom.popupMask.classList.add("show");
    dom.floatLyric.classList.add("show");
    lyricArr = [];
    currentLyricLine = -1;
    renderLyricView(-1, 0);
    // 修复：使用查询参数 ?key=xxx
    dom.popMedia.src = `${API_BASE}/file?key=${encodeURIComponent(item.resourceKey)}`;
    dom.popMedia.currentTime = 0;
    dom.popPlay.innerText = "播放";
    addPlayHistory(item);
    currentIndex = playQueue.findIndex(p => p.resourceKey === item.resourceKey);
}
dom.popupClose.addEventListener("click", () => {
    dom.popupMask.classList.remove("show");
    dom.floatLyric.classList.remove("show");
    dom.popMedia.pause();
    stopAutoPlayCount();
});
dom.popPlay.addEventListener("click", () => {
    if (dom.popMedia.paused) {
        dom.popMedia.play();
        dom.popPlay.innerText = "暂停";
        startAutoPlayCount();
    } else {
        dom.popMedia.pause();
        dom.popPlay.innerText = "播放";
        stopAutoPlayCount();
    }
});
dom.popFull.addEventListener("click", toggleFullscreen);
dom.btnFullScreen.addEventListener("click", toggleFullscreen);
function playPrev() {
    if (playMode === 2) {
        currentIndex = Math.floor(Math.random() * playQueue.length);
    } else {
        currentIndex--;
        if (currentIndex < 0) currentIndex = playQueue.length - 1;
    }
    openPopupPlayer(playQueue[currentIndex]);
}
function playNext() {
    if (playMode === 2) {
        currentIndex = Math.floor(Math.random() * playQueue.length);
    } else {
        currentIndex++;
        if (currentIndex >= playQueue.length) currentIndex = 0;
    }
    openPopupPlayer(playQueue[currentIndex]);
}
document.getElementById("popPrev").addEventListener("click", playPrev);
document.getElementById("popNext").addEventListener("click", playNext);
dom.btnPrev.onclick = playPrev;
dom.btnNext.onclick = playNext;
dom.btnPlay.onclick = () => {
    if (dom.popMedia.paused) { dom.popMedia.play(); dom.popPlay.innerText = "暂停"; startAutoPlayCount(); }
    else { dom.popMedia.pause(); dom.popPlay.innerText = "播放"; stopAutoPlayCount(); }
};
dom.btnBottomPause.onclick = () => {
    dom.popMedia.pause();
    dom.popPlay.innerText = "播放";
    stopAutoPlayCount();
};
dom.btnRewind.onclick = () => {
    dom.popMedia.currentTime = Math.max(0, dom.popMedia.currentTime - 5);
};
dom.btnForward.onclick = () => {
    dom.popMedia.currentTime = dom.popMedia.currentTime + 5;
};
dom.bottomProgressBar.addEventListener("click", e => {
    const rect = dom.bottomProgressBar.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    if (dom.popMedia.duration) dom.popMedia.currentTime = percent * dom.popMedia.duration;
});
dom.btnMode.onclick = () => {
    playMode++;
    if (playMode > 2) playMode = 0;
    const modeText = ["🔁列表循环", "🔂单曲循环", "🎲随机播放"];
    dom.btnMode.innerText = modeText[playMode];
};
dom.btnBottomFav.onclick = () => {
    alert("收藏逻辑，对接后端收藏接口");
};
// 媒体时间更新：7行歌词同步 + 逐字变色 + 底部进度条
dom.popMedia.addEventListener("timeupdate", () => {
    const t = dom.popMedia.currentTime;
    let active = -1;
    for (let i = 0; i < lyricArr.length; i++) {
        if (lyricArr[i].time <= t) active = i;
    }
    if (active !== currentLyricLine) {
        currentLyricLine = active;
    }
    renderLyricView(currentLyricLine, t);
    if (dom.popMedia.duration) {
        const pct = t / dom.popMedia.duration;
        dom.bottomDot.style.left = (pct * 100) + "%";
    }
});
dom.popMedia.addEventListener("ended", () => {
    stopAutoPlayCount();
    if (playMode === 1) {
        dom.popMedia.currentTime = 0;
        dom.popMedia.play();
        startAutoPlayCount();
    } else {
        playNext();
    }
});
// 悬浮歌词拖拽 z-index提升
(function initLyricDrag() {
    const wrap = dom.floatLyric;
    let dragging = false, startX, startY, initLeft, initTop;
    wrap.addEventListener("mousedown", e => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = wrap.getBoundingClientRect();
        initLeft = rect.left;
        initTop = rect.top;
        wrap.style.zIndex = 99985;
        e.preventDefault();
    });
    document.addEventListener("mousemove", e => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        wrap.style.left = (initLeft + dx) + "px";
        wrap.style.top = (initTop + dy) + "px";
    });
    document.addEventListener("mouseup", () => { dragging = false; });
})();
// 卡片更多菜单
dom.moreMenu.addEventListener("click", e => {
    const act = e.target.dataset.act;
    const item = JSON.parse(dom.moreMenu.dataset.cur);
    if (act === "share") alert(`分享：${item.name}`);
    if (act === "addToCollect") alert("加入收藏，对接接口");
    if (act === "copyKey") {
        navigator.clipboard.writeText(item.resourceKey);
        alert("已复制资源key");
    }
    dom.moreMenu.classList.remove("show");
});
document.addEventListener("click", () => dom.moreMenu.classList.remove("show"));
// 标签切换
document.querySelectorAll(".tab-item").forEach(tab => {
    tab.addEventListener("click", function () {
        document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
        this.classList.add("active");
        const type = this.dataset.type;
        console.log("切换分类：", type);
    });
});
// 搜索框
document.querySelector(".search-box").addEventListener("input", e => {
    const kw = e.target.value.trim();
    console.log("搜索关键词：", kw);
});
// 无限滚动
let page = 1;
document.querySelector(".main-content").addEventListener("scroll", async function (e) {
    const el = e.target;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
        page++;
        console.log("触底加载下一页 page=", page);
    }
});
// 从Worker拉取R2资源列表【修复接口地址】
async function loadResourceList(){
    try{
        const res = await fetch(`${API_BASE}/list`);
        const listRaw = await res.json();
        playQueue = listRaw.map(obj=>{
            const filename = obj.key;
            const name = filename.replace(/\.[^/.]+$/,"");
            return {
                resourceKey: obj.key,
                name: name,
                author:"R2文件",
                coverImg:"",
                playCount:getRandomPlayCount(),
                favCount:getRandomFavCount(),
            }
        })
        renderCard(playQueue);
        renderHistory();
    }catch(err){
        alert("拉取R2资源失败："+err.message);
        console.error(err);
    }
}
// 初始化
loadResourceList();
</script>
