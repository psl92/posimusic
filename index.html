<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posimusic 步丝丝音乐完整版</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", system-ui, sans-serif;
}
body{
    background: radial-gradient(circle at 15% 10%, #7026d8 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, #5218a6 0%, transparent 48%),
                #2c0b52;
    padding:12px;
    min-height: 100vh;
    color:#ffffff;
}
.wrapper{
    width:100%;
    max-width:1900px;
    height:96vh;
    position:relative;
}
/* 顶部导航 胶囊按钮 */
.top-bar{
    display:flex;
    justify-content:flex-start;
    gap:10px;
    padding:10px 0;
}
.top-bar button{
    padding:7px 20px;
    border:none;
    border-radius:9999px;
    background: linear-gradient(145deg,#8844e0,#5921b8);
    color:#fff;
    cursor:pointer;
    box-shadow: 0 3px 12px rgba(136,68,224,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.25s ease;
}
.top-bar button:hover{
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(136,68,224,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
}
.top-bar button.active{
    background: linear-gradient(145deg,#a264ff,#743cb4);
    box-shadow: 0 0 14px rgba(162,100,255,0.6);
}
.top-right{
    display:flex;
    gap:10px;
    margin-left: auto;
}
.main-container{
    display:flex;
    gap:20px;
    height:calc(100% - 120px);
}
.display-area{
    flex:1;
    overflow-y:auto;
}
.card-grid{
    display:grid;
    gap:18px;
    padding:10px;
}
.home-grid{grid-template-columns: repeat(4, 1fr);}
.music-grid{grid-template-columns: repeat(7, 1fr);}
.video-grid{grid-template-columns: repeat(4, 1fr);}
.item-card{
    background: linear-gradient(135deg,rgba(110,40,200,0.3),rgba(70,20,140,0.2));
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,0.15);
    border-radius:22px;
    overflow:hidden;
    padding-bottom:12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 10px rgba(120,40,220,0.15);
    transition: transform 0.3s ease;
}
.item-card:hover{
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 18px rgba(140,60,255,0.28);
}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}
.card-info{padding:10px 12px;}
.card-name{font-weight:bold;font-size:15px;margin-bottom:5px;}
.card-singer{font-size:13px;opacity:0.85;margin-bottom:8px;}
.card-data-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
.card-bottom-btn{display:flex;gap:6px;}
.comment-card-btn{
    font-size:11px;padding:3px 12px;border:none;border-radius:9999px;
    background: linear-gradient(135deg,#914cdf,#6633aa);
    color:#fff;cursor:pointer;transition:0.2s;
}
.comment-card-btn:hover{filter:brightness(1.15);}
.like-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;transition:0.2s;}
.like-btn:hover{transform:scale(1.2);}
.like-btn.liked{color:#ff5577;text-shadow:0 0 6px #ff5577;}
/* 侧边栏缩小，不会大面积占屏 */
.sidebar{
    width:240px;
    flex-shrink:0;
}
.sidebar-block{
    background: linear-gradient(135deg,rgba(90,30,170,0.28),rgba(50,15,100,0.18));
    backdrop-filter: blur(12px);border:1px solid rgba(255,255,0.12);
    border-radius:20px;padding:14px;margin-bottom:22px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.block-title{font-size:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,0.18);margin-bottom:10px;}
.history-item{display:flex;justify-content:space-between;padding:6px 6px;border-radius:12px;cursor:pointer;font-size:13px;transition:0.2s;}
.history-item:hover{background:rgba(130,60,230,0.25);}
.del-tag{width:18px;height:18px;background:#f44336;border-radius:9999px;text-align:center;font-size:11px;line-height:18px;}
.db-tab-group{display:flex;gap:6px;margin:10px 0;}
.db-tab{flex:1;padding:5px;border:none;border-radius:9999px;background:rgba(80,30,150,0.4);color:#fff;cursor:pointer;transition:0.2s;}
.db-tab.active{background: linear-gradient(135deg,#8642e2,#743cb4);box-shadow:0 0 10px rgba(120,40,220,0.4);}
.db-item{padding:8px;font-size:13px;margin:6px 0;border-radius:14px;background:rgba(75,25,140,0.35);}
.db-btn-group{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.db-btn{font-size:10px;padding:3px 9px;border:none;border-radius:9999px;color:#fff;cursor:pointer;}
.db-btn-home{background:#3674d8;}.btn-music{background:#279e48;}.btn-video{background:#dd8c22;}.btn-del{background:#dd3333;}
.btn-del {
    pointer-events: auto !important;
    position: relative;
    z-index: 5;
}
#dbWrap {
    max-height: 52vh;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 6px;
    pointer-events: auto;
    position: relative;
    z-index: 2;
}
/* 底部播放控制：父容器设相对定位，修复时间文字错位 */
.bottom-control{
    position:absolute;
    bottom:10px;
    left:0;
    width:100%;
    padding:0 10px;
    position: relative;
}
.bottom-progress-wrap{
    width:100%;
    margin-bottom:12px;
    position: relative;
}
#bottomProgress{
    width:100%;
    accent-color:#a264ff;
}
#timeStart{
    position:absolute;
    left:5px;
    bottom:-20px;
    font-size:12px;
    color:#eee;
}
#timeEnd{
    position:absolute;
    right:5px;
    bottom:-20px;
    font-size:12px;
    color:#eee;
}
.control-buttons{display:flex;justify-content:center;gap:22px;align-items:center;}
.ctrl-btn{width:38px;height:38px;border:none;border-radius:9999px;background: linear-gradient(145deg,#8844e0,#5921b8);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(110,40,200,0.35);transition:0.2s;}
.ctrl-btn:hover{transform:scale(1.1);}
.play-main{width:56px;height:56px;font-size:22px;background: linear-gradient(145deg,#b370ff,#743cb4);box-shadow:0 0 16px rgba(160,90,255,0.5);}
.modal{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);justify-content:center;align-items:center;z-index:999;
}
.modal-box{
    z-index: 1000;
    background: linear-gradient(135deg,rgba(85,30,165,0.35),rgba(40,10,80,0.22));
    backdrop-filter: blur(14px);border:1px solid rgba(255,255,0.18);
    color:#fff;padding:26px;border-radius:24px;width:480px;max-height:80vh;overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    pointer-events: auto !important;
}
.input-item{margin:10px 0;}
.input-item input, .input-item textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#ffffff !important;
    color:#000000 !important;
    outline:none;
    pointer-events: auto !important;
    user-select: text !important;
    -webkit-user-select: text !important;
}
.input-item input:focus, .input-item textarea:focus{
    border-color:#a264ff;
    box-shadow:0 0 8px rgba(162,100,255,0.4);
    background:#ffffff !important;
    color:#000000 !important;
}
.input-item input::placeholder, .input-item textarea::placeholder {
    color:#777777;
}
.modal-buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;}
.modal-buttons button{padding:7px 22px;border:none;border-radius:9999px;background: linear-gradient(135deg,#8844e0,#5921b8);color:#fff;cursor:pointer;transition:0.2s;}
.modal-buttons button:hover{filter:brightness(1.15);}
.home-view,.music-view,.video-view{display:none;}.active-view{display:block;}
#uploadOpenBtn,#statOpenBtn,#dbBoxWrap{display: none;}
.comment-item{padding:10px;border-bottom:1px solid rgba(255,255,0.12);font-size:13px;}
.comment-name{font-weight:bold;color:#d8b8ff;}.comment-time{font-size:11px;color:#ccc;}
.comment-del{float:right;background:#f44336;color:#fff;border:none;font-size:10px;padding:2px 6px;border-radius:9999px;}
.donate-img-box{display:flex;gap:10px;flex-wrap:wrap;margin:10px;}
.donate-img-box img{width:160px;border-radius:12px;border:1px solid #ffffff33;}
.switch-btn{
    background:transparent;border:none;color:#a264ff;margin-top:8px;cursor:pointer;text-align:left;
}

/* ===== 播放器弹窗【粉紫磨砂无黄色，修复全屏】 ===== */
.play-modal-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(25,10,40,0.72);
    z-index:10000;
    align-items:center;
    justify-content:center;
}
.play-modal-box{
    width:85%;
    max-width:1300px;
    background: linear-gradient(135deg, rgba(230,170,245,0.18), rgba(160,120,240,0.22));
    backdrop-filter:blur(20px);
    border-radius:28px;
    border:1px solid rgba(235, 190, 255, 0.35);
    padding:30px;
    color:#fff;
    position:relative;
    box-shadow: 0 0 35px rgba(210,140,255,0.18);
}
.play-modal-box:fullscreen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-modal-box:-webkit-full-screen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-close{
    position:absolute;
    top:16px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.play-content-row{
    display:grid;
    grid-template-columns:64% 34%;
    gap:2%;
}
.media-view{
    width:100%;
    border-radius:18px;
    background:#000;
    overflow:hidden;
}
.media-view video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    border-radius: 18px;
    object-fit: contain;
    crossorigin:anonymous;
    preload:auto;
}
.audio-cover-box{
    padding:40px;
    text-align:center;
}
.audio-cover-box img{
    width:320px;
    border-radius:16px;
}
.lyric-area{
    height:380px;
    overflow-y:auto;
    padding:15px;
    scrollbar-width: none;
}
.play-control-bar{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:16px;
}
.play-control-bar button{
    background: linear-gradient(145deg,#8844e0,#5921b8) !important;
    border:none;
    color:#fff !important;
    border-radius:999px;
    padding:10px 18px;
    font-size:18px;
    cursor:pointer;
    transition: filter 0.2s ease;
}
.play-control-bar button:hover{
    filter: brightness(1.18);
}
.play-progress{
    flex:1;
}

/* ========== 全局隐藏所有滚动条 全部区域 ========== */
.lyric-area::-webkit-scrollbar,
#dbWrap::-webkit-scrollbar,
.display-area::-webkit-scrollbar,
.sidebar::-webkit-scrollbar,
.modal-box::-webkit-scrollbar{
    width: 0 !important;
    height: 0 !important;
    display: none !important;
}
.lyric-area, #dbWrap, .display-area, .sidebar, .modal-box{
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}

/* ========== 卡拉OK霓虹逐字歌词样式 ========== */
.lyric-wrap{
    transition: transform 0.35s ease-out;
}
.lyric-line{
    padding:12px 0;
    font-size:18px;
    text-align:center;
    cursor: pointer;
    line-height: 1.8;
}
.lyric-char {
    color: rgba(255, 255, 255, 0.32);
    transition: color 0.1s ease, text-shadow 0.1s ease;
    letter-spacing: 2px;
}
.lyric-char.active {
    color: #ffffff;
    /* 紫粉色霓虹发光效果 */
    text-shadow: 0 0 6px #ff9cff,
                 0 0 12px #e26cff,
                 0 0 20px #b340ff,
                 0 0 32px #8c1cff;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="top-bar">
        <button class="nav-switch active" data-view="home">首页</button>
        <button class="nav-switch" data-view="music">音乐</button>
        <button class="nav-switch" data-view="video">视频</button>
        <button id="uploadOpenBtn">上传</button>
        <button id="statOpenBtn">统计</button>
        <div class="top-right">
            <button id="adminLoginBtn">登录/注册 ∨</button>
            <button id="donateBtn">赞赏</button>
        </div>
    </div>
    <div class="main-container">
        <div class="display-area">
            <div class="home-view active-view"><div class="card-grid home-grid" id="homeCardWrap"></div></div>
            <div class="music-view"><div class="card-grid music-grid" id="musicCardWrap"></div></div>
            <div class="video-view"><div class="card-grid video-grid" id="videoCardWrap"></div></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-block">
                <div class="block-title">播放列表（历史记录）</div>
                <div id="historyWrap"></div>
            </div>
            <div class="sidebar-block" id="dbBoxWrap">
                <div class="block-title">资源数据库(管理员专用)</div>
                <div class="db-tab-group">
                    <button class="db-tab active" data-filter="all">全部</button>
                    <button class="db-tab" data-filter="music">仓库音乐</button>
                    <button class="db-tab" data-filter="video">仓库视频</button>
                </div>
                <div id="dbWrap"></div>
            </div>
        </div>
    </div>
       <div class="bottom-control">
        <div class="bottom-progress-wrap">
            <input type="range" id="bottomProgress" min="0" max="100" value="0">
            <span id="timeStart">00:00</span>
            <span id="timeEnd">00:00</span>
        </div>
        <div class="control-buttons">
            <div>
                <button class="ctrl-btn" id="prevMainBtn">◀◀</button>
                <button class="ctrl-btn" id="backMainBtn">◀</button>
            </div>
            <button class="ctrl-btn play-main" id="playMainBtn">▶</button>
            <div>
                <button class="ctrl-btn" id="forwardMainBtn">▶</button>
                <button class="ctrl-btn" id="nextMainBtn">▶▶</button>
            </div>
        </div>
    </div>
</div>

<!-- 弹窗播放器 -->
<div class="play-modal-mask" id="playMask">
    <div class="play-modal-box" id="playBox">
        <span class="play-close" id="closePlayer">✕</span>
        <div class="play-content-row">
            <div class="media-view" id="mediaView"></div>
            <div class="lyric-area" id="lyricBox">
                <div class="lyric-wrap" id="lyricWrap">
                    <div class="lyric-line">等待加载歌词...</div>
                </div>
            </div>
        </div>
        <div class="play-control-bar">
            <button id="prevBtn">上一曲</button>
            <button id="playPauseBtn">播放/暂停</button>
            <button id="nextBtn">下一曲</button>
            <input type="range" class="play-progress" id="playerProgress" value="0" max="100">
            <button id="fullScreenBtn">全屏</button>
        </div>
    </div>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h4 id="loginTitle">账号登录</h4>
        <div class="input-item"><input placeholder="账号" id="loginUser"></div>
        <div class="input-item"><input type="password" placeholder="密码" id="loginPwd"></div>
        <div class="modal-buttons">
            <button id="loginClose">取消</button>
            <button id="loginConfirm">登录</button>
        </div>
        <button class="switch-btn" id="switchRegBtn">没有账号？点击注册</button>
    </div>
</div>
<!-- 上传弹窗 -->
<div class="modal" id="uploadModal">
    <div class="modal-box">
        <h4>新增后台素材</h4>
        <label><input type="radio" name="resType" value="music" checked> 音乐</label>
        <label style="margin-left:10px"><input type="radio" name="resType" value="video"> 视频</label>
        <div class="input-item"><input placeholder="歌曲/视频名称" id="resName"></div>
        <div class="input-item"><input placeholder="歌手/作者名称" id="resSinger"></div>
        <div class="input-item"><input placeholder="媒体播放网络链接" id="resMediaLink"></div>
        <div class="input-item"><input placeholder="封面图片外网链接" id="resCoverLink"></div>
        <div class="input-item"><input placeholder="歌词链接（仅音乐填写）" id="resLyricLink"></div>
        <div class="modal-buttons">
            <button id="uploadClose">取消</button>
            <button id="uploadConfirm">提交入库</button>
        </div>
    </div>
</div>
<!-- 统计弹窗 -->
<div class="modal" id="statModal">
    <div class="modal-box">
        <h4>后台数据统计</h4>
        <div id="statText"></div>
        <div class="modal-buttons">
            <button id="statClose">关闭</button>
        </div>
    </div>
</div>
<!-- 评论弹窗 -->
<div class="modal" id="commentModal">
    <div class="modal-box">
        <h4>作品评论区</h4>
        <div id="commentListBox" style="max-height:300px;overflow-y:auto;margin:10px 0;"></div>
        <div class="input-item"><input placeholder="昵称（留空默认匿名）" id="commentName"></div>
        <div class="input-item"><textarea placeholder="输入评论内容" id="commentContent" rows="3"></textarea></div>
        <div class="modal-buttons">
            <button id="commentClose">关闭</button>
            <button id="commentSubmit">发表评论</button>
        </div>
    </div>
</div>
<!-- 赞赏弹窗 -->
<div class="modal" id="donateModal">
    <div class="modal-box">
        <h4>赞赏支持作者</h4>
        <div class="donate-img-box" id="donateImgWrap"></div>
        <div id="donateAdminArea" style="display:none;border-top:1px solid #fff3;margin-top:12px;padding-top:12px;">
            <div class="input-item"><input placeholder="赞赏图片链接（多图英文逗号分隔）" id="newDonateUrl"></div>
            <div class="modal-buttons">
                <button id="saveDonateBtn">保存图片</button>
            </div>
            <p style="font-size:12px;color:#ddd;">多链接英文逗号分隔</p>
        </div>
        <div class="modal-buttons">
            <button id="donateClose">关闭</button>
        </div>
    </div>
</div>
<video id="videoPlayer" style="display:none;"></video>
<script>
// 全局配置
const ADMIN_ACCOUNT = "admin";
const ADMIN_PWD = "bu4321";
let isAdmin = false;
let currentView = "home";
let currentPlayMedia = null;
let playStatus = false;
// 全局唯一播放实例（核心修复：单例播放器）
let mainPlayer = null;
let mediaType = ""; // music / video
const videoDom = document.getElementById("videoPlayer");
const dbBoxWrap = document.getElementById("dbBoxWrap");
let activeCommentWorkId = "";
let donateImgList = [];
let showList = {home: [],music: [],video: []};
let resourceWarehouse = JSON.parse(localStorage.getItem("warehouseData")) || [];
let playHistoryList = JSON.parse(localStorage.getItem("historyData")) || [];

// 全局歌词存储：存放完整解析后的逐字歌词数据
let globalLyricData = [];

// 格式化时间 秒 -> 00:00
function formatTime(seconds) {
    if(isNaN(seconds) || !isFinite(seconds)) return "00:00";
    let min = Math.floor(seconds / 60);
    let sec = Math.floor(seconds % 60);
    return String(min).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

// 对象唯一标识：通过名称+链接生成字符串，用来对比对象是否一致（解决引用丢失问题）
function getItemKey(item) {
    return btoa(item.name + item.mediaLink);
}

function saveWarehouse(){localStorage.setItem("warehouseData",JSON.stringify(resourceWarehouse));}
function saveHistory(){localStorage.setItem("historyData",JSON.stringify(playHistoryList));}
function saveShowList(){localStorage.setItem("showListData",JSON.stringify(showList));}
const localShow = localStorage.getItem("showListData");
if(localShow) showList = JSON.parse(localShow);

// 模拟后端接口请求
async function apiFetch(url, options = {}) {
    return { code: 200, data: [], playNum: 0, likeNum: 0, list: [] };
}

// 导航切换
const navBtns = document.querySelectorAll(".nav-switch");
const viewDom = {home:document.querySelector(".home-view"),music:document.querySelector(".music-view"),video:document.querySelector(".video-view")};
navBtns.forEach(btn=>{
    btn.onclick = ()=>{
        navBtns.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        Object.values(viewDom).forEach(v=>v.classList.remove("active-view"));
        viewDom[currentView].classList.add("active-view");
    }
})

// 卡片渲染
function buildCardSkeleton(item){
    const uniqueId = getItemKey(item);
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
        <img class="card-cover" src="${item.coverLink||''}" alt="封面">
        <div class="card-info">
            <div class="card-name">${item.name}</div>
            <div class="card-singer">${item.singer||"未知歌手"}</div>
            <div class="card-data-row">
                <span>加载中...</span>
                <button class="like-btn ${item.isLike ? 'liked' : ''}">♥</button>
            </div>
            <div class="card-bottom-btn">

// ========== 新版完整LRC解析器：支持整行时间+逐字时间标签 ==========
function parseLrcFull(lrcText) {
    const lineList = [];
    // 匹配每行开头时间 [00:02.34]
    const lineReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*?)(?=\[\d{2}:|$)/gs;
    let match;
    while ((match = lineReg.exec(lrcText)) !== null) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = parseInt(match[3]);
        const lineStartTime = min * 60 + sec + ms / 1000;
        let content = match[4];
        const charList = [];
        // 匹配逐字时间 <00:03.12>字
        const charReg = /<(\d{2}):(\d{2})\.(\d{2,3})>(.)/g;
        let charMatch;
        while ((charMatch = charReg.exec(content)) !== null) {
            const cMin = parseInt(charMatch[1]);
            const cSec = parseInt(charMatch[2]);
            const cMs = parseInt(charMatch[3]);
            const charTime = cMin * 60 + cSec + cMs / 1000;
            charList.push({
                char: charMatch[4],
                time: charTime
            });
        }
        // 无逐字时间标签，整行均分文字时间
        if(charList.length === 0 && content.trim()){
            const cleanText = content.replace(/<\d{2}:\d{2}\.\d{2,3}>/g,"").trim();
            [...cleanText].forEach(ch=>{
                charList.push({char:ch, time:null})
            })
        }
        if(charList.length > 0){
            lineList.push({
                startTime: lineStartTime,
                chars: charList
            });
        }
    }
    // 按播放时间升序排序
    lineList.sort((a,b)=>a.startTime - b.startTime);
    return lineList;
}

// ========== 渲染所有歌词行，绑定点击跳转播放 ==========
function renderAllLyric() {
    lyricWrap.innerHTML = "";
    globalLyricData.forEach((lineObj, lineIndex) => {
        const lineDom = document.createElement("div");
        lineDom.className = "lyric-line";
        lineDom.dataset.startTime = lineObj.startTime;
        lineDom.dataset.index = lineIndex;
        // 生成每个文字span
        lineObj.chars.forEach((charItem, charIdx) => {
            const span = document.createElement("span");
            span.className = "lyric-char";
            span.textContent = charItem.char;
            span.dataset.charTime = charItem.time ?? lineObj.startTime;
            span.dataset.charIdx = charIdx;
            lineDom.appendChild(span);
        })
        // 点击该行，跳转到该行起始时间播放
        lineDom.onclick = () => {
            if(mainPlayer && isFinite(mainPlayer.duration)){
                mainPlayer.currentTime = lineObj.startTime;
            }
        }
        lyricWrap.appendChild(lineDom);
    })
}

// ========== 实时同步逐字霓虹高亮 + 歌词居中滚动 ==========
function syncLyricHighlight(currentTime) {
    if(globalLyricData.length === 0) return;
    const allLines = lyricWrap.querySelectorAll(".lyric-line");
    let activeLineIdx = -1;
    // 查找当前正在播放的歌词行
    for(let i = 0; i < globalLyricData.length; i++){
        const nextLineTime = globalLyricData[i+1]?.startTime ?? 99999;
        if(currentTime >= globalLyricData[i].startTime && currentTime < nextLineTime){
            activeLineIdx = i;
            break;
        }
    }
    // 遍历所有行处理样式
    allLines.forEach((lineDom, lineIdx) => {
        const charSpans = lineDom.querySelectorAll(".lyric-char");
        // 非当前播放行：全部文字灰色
        if(lineIdx !== activeLineIdx){
            charSpans.forEach(span => span.classList.remove("active"));
            return;
        }
        // 当前播放行：逐字匹配时间点亮霓虹
        const lineData = globalLyricData[activeLineIdx];
        charSpans.forEach((span, charIdx) => {
            const charTime = parseFloat(span.dataset.charTime);
            if(currentTime >= charTime){
                span.classList.add("active");
            }else{
                span.classList.remove("active");
            }
        })
        // 歌词容器自动滚动，当前行居中
        const boxHeight = lyricBox.clientHeight;
        const lineTop = lineDom.offsetTop;
        const lineHeight = lineDom.offsetHeight;
        const targetScroll = lineTop - boxHeight / 2 + lineHeight / 2;
        lyricWrap.style.transform = `translateY(${-targetScroll}px)`;
    })
}

    if(!isFinite(totalTime)) return;
    const percent = (currentTime / totalTime) * 100;
    bottomProgress.value = percent;
    playerProgress.value = percent;
    timeStartDom.textContent = formatTime(currentTime);
    timeEndDom.textContent = formatTime(totalTime);
    // 同步歌词高亮
    syncLyricHighlight(currentTime);
}

    if(!playHistoryList.find(h=>getItemKey(h)===getItemKey(item))){

        if(playHistoryList.length>60) playHistoryList.pop();
        saveHistory();renderHistory();
    }
    nowMediaInfo = item;
    // 销毁上一个播放器实例
    destroyPlayer();
    mediaView.innerHTML = "";
    lyricWrap.innerHTML = `<div class="lyric-line">加载歌词...</div>`;
    bottomProgress.value = 0;
    playerProgress.value = 0;
    timeStartDom.textContent = "00:00";
    timeEndDom.textContent = "00:00";
    lyricWrap.style.transform = "translateY(0px)";
    globalLyricData = [];

    if(item.type === "video"){
        mediaType = "video";
        mainPlayer = document.createElement("video");
        mainPlayer.src = item.mediaLink;
        mainPlayer.controls = false;
        mainPlayer.playsInline = true;
        mainPlayer.muted = false;
        mainPlayer.crossOrigin = "anonymous";
        mainPlayer.preload = "auto";
        mediaView.appendChild(mainPlayer);
    }else{
        mediaType = "music";
        mediaView.innerHTML = `<div class="audio-cover-box"><img src="${item.coverLink||''}" alt="封面"><h3>${item.name}</h3><p style="opacity:0.7">${item.singer||"未知歌手"}</p></div>`;
        mainPlayer = new Audio(item.mediaLink);
        mainPlayer.preload = "auto";
        mainPlayer.crossOrigin = "anonymous";
    }

    // 统一绑定进度、播放结束事件
    mainPlayer.ontimeupdate = function(){
        updateAllProgress(this.currentTime, this.duration);
    }
    mainPlayer.onended = function(){
        destroyPlayer();
        lyricWrap.innerHTML = `<div class="lyric-line">播放结束</div>`;
    }

    // 自动播放捕获浏览器限制报错
    try{
        await mainPlayer.play();
        playStatus = true;
        playMainBtn.textContent = "⏸";
        playPauseBtn.textContent = "暂停";
    }catch(err){
        playStatus = false;
        playMainBtn.textContent = "▶";
        playPauseBtn.textContent = "播放";
    }

    // 加载解析歌词并渲染
    if(item.lyricLink){
        try{
            const lrcRes = await fetch(item.lyricLink);
            const lrcText = await lrcRes.text();
            globalLyricData = parseLrcFull(lrcText);
            renderAllLyric();
        }catch(e){
            lyricWrap.innerHTML = `<div class="lyric-line">歌词加载失败</div>`;
            globalLyricData = [];
        }
    }else{
        lyricWrap.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
    }

    playMask.style.display = "flex";
}

// 拖动进度条统一跳转
function seekMedia(percent){
    if (!mainPlayer || !isFinite(mainPlayer.duration)) return;
    const rate = percent / 100;
    mainPlayer.currentTime = mainPlayer.duration * rate;
    bottomProgress.value = percent;
    playerProgress.value = percent;
    // 跳转后立刻刷新歌词高亮
    updateAllProgress(mainPlayer.currentTime, mainPlayer.duration);
}

// 底部全局进度条拖动绑定
bottomProgress.oninput = function () {
    seekMedia(Number(this.value));
};

// 播放器弹窗内进度条拖动绑定
playerProgress.oninput = function () {
    seekMedia(Number(this.value));
};

// 上下一曲按钮基础逻辑（预留扩展循环/随机播放）
document.getElementById("prevBtn").onclick = (e) => {
    e.stopPropagation();
    alert("上一曲功能可后续添加曲目列表循环逻辑");
};
document.getElementById("nextBtn").onclick = (e) => {
    e.stopPropagation();
    alert("下一曲功能可后续添加曲目列表循环逻辑");
};

// 底部前后切歌快捷键按钮
document.getElementById("prevMainBtn").onclick = () => {
    alert("上一首");
};
document.getElementById("backMainBtn").onclick = () => {
    if(!mainPlayer) return;
    mainPlayer.currentTime -= 10;
};
document.getElementById("forwardMainBtn").onclick = () => {
    if(!mainPlayer) return;
    mainPlayer.currentTime += 10;
};
document.getElementById("nextMainBtn").onclick = () => {
    alert("下一首");
};

// 页面初始化加载所有本地数据
window.onload = function () {
    renderHistory();
    renderAllCards();
    if(isAdmin){
        document.getElementById("uploadOpenBtn").style.display="block";
        document.getElementById("statOpenBtn").style.display="block";
        dbBoxWrap.style.display="block";
        renderWarehouse();
    }
};
</script>
