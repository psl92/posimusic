<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Posimusic 播放器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background: linear-gradient(130deg,#82b8ff,#b898ff,#c788ff,#74e0e8);
    background-attachment: fixed;
    color:#111;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Microsoft Yahei",sans-serif;
    overflow:hidden;
}
.top-header{
    height:72px;
    display:flex;
    align-items:center;
    padding:0 24px;
    gap:24px;
    border-bottom:1px solid rgba(255,255,255,0.2);
    position:fixed;
    top:0;left:0;right:0;
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(18px) saturate(120%);
    z-index:100;
}
.search-box{
    width:280px;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.28);
    border-radius:12px;
    padding:9px 14px;
    outline:none;
    color:#111;
}
.search-box::placeholder{
    color:rgba(60,60,80,0.5);
}
.tab-group{
    display:flex;
    gap:10px;
}
.tab-item{
    cursor:pointer;
    font-size:15px;
    padding:7px 20px;
    border-radius:999px;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.25);
    color:rgba(40,40,70,0.65);
    transition: all 0.24s ease;
}
.tab-item:hover{
    background:rgba(255,255,255,0.32);
}
.tab-item.active{
    background:rgba(255,255,255,0.55);
    color:#6b3fc9;
    font-weight:bold;
    box-shadow: 0 2px 10px rgba(107,63,201,0.12);
}
.left-sidebar{
    width:190px;
    position:fixed;
    top:72px;bottom:88px;
    left:0;
    background:rgba(255,255,255,0.10);
    backdrop-filter: blur(18px) saturate(120%);
    border-right:1px solid rgba(255,255,255,0.18);
    padding:16px 12px;
    overflow-y:auto;
}
.sidebar-title{
    font-weight:bold;
    margin-bottom:12px;
    font-size:16px;
    color:#222;
}
.history-item{
    padding:8px 6px;
    font-size:14px;
    border-radius:8px;
    cursor:pointer;
    color:#1b1b1b;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
}
.history-item:hover{
    background:rgba(255,255,255,0.25);
}
.main-content{
    margin-top:72px;
    margin-left:190px;
    margin-bottom:88px;
    padding:20px;
    height:calc(100vh - 72px - 88px);
    overflow-y:auto;
}
.card-wrap{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:18px;
    align-items:stretch;
}
.card-item{
    background:rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(120%);
    border-radius:14px;
    padding:10px;
    border:1px solid rgba(255,255,255,0.32);
    cursor:pointer;
    transition:0.22s ease;
    height:230px;
    display:flex;
    flex-direction:column;
    width:100%;
    min-width:0;
    flex-shrink:0;
}
.card-item:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 22px rgba(120,80,200,0.15);
    background:rgba(255,255,255,0.22);
}
.card-cover{
    width:100%;
    height:126px;
    border-radius:10px;
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,0.2);
    flex-shrink:0;
    min-width:0;
}
.card-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.card-more{
    position:absolute;
    top:6px;right:6px;
    width:24px;height:24px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    color:#444;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
}
.card-play{
    position:absolute;
    bottom:6px;right:6px;
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.45);
    color:#6b3fc9;
    display:flex;align-items:center;justify-content:center;
}
.card-info{
    margin-top:8px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow:hidden;
    min-width:0;
}
.card-title-wrap{
    width:100%;
    overflow:hidden;
    position:relative;
}
.card-title{
    font-weight:bold;font-size:14px;
    display:inline-block;
    white-space:nowrap;
    color:#1a1a1a;
}
.card-title-wrap:hover .card-title{
    animation: scrollText 6s linear infinite;
}
@keyframes scrollText {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
.card-author{font-size:12px;color:#333;margin:3px 0;display:none;}
.card-stat{
    font-size:11px;color:#222;
    display:flex;gap:8px;flex-wrap:wrap;
    margin:4px 0;
}
.btn-card-download{
    width:100%;
    padding:5px 0;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.3);
    color:#6b3fc9;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    flex-shrink:0;
}
.bottom-player{
    height:88px;
    position:fixed;
    bottom:0;left:0;right:0;
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(18px) saturate(120%);
    border-top:1px solid rgba(255,255,255,0.2);
    display:flex;align-items:center;
    padding:0 24px;
    gap:14px;
    z-index:99999 !important;
    cursor:pointer;
}
.bottom-player button{
    background:rgba(255,255,255,0.3);
    border:1px solid rgba(255,255,255,0.42);
    border-radius:8px;
    font-size:20px;
    cursor:pointer;
    color:#443388;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.2s;
}
.bottom-player button:hover{
    background:rgba(255,255,255,0.45);
}
.progress-wrap{flex:1;}
.progress-bar{
    width:100%;height:7px;
    background:rgba(255,255,255,0.35);
    border-radius:99px;
    position:relative;
    cursor:pointer;
}
.progress-dot{
    position:absolute;
    width:14px;height:14px;
    background:#8364e8;
    border-radius:50%;
    top:-3.5px;
}
.popup-mask{
    position:fixed;
    inset:0;
    z-index:200;
    pointer-events:none;
}
.popup-mask.show{
    pointer-events:auto;
}
.popup-player-box{
    width:620px;
    background:rgba(255,255,255,0.16);
    backdrop-filter: blur(20px) saturate(120%);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:18px;
    padding:32px 24px 24px 24px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 10px 35px rgba(110,70,200,0.18);
    transition: all 0.24s ease;
    pointer-events:auto;
}
/*修复：mini模式移除scale缩放，改为右下角悬浮，解决点击错位失效*/
.popup-mask.mini .popup-player-box{
    left:auto;
    top:auto;
    right:12px;
    bottom:100px;
    transform:none;
    width:260px;
    padding:10px 12px;
    opacity:0.85;
}
.popup-mask.mini .popup-media,
.popup-mask.mini .popup-control,
.popup-mask.mini .popup-info{
    display:none;
}
.popup-header-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:absolute;
    top:8px;
    right:16px;
    left:16px;
    cursor:move;
    z-index:10;
    height:32px;
}
.popup-mini{
    border:none;background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.4);font-size:22px;cursor:pointer;border-radius:8px;color:#443388;
}
.popup-close{
    border:none;background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.4);font-size:24px;cursor:pointer;border-radius:8px;color:#443388;
}
.popup-info{margin-bottom:12px;margin-top:8px;}
.popup-title{font-size:20px;font-weight:bold;color:#111;}
.popup-author{font-size:14px;color:#333;margin-top:4px;display:none;}
.popup-media{
    width:100%;
    max-height:320px;
    background:#000;
    border-radius:10px;
    margin-bottom:14px;
    position:relative;
    z-index:1;
}
.popup-control{
    display:flex;gap:16px;justify-content:center;
    margin-top:10px;
}
.popup-control button{
    padding:8px 18px;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.32);
    border-radius:8px;
    cursor:pointer;
    color:#6b3fc9;
    transition:0.2s;
}
.popup-control button:hover{
    background:rgba(255,255,255,0.48);
}
.card-more-menu{
    position:fixed;
    background:rgba(255,255,255,0.24);
    backdrop-filter: blur(16px) saturate(120%);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:10px;
    padding:8px 0;
    min-width:120px;
    z-index:300;
    display:none;
}
.card-more-menu.show{display:block;}
.card-more-menu div{
    padding:7px 14px;
    cursor:pointer;
    font-size:13px;
    color:#1b1b1b;
}
.card-more-menu div:hover{background:rgba(255,255,255,0.35);}
.float-lyric{
    position:absolute;
    width:420px;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(18px) saturate(120%);
    border:1px solid rgba(255,255,255,0.32);
    border-radius:14px;
    padding:14px;
    left:100px;top:120px;
    cursor:move;
    z-index:210;
    display:none;
}
.float-lyric.show{display:block;}
.lyric-search-row{
    display:flex;gap:8px;margin-bottom:10px;
}
.lyric-search-input{
    flex:1;
    padding:6px 10px;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.28);
    border-radius:8px;
    outline:none;
    color:#111;
}
.lyric-btn{
    padding:6px 10px;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.3);
    border-radius:8px;
    cursor:pointer;
    color:#6b3fc9;
    font-size:13px;
    transition:0.2s;
}
.lyric-btn:hover{
    background:rgba(255,255,255,0.45);
}
.lyric-container{
    min-height:220px;
    overflow:hidden;
}
.lyric-item{
    text-align:center;
    font-size:15px;
    line-height:2.2;
    color:rgba(30,30,60,0.55);
    transition:all 0.3s ease;
}
.lyric-item.active{
    color:#6b3fc9;
    font-weight:bold;
    font-size:18px;
    opacity:1;
}
.lyric-char.sung{color:#6b3fc9;font-weight:bold;}
.lyric-char.unsung{color:rgba(30,30,60,0.55);}
.donate-card-wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-top:20px;
}
.donate-item{
    text-align:center;
}
.donate-item img{
    max-width:260px;
    border-radius:10px;
}
.donate-name{
    margin:8px 0;
    font-size:14px;
    color:#111;
}
@media (max-width:1400px){.card-wrap{grid-template-columns:repeat(5,1fr);}}
@media (max:1000px){.card-wrap{grid-template-columns:repeat(4,1fr);}}
@media (max:720px){
    .left-sidebar{display:none;}
    .main-content{margin-left:0;}
    .card-wrap{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="top-header">
    <input class="search-box" placeholder="搜索作品、作者"/>
    <div class="tab-group">
        <div class="tab-item active" data-type="music">音乐</div>
        <div class="tab-item" data-type="video">视频</div>
        <div class="tab-item" data-type="image">赞赏</div>
    </div>
</div>
<div class="left-sidebar">
    <div class="sidebar-title">历史播放</div>
    <div id="historyList"></div>
</div>
<div class="main-content">
    <div class="card-wrap" id="cardWrap"></div>
</div>
<div class="bottom-player" id="bottomPlayerWrap">
    <button id="btnPrev">◀</button>
    <button id="btnPlay">▶</button>
    <button id="btnNext">▶▶</button>
    <button id="btnRewind">⏪</button>
    <button id="btnForward">⏩</button>
    <div class="progress-wrap">
        <div class="progress-bar" id="bottomProgressBar">
            <div class="progress-dot" id="bottomDot"></div>
        </div>
    </div>
    <button id="btnBottomFav">♡</button>
    <button id="btnMode">🔁</button>
    <button id="btnBottomPause">⏸</button>
    <button id="btnFullScreen">⛶全屏</button>
</div>
<div class="popup-mask" id="popupMask">
    <div class="popup-player-box" id="popupBox">
        <div class="popup-header-bar" id="popupDragBar">
            <button class="popup-mini" id="popupMini">−</button>
            <button class="popup-close" id="popupClose">×</button>
        </div>
        <div class="popup-info">
            <div class="popup-title" id="popTitle"></div>
            <div class="popup-author" id="popAuthor"></div>
        </div>
        <video class="popup-media" id="popMedia"></video>
        <div class="popup-control">
            <button id="popPrev">上一曲</button>
            <button id="popPlay">播放</button>
            <button id="popNext">下一曲</button>
            <button id="popFull">全屏(F)</button>
        </div>
    </div>
</div>
<div class="card-more-menu" id="moreMenu">
    <div data-act="share">分享</div>
    <div data-act="addToCollect">加入收藏</div>
    <div data-act="copyKey">复制资源Key</div>
</div>
<div class="float-lyric" id="floatLyric">
    <div class="lyric-search-row">
        <input class="lyric-search-input" id="lyricSearchInput" placeholder="输入R2桶内的歌词文件名，例：lyric/朝歌.lrc"/>
        <button class="lyric-btn" id="lyricSearchBtn">加载歌词</button>
        <button class="lyric-btn" id="lyricImportBtn">本地导入</button>
        <input type="file" accept=".lrc,.krc,.qrc,.trc" id="lyricFileInput" style="display:none;">
    </div>
    <div class="lyric-container" id="lyricContainer"></div>
</div>
<script>
const API_BASE = "https://api.busisi.com";
const DEFAULT_COVER = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect fill='%23ddd' width='300' height='300'/><text x='50%' y='50%' font-size='22' text-anchor='middle' fill='%23888'>暂无封面</text></svg>";
const MAX_SHOW_LINES = 7;
const MAX_HISTORY_COUNT = 50;
let playQueue = [];
let currentIndex = 0;
let playMode = 0;
let lyricArr = [];
let currentPlayItem = null;
let currentLyricLine = -1;
let playCountTimer = null;
let currentCategory = "music";
let popupIsMini = false;
let popupDragging = false;
let dragStartX, dragStartY, boxStartLeft, boxStartTop;
const coverCache = {};
const dom = {
    floatLyric:document.getElementById("floatLyric"),
    lyricContainer:document.getElementById("lyricContainer"),
    lyricSearchInput:document.getElementById("lyricSearchInput"),
    lyricSearchBtn:document.getElementById("lyricSearchBtn"),
    lyricImportBtn:document.getElementById("lyricImportBtn"),
    lyricFileInput:document.getElementById("lyricFileInput"),
    cardWrap:document.getElementById("cardWrap"),
    historyList:document.getElementById("historyList"),
    popupMask:document.getElementById("popupMask"),
    popupClose:document.getElementById("popupClose"),
    popupMini:document.getElementById("popupMini"),
    popupBox:document.getElementById("popupBox"),
    popupDragBar:document.getElementById("popupDragBar"),
    popTitle:document.getElementById("popTitle"),
    popAuthor:document.getElementById("popAuthor"),
    popMedia:document.getElementById("popMedia"),
    popPlay:document.getElementById("popPlay"),
    popFull:document.getElementById("popFull"),
    moreMenu:document.getElementById("moreMenu"),
    btnPrev:document.getElementById("btnPrev"),
    btnPlay:document.getElementById("btnPlay"),
    btnNext:document.getElementById("btnNext"),
    btnRewind:document.getElementById("btnRewind"),
    btnForward:document.getElementById("btnForward"),
    bottomProgressBar:document.getElementById("bottomProgressBar"),
    bottomDot:document.getElementById("bottomDot"),
    btnBottomFav:document.getElementById("btnBottomFav"),
    btnMode:document.getElementById("btnMode"),
    btnBottomPause:document.getElementById("btnBottomPause"),
    btnFullScreen:document.getElementById("btnFullScreen"),
    bottomPlayerWrap:document.getElementById("bottomPlayerWrap")
};
(function initPopupDrag(){
    dom.popupDragBar.addEventListener("mousedown",e=>{
        if(e.target.tagName === "BUTTON") return;
        popupDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        const rect = dom.popupBox.getBoundingClientRect();
        boxStartLeft = rect.left;
        boxStartTop = rect.top;
        dom.popupBox.style.transform = "none";
        dom.popupBox.style.left = boxStartLeft + "px";
        dom.popupBox.style.top = boxStartTop + "px";
        e.preventDefault();
    })
    document.addEventListener("mousemove",e=>{
        if(!popupDragging) return;
        let newX = boxStartLeft + e.clientX - dragStartX;
        let newY = boxStartTop + e.clientY - dragStartY;
        if(newX < 0) newX = 0;
        if(newY < 0) newY = 0;
        dom.popupBox.style.left = newX + "px";
        dom.popupBox.style.top = newY + "px";
    })
    document.addEventListener("mouseup",()=>{popupDragging=false;})
})();
function syncPlayButtonState(){
    if(dom.popMedia.paused){
        dom.popPlay.innerText = "播放";
        dom.btnPlay.innerText = "▶";
        dom.btnBottomPause.innerText = "▶";
    }else{
        dom.popPlay.innerText = "暂停";
        dom.btnPlay.innerText = "⏸";
        dom.btnBottomPause.innerText = "⏸";
    }
}
function openPopupMask(){
    popupIsMini = false;
    dom.popupMask.classList.remove("mini");
    dom.popupMask.classList.add("show");
    dom.popupBox.style.left = "";
    dom.popupBox.style.top = "";
    dom.popupBox.style.transform = "";
}
function closePopupMask(){
    dom.popupMask.classList.remove("show");
    dom.popupMask.classList.remove("mini");
    popupIsMini = false;
    dom.popupBox.style.left = "";
    dom.popupBox.style.top = "";
    dom.popupBox.style.transform = "";
}
function escapeHtml(str){
    if(!str)return "";
    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}
async function autoFetchCover(title, author){
    const exts = [".jpg",".jpeg",".png",".webp",".avif"];
    const baseKey = `cover/${encodeURIComponent(title)}`;
    for(let ext of exts){
        const url = `${API_BASE}/file?key=${baseKey}${ext}`;
        try{
            const resp = await fetch(url,{method:"HEAD"});
            if(resp.ok){
                return url;
            }
        }catch(e){
            continue;
        }
    }
    return null;
}
function getRandomPlayCount(){
    const min = 120000, max = 8000000;
    return Math.floor(Math.random()*(max - min + 1)) + min;
}
function getRandomFavCount(){
    const min = 330000, max = 9000000;
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
function startAutoPlayCount(){
    if(!currentPlayItem) return;
    if(playCountTimer) clearInterval(playCountTimer);
    playCountTimer = setInterval(()=>{
        if(!currentPlayItem) return;
        if(dom.popMedia.paused) return;
        currentPlayItem.playCount += 1;
    }, 60000);
}
function stopAutoPlayCount(){
    if(playCountTimer){ clearInterval(playCountTimer); playCountTimer = null; }
}
function getPlayHistory(){
    const raw = localStorage.getItem("posiPlayHistory");
    if(!raw) return [];
    try{ return JSON.parse(raw); }catch(e){ return []; }
}
function savePlayHistory(arr){ localStorage.setItem("posiPlayHistory",JSON.stringify(arr)); }
function addPlayHistory(item){
    let list = getPlayHistory();
    const idx = list.findIndex(i=>i.resourceKey === item.resourceKey);
    if(idx > -1) list.splice(idx,1);
    list.unshift(item);
    if(list.length > MAX_HISTORY_COUNT) list.length = MAX_HISTORY_COUNT;
    savePlayHistory(list);
    renderHistory();
}
function renderHistory(){
    dom.historyList.innerHTML = "";
    const list = getPlayHistory();
    if(list.length === 0){
        dom.historyList.innerHTML = `<div style="opacity:0.6;font-size:13px;">暂无播放记录</div>`;
        return;
    }
    list.forEach((item,index)=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent = `${index+1}. ${item.name}`;
        div.onclick = ()=> openPopupPlayer(item);
        dom.historyList.appendChild(div);
    })
}
function getExt(filename){
    const idx = filename.lastIndexOf(".");
    if(idx === -1) return "";
    return filename.slice(idx).toLowerCase();
}
async function autoLoadLyric(audioKey){
    let fileName = audioKey.split('/').pop();
    let pureName = fileName.substring(0,fileName.lastIndexOf('.'));
    const lyricPath = `lyric/${pureName}.lrc`;
    dom.lyricSearchInput.value = lyricPath;
    try{
        const res = await fetch(`${API_BASE}/lrc?key=${encodeURIComponent(lyricPath)}`);
        if(!res.ok){ lyricArr = []; renderLyricView(-1,0); return; }
        const lrcText = await res.text();
        loadLyricRaw(lrcText, lyricPath);
    }catch(err){
        lyricArr = []; renderLyricView(-1,0);
    }
}
function parseLyricAll(text, ext){
    ext = (ext || 'lrc').toLowerCase();
    let list = [];
    if (ext === '.lrc' || ext === 'lrc') {
        const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
        text.split("\n").forEach(line => {
            line = line.trim();
            const m = line.match(reg);
            if (!m) return;
            const time = parseInt(m[1]) * 60 + parseInt(m[2]) + (parseInt(m[3] || 0) / 1000);
            const txt = m[4].trim();
            list.push({ time, txt, words: null });
        });
    } else if (ext === '.krc' || ext === 'krc' || ext === '.qrc' || ext === 'qrc') {
        const lineReg = /\[(\d+),(\d+)\](.*)/;
        const wordReg = /<(\d+),(\d+),(\d+)>([^<]+)/g;
        text.split("\n").forEach(line => {
            line = line.trim();
            const lm = line.match(lineReg);
            if (!lm) return;
            const lineStart = parseInt(lm[1]) / 1000;
            const lineDur = parseInt(lm[2]) / 1000;
            const content = lm[3];
            const words = [];
            let w;
            while ((w = wordReg.exec(content)) !== null) {
                words.push({ offset: parseInt(w[1]) / 1000, duration: parseInt(w[2]) / 1000, char: w[4] });
            }
            const txt = words.map(x => x.char).join('');
            list.push({ time: lineStart, endTime: lineStart + lineDur, txt, words });
        });
    } else if (ext === '.trc' || ext === 'trc') {
        const lineReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
        const wordReg = /\((\d+),(\d+),(\d+)\)([^(]+)/g;
        text.split("\n").forEach(line => {
            line = line.trim();
            const lm = line.match(lineReg);
            if (!lm) return;
            const time = parseInt(lm[1]) * 60 + parseInt(lm[2]) + (parseInt(lm[3]) / 1000);
            const content = lm[4];
            const words = [];
            let w;
            while ((w = wordReg.exec(content)) !== null) {
                words.push({ offset: parseInt(w[1]) / 1000, duration: parseInt(w[2]) / 1000, char: w[4] });
            }
            const txt = words.map(x => x.char).join('');
            list.push({ time, txt, words });
        });
    }
    list.sort((a, b) => a.time - b.time);
    return list;
}
function renderLyricLine(lineData, isActive, currentTime){
    const div = document.createElement("div");
    div.className = "lyric-item" + (isActive ? " active" : "");
    if (lineData.words && lineData.words.length > 0) {
        lineData.words.forEach(w => {
            const span = document.createElement("span");
            span.className = "lyric-char";
            const wordEnd = w.offset + w.duration;
            if (currentTime >= wordEnd) span.classList.add("sung");
            else span.classList.add("unsung");
            span.textContent = w.char;
            div.appendChild(span);
        });
    } else {
        div.textContent = lineData.txt;
    }
    return div;
}
function renderLyricView(activeIdx, currentTime){
    if (currentTime === undefined) currentTime = 0;
    dom.lyricContainer.innerHTML = "";
    if (lyricArr.length === 0) {
        dom.lyricContainer.innerHTML = `<div class="lyric-item">暂无歌词</div>`;
        return;
    }
    const half = Math.floor(MAX_SHOW_LINES / 2);
    let start = activeIdx - half;
    if (start < 0) start = 0;
    let end = start + MAX_SHOW_LINES;
    if (end > lyricArr.length) {
        end = lyricArr.length;
        start = end - MAX_SHOW_LINES;
        if (start < 0) start = 0;
    }
    for (let i = start; i < end; i++) {
        const lineDiv = renderLyricLine(lyricArr[i], i === activeIdx, currentTime);
        dom.lyricContainer.appendChild(lineDiv);
    }
}
function loadLyricRaw(lrcRawText, filename){
    const ext = getExt(filename);
    lyricArr = parseLyricAll(lrcRawText, ext);
    currentLyricLine = -1;
    renderLyricView(-1, 0);
}
dom.lyricImportBtn.addEventListener("click", () => dom.lyricFileInput.click());
dom.lyricFileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { loadLyricRaw(ev.target.result, file.name); };
    reader.readAsText(file);
});
dom.lyricSearchBtn.addEventListener("click", async () => {
    const lyricKey = dom.lyricSearchInput.value.trim();
    if (!lyricKey) { alert("输入R2桶内的歌词文件名，例如：lyric/朝歌.lrc"); return; }
    try{
        const resp = await fetch(`${API_BASE}/lrc?key=${encodeURIComponent(lyricKey)}`);
        if(!resp.ok) throw new Error("未找到歌词文件");
        const text = await resp.text();
        loadLyricRaw(text, lyricKey);
    }catch(err){ alert("加载歌词失败："+err.message); }
});
function toggleFullscreen(){
    if (document.fullscreenElement) document.exitFullscreen();
    else dom.popMedia.requestFullscreen?.() || dom.popMedia.webkitRequestFullscreen?.();
}
document.addEventListener("keydown", function (e) {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    switch (e.key) {
        case " ":
            e.preventDefault();
            if (dom.popMedia.paused) { dom.popMedia.play(); startAutoPlayCount(); }
            else { dom.popMedia.pause(); stopAutoPlayCount(); }
            syncPlayButtonState();
            break;
        case "ArrowLeft": e.preventDefault(); dom.popMedia.currentTime = Math.max(0, dom.popMedia.currentTime - 5); break;
        case "ArrowRight": e.preventDefault(); dom.popMedia.currentTime += 5; break;
        case "ArrowUp": e.preventDefault(); dom.popMedia.volume = Math.min(1, dom.popMedia.volume + 0.1); break;
        case "ArrowDown": e.preventDefault(); dom.popMedia.volume = Math.max(0, dom.popMedia.volume - 0.1); break;
        case "f": case "F": toggleFullscreen(); break;
        case "Escape": if (document.fullscreenElement) document.exitFullscreen(); break;
    }
});
function formatWan(num){
    if (!num || isNaN(num)) return "0";
    const n = Number(num);
    if (n < 10000) return String(n);
    let res = (n / 10000).toFixed(1);
    if (res.endsWith(".0")) res = res.slice(0, -2);
    return res + "万";
}
async function renderOneCard(item){
    const div = document.createElement("div");
    div.className = "card-item";
    div.innerHTML = `
        <div class="card-cover">
            <img src="${DEFAULT_COVER}" loading="lazy" alt="封面">
            <span class="card-more">●</span>
            <span class="card-play">▶</span>
        </div>
        <div class="card-info">
            <div class="card-title-wrap">
                <div class="card-title">${escapeHtml(item.name)}</div>
            </div>
            <div class="card-author"></div>
            <div class="card-stat">
                <span>播放:${formatWan(item.playCount)}</span>
                <span>收藏:${formatWan(item.favCount)}</span>
            </div>
        </div>
        <button class="btn-card-download">${currentCategory==="image"?"查看":"播放"}</button>
    `;
    div.dataset.key = item.resourceKey;
    const coverImg = div.querySelector(".card-cover img");
    if(currentCategory === "music"){
        const coverSrc = await autoFetchCover(item.name, item.author);
        if(coverSrc){
            coverImg.src = coverSrc;
        }
    }
    coverImg.onerror = function(){
        this.src = DEFAULT_COVER;
    };
    div.querySelector(".card-more").addEventListener("click", e => {
        e.stopPropagation();
        const rect = e.target.getBoundingClientRect();
        dom.moreMenu.style.left = rect.left + "px";
        dom.moreMenu.style.top = (rect.top + 24) + "px";
        dom.moreMenu.classList.add("show");
        dom.moreMenu.dataset.cur = JSON.stringify(item);
    });
    div.querySelector(".btn-card-download").addEventListener("click", e => {
        e.stopPropagation();
        if(currentCategory === "image"){
            window.open(`${API_BASE}/file?key=${encodeURIComponent(item.resourceKey)}`,"_blank");
        }else{
            openPopupPlayer(item);
        }
    });
    div.addEventListener("click", () => {
        if(currentCategory === "image"){
            window.open(`${API_BASE}/file?key=${encodeURIComponent(item.resourceKey)}`,"_blank");
        }else{
            openPopupPlayer(item);
        }
    });
    dom.cardWrap.appendChild(div);
}
function renderDonateView(list){
    dom.cardWrap.innerHTML = "";
    let wechatItem = null;
    let alipayItem = null;
    for(const it of list){
        const lower = it.name.toLowerCase();
        if(lower.includes("微信")) wechatItem = it;
        if(lower.includes("支付宝")) alipayItem = it;
    }
    const html = `
    <div class="donate-card-wrap">
        <div class="donate-item">
            <img src="${wechatItem ? `${API_BASE}/file?key=${encodeURIComponent(wechatItem.resourceKey)}` : DEFAULT_COVER}">
            <div class="donate-name">${wechatItem ? escapeHtml(wechatItem.name) : "微信赞赏(未找到资源)"}</div>
        </div>
        <div class="donate-item">
            <img src="${alipayItem ? `${API_BASE}/file?key=${encodeURIComponent(alipayItem.resourceKey)}` : DEFAULT_COVER}">
            <div class="donate-name">${alipayItem ? escapeHtml(alipayItem.name) : "支付宝赞赏(未找到资源)"}</div>
        </div>
    </div>
    `;
    dom.cardWrap.innerHTML = html;
}
function renderCard(list){
    if(currentCategory === "image"){
        renderDonateView(list);
        return;
    }
    dom.cardWrap.innerHTML = "";
    list.forEach(item => {
        if (item.favCount === null || item.favCount === undefined) {
            item.favCount = getRandomFavCount();
        }
        renderOneCard(item);
    });
}
function openPopupPlayer(item){
    stopAutoPlayCount();
    currentPlayItem = item;
    dom.popTitle.innerText = item.name;
    dom.popAuthor.innerText = "";
    openPopupMask();
    dom.floatLyric.classList.add("show");
    lyricArr = [];
    currentLyricLine = -1;
    renderLyricView(-1, 0);
    dom.popMedia.src = `${API_BASE}/file?key=${encodeURIComponent(item.resourceKey)}`;
    dom.popMedia.currentTime = 0;
    addPlayHistory(item);
    currentIndex = playQueue.findIndex(p => p.resourceKey === item.resourceKey);
    if(currentCategory === "music") autoLoadLyric(item.resourceKey);
    dom.popMedia.play().then(()=>{
        syncPlayButtonState();
        startAutoPlayCount();
    }).catch(()=>{
        syncPlayButtonState();
    });
}
dom.popupMini.addEventListener("click",()=>{
    popupIsMini = !popupIsMini;
    if(popupIsMini){
        dom.popupMask.classList.add("mini");
    }else{
        dom.popupMask.classList.remove("mini");
        dom.popupBox.style.left = "";
        dom.popupBox.style.top = "";
    }
});
dom.popupClose.addEventListener("click", () => {
    closePopupMask();
    dom.floatLyric.classList.remove("show");
    dom.popMedia.pause();
    stopAutoPlayCount();
    syncPlayButtonState();
});
dom.bottomPlayerWrap.addEventListener("click",(e)=>{
    if(e.target.tagName === "BUTTON") return;
    if(currentPlayItem && popupIsMini){
        popupIsMini = false;
        dom.popupMask.classList.remove("mini");
        dom.popupBox.style.left = "";
        dom.popupBox.style.top = "";
    }
});
dom.popPlay.addEventListener("click", () => {
    if (dom.popMedia.paused) {
        dom.popMedia.play();
        startAutoPlayCount();
    } else {
        dom.popMedia.pause();
        stopAutoPlayCount();
    }
    syncPlayButtonState();
});
dom.popFull.addEventListener("click", toggleFullscreen);
dom.btnFullScreen.addEventListener("click", toggleFullscreen);
function playPrev(){
    if(playQueue.length===0)return;
    if (playMode === 2) currentIndex = Math.floor(Math.random() * playQueue.length);
    else { currentIndex--; if (currentIndex < 0) currentIndex = playQueue.length - 1; }
    openPopupPlayer(playQueue[currentIndex]);
}
function playNext(){
    if(playQueue.length===0)return;
    if (playMode === 2) currentIndex = Math.floor(Math.random() * playQueue.length);
    else { currentIndex++; if (currentIndex >= playQueue.length) currentIndex = 0; }
    openPopupPlayer(playQueue[currentIndex]);
}
document.getElementById("popPrev").addEventListener("click", playPrev);
document.getElementById("popNext").addEventListener("click", playNext);
dom.btnPrev.onclick = playPrev;
dom.btnNext.onclick = playNext;
dom.btnPlay.onclick = () => {
    if (dom.popMedia.paused) { dom.popMedia.play(); startAutoPlayCount(); }
    else { dom.popMedia.pause(); stopAutoPlayCount(); }
    syncPlayButtonState();
};
dom.btnBottomPause.onclick = () => {
    if (dom.popMedia.paused) { dom.popMedia.play(); startAutoPlayCount(); }
    else { dom.popMedia.pause(); stopAutoPlayCount(); }
    syncPlayButtonState();
};
dom.btnRewind.onclick = () => { dom.popMedia.currentTime = Math.max(0, dom.popMedia.currentTime - 5); };
dom.btnForward.onclick = () => { dom.popMedia.currentTime = dom.popMedia.currentTime + 5; };
dom.bottomProgressBar.addEventListener("click", e => {
    const rect = dom.bottomProgressBar.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    if (dom.popMedia.duration) dom.popMedia.currentTime = percent * dom.popMedia.duration;
});
dom.btnMode.onclick = () => {
    playMode++;
    if (playMode > 2) playMode = 0;
    const modeText = ["🔁列表循环", "🔂单曲循环", "🎲随机播放"];
    dom.btnMode.innerText = modeText[playMode];
};
dom.btnBottomFav.onclick = () => { alert("收藏逻辑，对接后端收藏接口"); };
dom.popMedia.addEventListener("play",()=>{syncPlayButtonState();startAutoPlayCount();});
dom.popMedia.addEventListener("pause",()=>{syncPlayButtonState();stopAutoPlayCount();});
dom.popMedia.addEventListener("timeupdate", () => {
    const t = dom.popMedia.currentTime;
    let active = -1;
    for (let i = 0; i < lyricArr.length; i++) { if (lyricArr[i].time <= t) active = i; }
    if (active !== currentLyricLine) currentLyricLine = active;
    renderLyricView(currentLyricLine, t);
    if (dom.popMedia.duration) {
        const pct = t / dom.popMedia.duration;
        dom.bottomDot.style.left = (pct * 100) + "%";
    }
});
dom.popMedia.addEventListener("ended", () => {
    stopAutoPlayCount();
    if (playMode === 1) {
        dom.popMedia.currentTime = 0;
        dom.popMedia.play();
        startAutoPlayCount();
    }
    else playNext();
});
(function initLyricDrag(){
    const wrap = dom.floatLyric;
    let dragging = false, startX, startY, initLeft, initTop;
    wrap.addEventListener("mousedown", e => {
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        const rect = wrap.getBoundingClientRect();
        initLeft = rect.left; initTop = rect.top;
        wrap.style.zIndex = 99985;
        e.preventDefault();
    });
    document.addEventListener("mousemove", e => {
        if (!dragging) return;
        wrap.style.left = (initLeft + e.clientX - startX) + "px";
        wrap.style.top = (initTop + e.clientY - startY) + "px";
    });
    document.addEventListener("mouseup", () => { dragging = false; });
})();
dom.moreMenu.addEventListener("click", e => {
    const act = e.target.dataset.act;
    const item = JSON.parse(dom.moreMenu.dataset.cur);
    if (act === "share") alert(`分享：${item.name}`);
    if (act === "addToCollect") alert("加入收藏，对接接口");
    if (act === "copyKey") { navigator.clipboard.writeText(item.resourceKey); alert("已复制资源key"); }
    dom.moreMenu.classList.remove("show");
});
document.addEventListener("click", () => dom.moreMenu.classList.remove("show"));
document.querySelectorAll(".tab-item").forEach(tab => {
    tab.addEventListener("click", function () {
        document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
        this.classList.add("active");
        currentCategory = this.dataset.type;
        loadResourceList(currentCategory);
    });
});
document.querySelector(".search-box").addEventListener("input", e => {
    const kw = e.target.value.trim().toLowerCase();
    const filtered = playQueue.filter(item => {
        const name = (item.name || "").toLowerCase();
        return name.includes(kw);
    });
    renderCard(filtered);
});
async function loadResourceList(category="music"){
    let fetchUrl;
    if(category === "music") fetchUrl = `${API_BASE}/list`;
    else if(category === "video") fetchUrl = `${API_BASE}/videoList`;
    else if(category === "image") fetchUrl = `${API_BASE}/imageList`;
    try{
        const res = await fetch(fetchUrl);
        const listRaw = await res.json();
        playQueue = listRaw.map(obj=>{
            const filename = obj.key;
            let name = filename;
            const lastSlash = name.lastIndexOf("/");
            if (lastSlash !== -1) {
                name = name.substring(lastSlash + 1);
            }
            name = name.replace(/\.[^/.]+$/,"");
            return {
                resourceKey: obj.key,
                name: name,
                author:"",
                coverImg:"",
                playCount:getRandomPlayCount(),
                favCount:getRandomFavCount()
            };
        });
        renderCard(playQueue);
        renderHistory();
    }catch(err){
        alert("拉取R2资源失败："+err.message);
        console.error(err);
    }
}
loadResourceList("music");
