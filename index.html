<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 8%),
        radial-gradient(circle at 30% 10%, rgba(180,140,255,0.6) 0%, transparent 10%),
        radial-gradient(circle at 70% 15%, rgba(100,180,255,0.6) 0%, transparent 12%),
        radial-gradient(circle at 50% 50%, rgba(255,210,255,0.5) 0%, transparent 16%),
        radial-gradient(circle at 80% 60%, rgba(140,110,220,0.6) 0%, transparent 10%),
        radial-gradient(circle at 20% 80%, rgba(100,200,255,0.5) 0%, transparent 12%),
        linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #312e81 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 20px 20px, 35px 35px, 50px 50px;
    background-position: 0 0, 10px 10px, 25px 25px;
    animation: twinkle 8s infinite ease-in-out;
}
body::after{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle at 50% 0%, rgba(160,110,255,0.18), transparent 35%);
}
@keyframes twinkle{
    0%{ opacity: 0.6; }
    50%{ opacity: 1; }
    100%{ opacity: 0.6; }
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#ffc6e8,#c3b2ff,#90d8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    position: relative;
    z-index: 2;
}
.nav-bar{
    width: 94%;
    max-width: 1400px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
}
.nav-btn{
    padding: 8px 18px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    background: linear-gradient(145deg, #b89bff,#7b61d8);
    color:#fff;
    box-shadow: 0 3px 10px rgba(124,97,216,0.45);
}
.nav-btn.active{
    background: linear-gradient(145deg,#ffadd8,#9380ff);
    transform: scale(1.04);
}
.search-wrap{
    width:94%;
    max-width:1400px;
    margin:0 auto 20px;
    position:relative;
    z-index:2;
}
#searchInput{
    width:100%;
    padding:10px 16px;
    border-radius:999px;
    border:none;
    font-size:15px;
    background:rgba(255,255,255,0.15);
    color:#fff;
    backdrop-filter: blur(8px);
}
#searchInput::placeholder{
    color:rgba(255,255,255,0.6);
}
.card-container{
    width:94%;
    max-width:1400px;
    margin:0 auto;
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap:14px;
    position:relative;
    z-index:2;
}
.media-card{
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.18);
    transition:0.25s;
    color:#fff;
    font-size:13px;
    overflow:hidden;
}
.media-card:hover{
    background:rgba(255,255,255,0.22);
    transform:translateY(-3px);
}
/*悬浮播放器容器 2/3播放器，1/3播放列表 */
.float-player-wrap{
    position:fixed;
    top:120px;
    right:20px;
    width:760px;
    height:420px;
    background:rgba(24,22,44,0.75);
    backdrop-filter: blur(16px);
    border-radius:16px;
    border:1px solid rgba(210,180,255,0.35);
    z-index:100;
    display:flex;
    overflow:hidden;
    box-shadow: 0 8px 32px rgba(120,80,220,0.35);
}
/*左侧播放列表占1/3*/
.playlist-panel{
    width:33%;
    height:100%;
    border-right:1px solid rgba(255,255,255,0.16);
    padding:10px;
    overflow-y:auto;
    color:#fff;
}
/*右侧播放器主体占2/3*/
.player-main{
    width:67%;
    height:100%;
    position:relative;
}
#mainVideo{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}
.playlist-item{
    padding:7px 6px;
    border-radius:8px;
    margin-bottom:4px;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
}
.playlist-item.active{
    background:rgba(168,130,255,0.35);
}
.playlist-item button{
    border:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#ff6b81;
    color:white;
    cursor:pointer;
}
/*底部全局播放控制栏*/
.bottom-control-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:110px;
    background:rgba(17,14,34,0.82);
    backdrop-filter: blur(14px);
    border-top:1px solid rgba(190,160,255,0.3);
    z-index:200;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 24px;
}
.bottom-control-bar button{
    border:none;
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    background:linear-gradient(145deg,#a78bff,#6848d6);
    color:#fff;
    box-shadow:0 2px 8px #6848d660;
}
.progress-wrap{
    flex-grow:1;
}
#progressBar{
    width:100%;
}
/*悬浮歌词窗口*/
.lyric-float-box{
    position:fixed;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    z-index:150;
    padding:12px 22px;
    border-radius:10px;
    color:#ffffff;
    font-size:24px;
    text-align:center;
    min-width:320px;
}
.lyric-float-box:hover{
    border:1px solid rgba(220,190,255,0.55);
}
</style>
</head>
<body>
    <h1 class="main-title">步丝丝《朝歌》</h1>
    <!--导航：移除首页Home，保留音乐、视频、图片、赞赏 -->
    <div class="nav-bar">
        <button class="nav-btn active" data-type="music">音乐 Music</button>
        <button class="nav-btn" data-type="video">视频 Video</button>
        <button class="nav-btn" data-type="image">图片</button>
        <button class="nav-btn" data-type="reward">赞赏</button>
    </div>
    <div class="search-wrap">
        <input id="searchInput" placeholder="搜索歌曲名，歌手">
    </div>
    <div class="card-container" id="cardBox"></div>

    <!--悬浮播放器窗口：左列表1/3，右播放器2/3 -->
    <div class="float-player-wrap" id="floatPlayer">
        <div class="playlist-panel">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span>播放目录</span>
                <button id="collapsePlaylist">收起</button>
            </div>
            <div id="playlistDom"></div>
        </div>
        <div class="player-main">
            <video id="mainVideo"></video>
        </div>
    </div>

    <!--底部控制栏 -->
    <div class="bottom-control-bar">
        <button id="btnPrev">上一曲</button>
        <button id="btnPlay">播放</button>
        <button id="btnNext">下一曲</button>
        <div class="progress-wrap">
            <input type="range" id="progressBar" min="0" max="100" value="0">
        </div>
        <span id="timeText">00:00 / 00:00</span>
        <button id="openPlayerBtn">打开播放器</button>
    </div>

    <!--悬浮歌词 -->
    <div class="lyric-float-box" id="lyricBox">暂无歌词</div>

    <audio id="mainAudio">

<script>
const API_BASE = "https://api.busisi.com";
const dom = {
    cardBox:document.querySelector("#cardBox"),
    searchInput:document.querySelector("#searchInput"),
    playlistDom:document.querySelector("#playlistDom"),
    floatPlayer:document.querySelector("#floatPlayer"),
    mainVideo:document.querySelector("#mainVideo"),
    mainAudio:document.querySelector("#mainAudio"),
    lyricBox:document.querySelector("#lyricBox"),
    progressBar:document.querySelector("#progressBar"),
    timeText:document.querySelector("#timeText"),
    btnPrev:document.querySelector("#btnPrev"),
    btnPlay:document.querySelector("#btnPlay"),
    btnNext:document.querySelector("#btnNext"),
    openPlayerBtn:document.querySelector("#openPlayerBtn"),
    collapsePlaylist:document.querySelector("#collapsePlaylist")
};

let globalResourceList = [];
let playQueue = [];
let currentPlayIndex = -1;
let currentTabType = "music";

// 判断是否可以播放的媒体
function isPlayableMedia(itemKey){
    const k = itemKey.toLowerCase();
    const mediaSuffix = [".mp3",".flac",".wav",".m4a",".mp4",".mov"];
    const skipFolder = ["图片/","歌词/","赞赏/"];
    if(skipFolder.some(folder=>k.startsWith(folder))) return false;
    return mediaSuffix.some(suf=>k.endsWith(suf));
}

// 获取全部R2资源
async function loadAllResource(){
    const resp = await fetch(`${API_BASE}/listAll`);
    globalResourceList = await resp.json();
    renderFilterList();
}

// 渲染列表（去掉首页逻辑，只有music/video/image/reward）
function renderFilterList(){
    let arr = [];
    if(currentTabType === "music"){
        arr = globalResourceList.filter(i=>i.key.toLowerCase().startsWith("music/"));
    }else if(currentTabType === "video"){
        arr = globalResourceList.filter(i=>i.key.toLowerCase().startsWith("video/"));
    }else if(currentTabType === "image"){
        arr = globalResourceList.filter(i=>i.key.toLowerCase().startsWith("图片/"));
    }else if(currentTabType === "reward"){
        arr = globalResourceList.filter(i=>i.key.toLowerCase().startsWith("赞赏/"));
    }
    //搜索过滤
    const kw = dom.searchInput.value.trim().toLowerCase();
    if(kw){
        arr = arr.filter(x=>x.key.toLowerCase().includes(kw));
    }
    dom.cardBox.innerHTML = "";
    arr.forEach(item=>{
        const div = document.createElement("div");
        div.className = "media-card";
        div.innerText = item.key;
        div.onclick = ()=>{
            if(!isPlayableMedia(item.key)){
                alert("该资源不可播放");
                return;
            }
            playQueue.push(item);
            renderPlayListUi();
            playMedia(playQueue.length - 1);
        }
        dom.cardBox.appendChild(div);
    })
}

//渲染播放列表UI
function renderPlayListUi(){
    dom.playlistDom.innerHTML = "";
    playQueue.forEach((item,idx)=>{
        if(!isPlayableMedia(item.key)) return;
        const div = document.createElement("div");
        div.className = "playlist-item"+(idx===currentPlayIndex?" active":"");
        div.innerHTML = `<span title="${item.key}">${item.key}</span> <button>×</button>`;
        div.onclick = (e)=>{
            if(e.target.tagName==="BUTTON"){
                playQueue.splice(idx,1);
                if(currentPlayIndex >= playQueue.length) currentPlayIndex = playQueue.length - 1;
                renderPlayListUi();
                return;
            }
            playMedia(idx);
        }
        dom.playlistDom.appendChild(div);
    })
}

//播放媒体
async function playMedia(idx){
    if(idx<0 || idx>=playQueue.length) return;
    currentPlayIndex = idx;
    const item = playQueue[idx];
    const url = `${API_BASE}/getFile?key=${encodeURIComponent(item.key)}`;
    if(item.key.toLowerCase().endsWith(".mp4") || item.key.toLowerCase().endsWith(".mov")){
        dom.mainAudio.src = "";
        dom.mainVideo.src = url;
        await dom.mainVideo.play().catch(err=>console.log(err));
    }else{
        dom.mainVideo.src = "";
        dom.mainAudio.src = url;
        await dom.mainAudio.play().catch(err=>console.log(err));
    }
    renderPlayListUi();
}

//标签切换
document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.onclick = function(){
        document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
        currentTabType = this.dataset.type;
        renderFilterList();
    }
})

dom.searchInput.oninput = renderFilterList;

dom.btnPlay.onclick = function(){
    if(currentPlayIndex<0) return;
    const item = playQueue[currentPlayIndex];
    if(item.key.toLowerCase().endsWith(".mp4")||item.key.toLowerCase().endsWith(".mov")){
        if(dom.mainVideo.paused) dom.mainVideo.play();
        else dom.mainVideo.pause();
    }else{
        if(dom.mainAudio.paused) dom.mainAudio.play();
        else dom.mainAudio.pause();
    }
}
dom.btnNext.onclick = function(){
    if(currentPlayIndex+1 < playQueue.length) playMedia(currentPlayIndex+1);
}
dom.btnPrev.onclick = function(){
    if(currentPlayIndex-1 >= 0) playMedia(currentPlayIndex-1);
}

loadAllResource();
</script>
</body>
</html>
