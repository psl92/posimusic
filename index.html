<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    color:#7b2cb4;
}
.nav-bar{
    display:flex;gap:12px;padding:12px 24px;background:rgba(255,255,255,0.4);backdrop-filter:blur(8px);
}
.nav-bar span{
    padding:8px 16px;border-radius:20px;background:#fff;cursor:pointer;
}
.search-box{
    margin:20px 24px;
    width:calc(100% - 48px);
    padding:12px;border-radius:30px;border:none;outline:none;
}
.content-wrap{
    display:grid;grid-template-columns:repeat(8,1fr);gap:16px;padding:0 24px;
}
.card{
    background:rgba(255,255,255,0.6);border-radius:12px;padding:10px;text-align:center;
}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;margin-bottom:8px;}
.play-layout{
    display:flex;gap:20px;padding:24px;position:fixed;bottom:0;left:0;width:100%;background:rgba(255,255,255,0.7);
}
.player-main{width:66%;}
.play-list{width:33%;border-left:1px solid #ccc;padding-left:20px;}
.progress{width:100%;height:6px;background:#ddd;border-radius:3px;margin-top:12px;}
.progress-inner{height:100%;width:0%;background:#7b2cb4;border-radius:3px;}
</style>
</head>
<body>
<h1 class="main-title">步丝丝《朝歌》</h1>
<div class="nav-bar">
    <span>首页 Home</span>
    <span>音乐 Music</span>
    <span>视频 Video</span>
    <span>图片</span>
    <span>赞赏</span>
</div>
<input class="search-box" id="searchInput" placeholder="搜索歌曲名、歌手">
<div class="content-wrap" id="cardWrap"></div>

<div class="play-layout">
    <div class="player-main">
        <h3>播放器区域</h3>
        <p id="playName">暂无播放</p>
        <div class="progress">
            <div class="progress-inner" id="progressBar"></div>
        </div>
    </div>
    <div class="play-list">
        <h3>播放目录 <span onclick="hideList()">收起</span></h3>
        <div id="listBox"></div>
    </div>
</div>

<audio id="audioPlayer">

<script>
const API_HOST = "https://proud-tooth-xxxx.workers.dev"; //替换你的Worker域名
let showData = [];
const audio = document.getElementById("audioPlayer");

// 页面加载自动拉取前台发布数据
window.onload = async function(){
    const res = await fetch(`${API_HOST}/api/show/list`);
    const json = await res.json();
    showData = json.data;
    renderCard();
}

// 渲染卡片
function renderCard(){
    const wrap = document.getElementById("cardWrap");
    wrap.innerHTML = "";
    showData.forEach(item=>{
        const div = document.createElement("div");
        div.className = "card";
        const coverUrl = item.coverKey ? `${API_HOST}/api/stream?nam=${item.coverKey}` : "";
        div.innerHTML = `
            ${coverUrl?`<img src="${coverUrl}">`:"<div style='height:120px;background:#eee;line-height:120px'>无封面</div>"}
            <p>${item.name}</p>
            <p style="font-size:12px;color:#666">${item.author}</p>
        `
        div.onclick = ()=>playMusic(item);
        wrap.appendChild(div);
    })
}

// 播放歌曲
function playMusic(item){
    if(!item.audioKey) return alert("无音频文件");
    const audioUrl = `${API_HOST}/api/stream?nam=${item.audioKey}`;
    audio.src = audioUrl;
    audio.play();
    document.getElementById("playName").innerText = `正在播放：${item.name} - ${item.author}`;
    addPlayList(item);
}

// 添加到播放列表
function addPlayList(item){
    const listWrap = document.getElementById("listBox");
    const p = document.createElement("p");
    p.style="margin:8px 0;cursor:pointer";
    p.innerText = item.name;
    p.onclick = ()=>playMusic(item);
    listWrap.appendChild(p);
}

function hideList(){
    document.querySelector(".play-list").style.display = "none";
}
</script>
</body>
</html>
