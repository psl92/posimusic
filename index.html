<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posimusic 步丝丝音乐完整版</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", system-ui, sans-serif;
}
body{
    background: radial-gradient(circle at 15% 10%, #7026d8 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, #5218a6 0%, transparent 48%),
                #2c0b52;
    padding:12px;
    min-height: 100vh;
    color:#ffffff;
}
.wrapper{
    width:100%;
    max-width:1900px;
    height:96vh;
    position:relative;
}
/* 顶部导航 胶囊按钮 */
.top-bar{
    display:flex;
    justify-content:flex-start;
    gap:10px;
    padding:10px 0;
}
.top-bar button{
    padding:7px 20px;
    border:none;
    border-radius:9999px;
    background: linear-gradient(145deg,#8844e0,#5921b8);
    color:#fff;
    cursor:pointer;
    box-shadow: 0 3px 12px rgba(136,68,224,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.25s ease;
}
.top-bar button:hover{
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(136,68,224,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
}
.top-bar button.active{
    background: linear-gradient(145deg,#a264ff,#743cb4);
    box-shadow: 0 0 14px rgba(162,100,255,0.6);
}
.top-right{
    display:flex;
    gap:10px;
}
.main-container{
    display:flex;
    gap:20px;
    height:calc(100% - 120px);
}
.display-area{
    flex:1;
    overflow-y:auto;
}
.card-grid{
    display:grid;
    gap:18px;
    padding:10px;
}
.home-grid{grid-template-columns: repeat(4, 1fr);}
.music-grid{grid-template-columns: repeat(7, 1fr);}
.video-grid{grid-template-columns: repeat(4, 1fr);}
.item-card{
    background: linear-gradient(135deg,rgba(110,40,200,0.3),rgba(70,20,140,0.2));
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,0.15);
    border-radius:22px;
    overflow:hidden;
    padding-bottom:12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 10px rgba(120,40,220,0.15);
    transition: transform 0.3s ease;
}
.item-card:hover{
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 18px rgba(140,60,255,0.28);
}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}
.card-info{padding:10px 12px;}
.card-name{font-weight:bold;font-size:15px;margin-bottom:5px;}
.card-singer{font-size:13px;opacity:0.85;margin-bottom:8px;}
.card-data-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
.card-bottom-btn{display:flex;gap:6px;}
.comment-card-btn{
    font-size:11px;padding:3px 12px;border:none;border-radius:9999px;
    background: linear-gradient(135deg,#914cdf,#6633aa);
    color:#fff;cursor:pointer;transition:0.2s;
}
.comment-card-btn:hover{filter:brightness(1.15);}
.like-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;transition:0.2s;}
.like-btn:hover{transform:scale(1.2);}
.like-btn.liked{color:#ff5577;text-shadow:0 0 6px #ff5577;}
/* 侧边栏缩小，不会大面积占屏 */
.sidebar{
    width:240px;
    flex-shrink:0;
}
.sidebar-block{
    background: linear-gradient(135deg,rgba(90,30,170,0.28),rgba(50,15,100,0.18));
    backdrop-filter: blur(12px);border:1px solid rgba(255,255,0.12);
    border-radius:20px;padding:14px;margin-bottom:22px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.block-title{font-size:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,0.18);margin-bottom:10px;}
.history-item{display:flex;justify-content:space-between;padding:6px 6px;border-radius:12px;cursor:pointer;font-size:13px;transition:0.2s;}
.history-item:hover{background:rgba(130,60,230,0.25);}
.del-tag{width:18px;height:18px;background:#f44336;border-radius:9999px;text-align:center;font-size:11px;line-height:18px;}
.db-tab-group{display:flex;gap:6px;margin:10px 0;}
.db-tab{flex:1;padding:5px;border:none;border-radius:9999px;background:rgba(80,30,150,0.4);color:#fff;cursor:pointer;transition:0.2s;}
.db-tab.active{background: linear-gradient(135deg,#8642e2,#743cb4);box-shadow:0 0 10px rgba(120,40,220,0.4);}
.db-item{padding:8px;font-size:13px;margin:6px 0;border-radius:14px;background:rgba(75,25,140,0.35);}
.db-btn-group{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.db-btn{font-size:10px;padding:3px 9px;border:none;border-radius:9999px;color:#fff;cursor:pointer;}
.db-btn-home{background:#3674d8;}.btn-music{background:#279e48;}.btn-video{background:#dd8c22;}.btn-del{background:#dd3333;}
.btn-del {
    pointer-events: auto !important;
    position: relative;
    z-index: 5;
}
#dbWrap {
    max-height: 52vh;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 6px;
    pointer-events: auto;
    position: relative;
    z-index: 2;
}
.bottom-control{position:absolute;bottom:10px;left:0;width:100%;}
.progress-bar{width:100%;margin-bottom:12px;accent-color:#a264ff;}
.control-buttons{display:flex;justify-content:center;gap:22px;align-items:center;}
.ctrl-btn{width:38px;height:38px;border:none;border-radius:9999px;background: linear-gradient(145deg,#8844e0,#5921b8);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(110,40,200,0.35);transition:0.2s;}
.ctrl-btn:hover{transform:scale(1.1);}
.play-main{width:56px;height:56px;font-size:22px;background: linear-gradient(145deg,#b370ff,#743cb4);box-shadow:0 0 16px rgba(160,90,255,0.5);}
.modal{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);justify-content:center;align-items:center;z-index:999;
}
.modal-box{
    background: linear-gradient(135deg,rgba(85,30,165,0.35),rgba(40,10,80,0.22));
    backdrop-filter: blur(14px);border:1px solid rgba(255,255,0.18);
    color:#fff;padding:26px;border-radius:24px;width:480px;max-height:80vh;overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}
.input-item{margin:10px 0;}
.input-item input, .input-item textarea{
    width:100%;
    padding:10px;
    border:1px solid rgba(255,255,0.2);
    border-radius:14px;
    background:rgba(255,255,0.08);
    color:#fff;
    outline:none;
}
.input-item input:focus, .input-item textarea:focus{
    border-color:#a264ff;
    box-shadow:0 0 8px rgba(162,100,255,0.4);
}
.modal-buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;}
.modal-buttons button{padding:7px 22px;border:none;border-radius:9999px;background: linear-gradient(135deg,#8844e0,#5921b8);color:#fff;cursor:pointer;transition:0.2s;}
.modal-buttons button:hover{filter:brightness(1.15);}
.home-view,.music-view,.video-view{display:none;}.active-view{display:block;}
#uploadOpenBtn,#statOpenBtn,#dbBoxWrap{display: none;}
.comment-item{padding:10px;border-bottom:1px solid rgba(255,255,0.12);font-size:13px;}
.comment-name{font-weight:bold;color:#d8b8ff;}.comment-time{font-size:11px;color:#ccc;}
.comment-del{float:right;background:#f44336;color:#fff;border:none;font-size:10px;padding:2px 6px;border-radius:9999px;}
.donate-img-box{display:flex;gap:10px;flex-wrap:wrap;margin:10px;}
.donate-img-box img{width:160px;border-radius:12px;border:1px solid #ffffff33;}
.switch-btn{
    background:transparent;border:none;color:#a264ff;margin-top:8px;cursor:pointer;text-align:left;
}

/* ===== 播放器弹窗【粉紫磨砂无黄色，修复全屏】 ===== */
.play-modal-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(25,10,40,0.72);
    z-index:10000;
    align-items:center;
    justify-content:center;
}
.play-modal-box{
    width:85%;
    max-width:1300px;
    /* 彻底消除黄色，粉紫渐变玻璃 */
    background: linear-gradient(135deg, rgba(230,170,245,0.18), rgba(160,120,240,0.22));
    backdrop-filter:blur(20px);
    border-radius:28px;
    border:1px solid rgba(235, 190, 255, 0.35);
    padding:30px;
    color:#fff;
    position:relative;
    box-shadow: 0 0 35px rgba(210,140,255,0.18);
}
/* 全屏单独样式，不会拉伸页面 */
.play-modal-box:fullscreen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-modal-box:-webkit-full-screen{
    width:100vw;
    height:100vh;
    max-width:unset;
    border-radius:0;
}
.play-close{
    position:absolute;
    top:16px;
    right:20px;
    font-size:26px;
    cursor:pointer;
}
.play-content-row{
    display:grid;
    grid-template-columns:64% 34%;
    gap:2%;
}
.media-view{
    width:100%;
    border-radius:18px;
    background:#000;
    overflow:hidden;
}
/* video兼容修复，解决有声无画面 */
.media-view video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    border-radius: 18px;
    object-fit: contain;
    crossorigin:anonymous;
    preload:auto;
}
.audio-cover-box{
    padding:40px;
    text-align:center;
}
.audio-cover-box img{
    width:320px;
    border-radius:16px;
}
.lyric-area{
    height:380px;
    overflow-y:auto;
    padding:15px;
    scrollbar-width: none;
}
.lyric-area::-webkit-scrollbar{
    width: 0;
    height: 0;
}
.lyric-area::-webkit-scrollbar-thumb{
    background: transparent;
}
.lyric-area::-webkit-scrollbar-track{
    background: transparent;
}
.lyric-wrap{
    transition: transform 0.4s ease-out;
}
.lyric-line{
    padding:10px 0;
    font-size:17px;
    text-align:center;
}
.lyric-char {
    color: rgba(255, 255, 255, 0.35);
    transition: color 0.25s ease, text-shadow 0.25s ease;
}
.lyric-char.active {
    color: #ffd0f0;
    text-shadow: 0 0 8px #ffd0f0, 0 0 16px #ff80c0;
}
.play-control-bar{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:16px;
}
/* 核心：替换所有黄色按钮为紫色渐变，尺寸、圆角、内边距完全不变 */
.play-control-bar button{
    background: linear-gradient(145deg,#8844e0,#5921b8) !important;
    border:none;
    color:#fff !important;
    border-radius:999px;
    padding:10px 18px;
    font-size:18px;
    cursor:pointer;
    transition: filter 0.2s ease;
}
.play-control-bar button:hover{
    filter: brightness(1.18);
}
.progress{
    flex:1;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="top-bar">
        <button class="nav-switch active" data-view="home">首页</button>
        <button class="nav-switch" data-view="music">音乐</button>
        <button class="nav-switch" data-view="video">视频</button>
        <button id="uploadOpenBtn">上传</button>
        <button id="statOpenBtn">统计</button>
        <div class="top-right">
            <button id="adminLoginBtn">登录/注册 ∨</button>
            <button id="donateBtn">赞赏</button>
        </div>
    </div>
    <div class="main-container">
        <div class="display-area">
            <div class="home-view active-view"><div class="card-grid home-grid" id="homeCardWrap"></div></div>
            <div class="music-view"><div class="card-grid music-grid" id="musicCardWrap"></div></div>
            <div class="video-view"><div class="card-grid video-grid" id="videoCardWrap"></div></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-block">
                <div class="block-title">播放列表（历史记录）</div>
                <div id="historyWrap"></div>
            </div>
            <div class="sidebar-block" id="dbBoxWrap">
                <div class="block-title">资源数据库(管理员专用)</div>
                <div class="db-tab-group">
                    <button class="db-tab active" data-filter="all">全部</button>
                    <button class="db-tab" data-filter="music">仓库音乐</button>
                    <button class="db-tab" data-filter="video">仓库视频</button>
                </div>
                <div id="dbWrap"></div>
            </div>
        </div>
    </div>
    <div class="bottom-control">
        <input type="range" class="progress-bar" id="progressInput">
        <div class="control-buttons">
            <button class="ctrl-btn">◀◀</button>
            <button class="ctrl-btn">◀</button>
            <button class="ctrl-btn play-main" id="mainPlayBtn">▶</button>
            <button class="ctrl-btn">▶</button>
            <button class="ctrl-btn">▶▶</button>
        </div>
    </div>
</div>

<!-- 弹窗播放器 -->
<div class="play-modal-mask" id="playMask">
    <div class="play-modal-box" id="playBox">
        <span class="play-close" id="closePlayer">✕</span>
        <div class="play-content-row">
            <div class="media-view" id="mediaView"></div>
            <div class="lyric-area" id="lyricBox">
                <div class="lyric-wrap" id="lyricWrap">
                    <div class="lyric-line">等待加载歌词...</div>
                </div>
            </div>
        </div>
        <div class="play-control-bar">
            <button id="prevBtn">上一曲</button>
            <button id="playPauseBtn">播放/暂停</button>
            <button id="nextBtn">下一曲</button>
            <input type="range" class="progress" id="progressBar" value="0" max="100">
            <button id="fullScreenBtn">全屏</button>
        </div>
    </div>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h4 id="loginTitle">账号登录</h4>
        <div class="input-item"><input placeholder="账号" id="loginUser"></div>
        <div class="input-item"><input type="password" placeholder="密码" id="loginPwd"></div>
        <div class="modal-buttons">
            <button id="loginClose">取消</button>
            <button id="loginConfirm">登录</button>
        </div>
        <button class="switch-btn" id="switchRegBtn">没有账号？点击注册</button>
    </div>
</div>
<!-- 上传弹窗 -->
<div class="modal" id="uploadModal">
    <div class="modal-box">
        <h4>新增后台素材</h4>
        <label><input type="radio" name="resType" value="music" checked> 音乐</label>
        <label style="margin-left:10px"><input type="radio" name="resType" value="video"> 视频</label>
        <div class="input-item"><input placeholder="歌曲/视频名称" id="resName"></div>
        <div class="input-item"><input placeholder="歌手/作者名称" id="resSinger"></div>
        <div class="input-item"><input placeholder="媒体播放网络链接" id="resMediaLink"></div>
        <div class="input-item"><input placeholder="封面图片外网链接" id="resCoverLink"></div>
        <div class="input-item"><input placeholder="歌词链接（仅音乐填写）" id="resLyricLink"></div>
        <div class="modal-buttons">
            <button id="uploadClose">取消</button>
            <button id="uploadConfirm">提交入库</button>
        </div>
    </div>
</div>
<!-- 统计弹窗 -->
<div class="modal" id="statModal">
    <div class="modal-box">
        <h4>后台数据统计</h4>
        <div id="statText"></div>
        <div class="modal-buttons">
            <button id="statClose">关闭</button>
        </div>
    </div>
</div>
<!-- 评论弹窗 -->
<div class="modal" id="commentModal">
    <div class="modal-box">
        <h4>作品评论区</h4>
        <div id="commentListBox" style="max-height:300px;overflow-y:auto;margin:10px 0;"></div>
        <div class="input-item"><input placeholder="昵称（留空默认匿名）" id="commentName"></div>
        <div class="input-item"><textarea placeholder="输入评论内容" id="commentContent" rows="3"></textarea></div>
        <div class="modal-buttons">
            <button id="commentClose">关闭</button>
            <button id="commentSubmit">发表评论</button>
        </div>
    </div>
</div>
<!-- 赞赏弹窗 -->
<div class="modal" id="donateModal">
    <div class="modal-box">
        <h4>赞赏支持作者</h4>
        <div class="donate-img-box" id="donateImgWrap"></div>
        <div id="donateAdminArea" style="display:none;border-top:1px solid #fff3;margin-top:12px;padding-top:12px;">
            <div class="input-item"><input placeholder="赞赏图片链接（多图英文逗号分隔）" id="newDonateUrl"></div>
            <div class="modal-buttons">
                <button id="saveDonateBtn">保存图片</button>
            </div>
            <p style="font-size:12px;color:#ddd;">多链接英文逗号分隔</p>
        </div>
        <div class="modal-buttons">
            <button id="donateClose">关闭</button>
        </div>
    </div>
</div>
<video id="videoPlayer" style="display:none;"></video>
<script>
// 全局配置
const API_BASE = "https://busisi.com";
const ADMIN_ACCOUNT = "admin";
const ADMIN_PWD = "bu4321";
let isAdmin = false;
let currentView = "home";
let currentPlayMedia = null;
let playStatus = false;
let currentAudio = null;
const videoDom = document.getElementById("videoPlayer");
const dbBoxWrap = document.getElementById("dbBoxWrap");
let activeCommentWorkId = "";
let donateImgList = [];
let showList = {home: [],music: [],video: []};
let resourceWarehouse = JSON.parse(localStorage.getItem("warehouseData")) || [];
let playHistoryList = JSON.parse(localStorage.getItem("historyData")) || [];
function saveWarehouse(){localStorage.setItem("warehouseData",JSON.stringify(resourceWarehouse));}
function saveHistory(){localStorage.setItem("historyData",JSON.stringify(playHistoryList));}
function saveShowList(){localStorage.setItem("showListData",JSON.stringify(showList));}
const localShow = localStorage.getItem("showListData");
if(localShow) showList = JSON.parse(localShow);
async function apiFetch(path,option={}){
    try{
        const res = await fetch(`${API_BASE}${path}`,{signal:AbortSignal.timeout(6000),...option});
        return await res.json();
    }catch(err){
        console.log("接口失败",err);
        return null;
    }
}
// 导航切换
const navBtns = document.querySelectorAll(".nav-switch");
const viewDom = {home:document.querySelector(".home-view"),music:document.querySelector(".music-view"),video:document.querySelector(".video-view")};
navBtns.forEach(btn=>{
    btn.onclick = ()=>{
        navBtns.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        Object.values(viewDom).forEach(v=>v.classList.remove("active-view"));
        viewDom[currentView].classList.add("active-view");
    }
})
// 卡片渲染
function buildCardSkeleton(item){
    const uniqueId = btoa(item.name+item.mediaLink);
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
        <img class="card-cover" src="${item.coverLink||''}" alt="封面">
        <div class="card-info">
            <div class="card-name">${item.name}</div>
            <div class="card-singer">${item.singer||"未知歌手"}</div>
            <div class="card-data-row">
                <span>加载中...</span>
                <button class="like-btn">♥</button>
            </div>
            <div class="card-bottom-btn">
                <button class="comment-card-btn" data-id="${uniqueId}">查看评论</button>
            </div>
        </div>
    `;
    card.querySelector(".like-btn").onclick = (e)=>{
        e.stopPropagation();
        item.isLike = !item.isLike;
        saveWarehouse();
        renderAllCards();
    }
    card.querySelector(".comment-card-btn").onclick = (e)=>{
        e.stopPropagation();
        openCommentPanel(uniqueId);
    }
    card.onclick = ()=>openMediaPlayer(item,uniqueId);
    return {card,uniqueId,item};
}
async function fillCardData(cardDom,uniqueId){
    const playRes = await apiFetch(`/getPlayCount?id=${uniqueId}`);
    const likeRes = await apiFetch(`/getLikeNum?id=${uniqueId}`);
    let playNum = playRes?.playNum ?? 0;
    let likeNum = likeRes?.likeNum ?? 0;
    cardDom.querySelector(".card-data-row span").innerText = `播放${playNum} 点赞${likeNum}`;
}
async function renderAllCards(){
    document.getElementById("homeCardWrap").innerHTML = "";
    document.getElementById("musicCardWrap").innerHTML = "";
    document.getElementById("videoCardWrap").innerHTML = "";
    for(let item of showList.home){
        const {card,uid} = buildCardSkeleton(item);
        document.getElementById("homeCardWrap").append(card);
        fillCardData(card,uid);
    }
    for(let item of showList.music){
        const {card,uid} = buildCardSkeleton(item);
        document.getElementById("musicCardWrap").append(card);
        fillCardData(card,uid);
    }
    for(let item of showList.video){
        const {card,uid} = buildCardSkeleton(item);
        document.getElementById("videoCardWrap").append(card);
        fillCardData(card,uid);
    }
}
function stopAllMedia(){
    if(currentAudio){currentAudio.pause();currentAudio=null;}
    videoDom.pause();video.src="";playStatus=false;
    document.getElementById("mainPlayBtn").innerText="▶";
}
document.getElementById("mainPlayBtn").onclick = ()=>{};
function renderHistory(){
    const wrap = document.getElementById("historyWrap");
    wrap.innerHTML = "";
    playHistoryList.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = "history-item";

// ==================== 播放器核心逻辑（修复全部全屏冒泡、视频交互、黄色按钮BUG） ====================
const playMask = document.getElementById("playMask");
const mediaView = document.getElementById("mediaView");
const lyricBox = document.getElementById("lyricBox");
const lyricWrap = document.getElementById("lyricWrap");
const closePlayer = document.getElementById("closePlayer");
const playPauseBtn = document.getElementById("playPauseBtn");
const progressBar = document.getElementById("progressBar");
const fullScreenBtn = document.getElementById("fullScreenBtn");
const playBox = document.getElementById("playBox");
let tempVideo;
let tempAudio;
let nowMediaInfo = null;
let lrcData = [];

// 关闭播放器
closePlayer.onclick = ()=>{
    playMask.style.display = "none";
    if(tempVideo){tempVideo.pause();tempVideo.remove();tempVideo=null;}
    if(tempAudio){tempAudio.pause();tempAudio=null;}
    lrcData = [];lyricWrap.innerHTML = `<div class="lyric-line">等待加载歌词...</div>`;
}
// 全屏切换：仅绑定全屏按钮，弹窗容器不再绑定全屏点击事件
fullScreenBtn.onclick = ()=>{
    if(document.fullscreenElement || document.webkitFullscreenElement){
        document.exitFullscreen();
    }else{
        playBox.requestFullscreen?.();
        playBox.webkitRequestFullscreen?.();
    }
}

// 阻止弹窗空白区域点击触发全屏事件冒泡
playBox.addEventListener("click", function(e) {
    // 只有点击全屏按钮才放行，其余所有区域全部阻断事件向上冒泡
    if(e.target.id !== "fullScreenBtn") {
        e.stopPropagation();
    }
});

// 视频区域点击：播放/暂停，彻底阻断全屏事件
window.addEventListener("load", () => {
    mediaView.addEventListener("click", function(e) {
        e.stopPropagation();
        if(nowMediaInfo?.type === "video" && tempVideo) {
            if(tempVideo.paused) tempVideo.play();
            else tempVideo.pause();
        }
    })
})

// LRC解析 清除时间戳、拆分单字
function parseLrc(text){
    const arr = [];
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
    let res;
    while((res = reg.exec(text))!==null){
        const min = parseInt(res[1]);
        const sec = parseInt(res[2]);
        const ms = parseInt(res[3]);
        const time = min*60 + sec + ms/1000;
        let lineText = res[4].trim();
        if(!lineText) continue;
        const chars = lineText.split("").map(c=>c===" "?"&nbsp;":c);
        arr.push({time,chars,dom:null});
    }
    return arr.sort((a,b)=>a.time);
}
// 歌词同步滚动+逐字粉色高亮
function syncLyric(currentTime){
    if(lrcData.length===0) return;
    let targetIdx = 0;
    for(let i=0;i<lrcData.length;i++){
        if(lrcData[i].time <= currentTime) targetIdx = i;
        else break;
    }
    document.querySelectorAll(".lyric-char").forEach(c=>c.classList.remove("active"));
    const targetLine = lrcData[targetIdx];
    if(targetLine?.dom){
        targetLine.dom.querySelectorAll(".lyric-char").forEach(c=>c.classList.add("active"));
        const boxH = lyricBox.clientHeight;
        const lineTop = targetLine.dom.offsetTop;
        const offset = lineTop - boxH / 2;
        lyricWrap.style.transform = `translateY(${-offset}px)`;
    }
}
// 打开播放弹窗（修复视频封面遮挡、视频加载黑屏）
async function openMediaPlayer(item,workId){
    await apiFetch("/addPlayCount",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:workId})});
    if(!playHistoryList.find(h=>h.mediaLink===item.mediaLink)){
        playHistoryList.unshift(item);
        if(playHistoryList.length>60) playHistoryList.pop();
        saveHistory();renderHistory();
    }
    nowMediaInfo = item;
    mediaView.innerHTML = ""; // 每次清空，封面不会残留遮挡视频
    lyricWrap.innerHTML = `<div class="lyric-line">加载歌词...</div>`;
    progressBar.value = 0;
    lrcData = [];
    if(tempVideo){tempVideo.pause();tempVideo.remove();tempVideo=null;}
    if(tempAudio){tempAudio.pause();tempAudio=null;}

    if(item.type === "video"){
        tempVideo = document.createElement("video");
        tempVideo.src = item.mediaLink;
        tempVideo.autoplay = true;
        tempVideo.controls = true;
        tempVideo.playsInline = true;
        tempVideo.muted = false;
        tempVideo.crossOrigin = "anonymous";
        tempVideo.preload = "auto";
        tempVideo.style.width = "100%";
        tempVideo.style.height = "100%";
        tempVideo.style.display = "block";
        tempVideo.style.background = "#000";
        mediaView.appendChild(tempVideo);
        tempVideo.load(); // 强制加载资源，解决有声无画面
        tempVideo.ontimeupdate = ()=>{
            progressBar.value = tempVideo.currentTime / tempVideo.duration * 100;
            syncLyric(tempVideo.currentTime);
        }
        playPauseBtn.onclick = ()=> tempVideo.paused ? tempVideo.play() : tempVideo.pause();
    }else{
        mediaView.innerHTML = `<div class="audio-cover-box"><img src="${item.coverLink}" alt="封面"></div>`;
        tempAudio = new Audio(item.mediaLink);
        tempAudio.autoplay = true;
        tempAudio.ontimeupdate = ()=>{
            progressBar.value = tempAudio.currentTime / tempAudio.duration * 100;
            syncLyric(tempAudio.currentTime);
        }
        playPauseBtn.onclick = ()=> tempAudio.paused ? tempAudio.play() : tempAudio.pause();
    }
    // 加载歌词
    if(item.lyricLink){
        try{
            const lrcRes = await fetch(item.lyricLink);
            const lrcText = await lrcRes.text();
            lrcData = parseLrc(lrcText);
            lyricWrap.innerHTML = "";
            lrcData.forEach(lineObj=>{
                const div = document.createElement("div");
                div.className = "lyric-line";
                div.innerHTML = lineObj.chars.map(c=>`<span class="lyric-char">${c}</span>`).join("");
                lineObj.dom = div;
                lyricWrap.appendChild(div);
            })
        }catch(e){
            lyricWrap.innerHTML = `<div class="lyric-line">歌词加载失败</div>`;
        }
    }else{
        lyricWrap.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
    }
    playMask.style.display = "flex";
}
// 拖动进度同步歌词
progressBar.oninput = function(){
    const val = progressBar.value;
    const rate = val / 100;
    if(!nowMediaInfo) return;
    if(nowMediaInfo.type === "video" && tempVideo){
        tempVideo.currentTime = tempVideo.duration * rate;
        syncLyric(tempVideo.currentTime);
    }else if(tempAudio){
        tempAudio.currentTime = tempAudio.duration * rate;
        syncLyric(tempAudio.currentTime);
    }
}
// 修复快捷键变量错误，不会按键失灵
document.addEventListener("keydown", function(e) {
    if(playMask.style.display !== "flex") return;
    const key = e.key;
    e.preventDefault();
    // 空格 播放暂停
    if(key === " ") playPauseBtn.click();
    // ESC关闭
    if(key === "Escape") closePlayer.click();
    // F全屏
    if(key.toLowerCase() === "f") fullScreenBtn.click();
    let targetMedia = nowMediaInfo.type === "video" ? tempVideo : tempAudio;
    if(!targetMedia) return;
    // 左右进退、音量（修复变量target→targetMedia）
    if(key === "ArrowLeft") targetMedia.currentTime -= 5;
    if(key === "ArrowRight") targetMedia.currentTime += 5;
    if(key === "ArrowUp") targetMedia.volume = Math.min(targetMedia.volume + 0.1, 1);
    if(key === "ArrowDown") targetMedia.volume = Math.max(targetMedia.volume - 0.1, 0);
    syncLyric(targetMedia.currentTime);
})

// 页面初始化
renderAllCards();
renderHistory();
</script>
