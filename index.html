<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 360px;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#204080,#3a6fc9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
}
.nav-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.nav-btn{
    padding: 8px 18px;
    background: #fff;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.nav-btn.active{
    background:#4299e1;
    color:#fff;
}
.nav-btn:hover:not(.active){
    background:#e6f0fc;
}
.search-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 999px 0 0 999px;
    outline: none;
    font-size: 15px;
}
.search-bar button{
    padding: 0 22px;
    border: none;
    background: #4299e1;
    color: #fff;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
.card-wrap{
    width: 96%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}
.music-card{
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #b8d8f0;
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 8px;
    overflow: hidden;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #204080;
    padding: 40px 0;
}
.player-box{
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 420px;
    height: 340px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow: hidden;
    resize: both;
    z-index: 999;
}
.fullscreen-btn{
    position: absolute;
    top: 8px;
    right: 8px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
}
.lyric-toggle-btn{
    position:absolute;
    top:8px;
    left:8px;
    z-index:10;
    padding:4px 10px;
    border:none;
    border-radius:6px;
    background:rgba(0,0,0,0.4);
    color:#fff;
    cursor:pointer;
}
.play-cover{
    width: 100%;
    height: 58%;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    background: #eee;
    display: none;
    align-items: center;
    justify-content:center;
}
.play-cover img{
    width: 120px;
    height:120px;
    border-radius:12px;
    object-fit: cover;
}
.video-view{
    width: 100%;
    height: 58%;
    background: #000;
    display:block;
}
.control-bar{
    padding: 10px;
    height: 42%;
}
.play-list{
    height: 76px;
    overflow-x: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}
.list-item{
    position: relative;
    padding: 6px 10px;
    background: #f0f7fc;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 13px;
    cursor: pointer;
}
.del-btn{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: #ff6b6b;
    color: #fff;
    font-size: 11px;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    cursor: pointer;
}
.lyric-area{
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    line-height: 1.5;
}
.float-lyric-wrap{
    position: absolute;
    top: 60px;
    left: 16px;
    min-width:260px;
    min-height:90px;
    width:78%;
    z-index:15;
    cursor:move;
    user-select:none;
    resize:both;
    overflow:hidden;
    display:none;
}
.float-lyric-wrap::-webkit-scrollbar{
    display:none;
}
.lyric-line{
    padding:8px 14px;
    margin:4px 0;
    border-radius:8px;
    background:rgba(0,0,0,0.38);
    backdrop-filter:blur(6px);
    font-size:clamp(16px,2vw,26px);
    letter-spacing:2px;
}
.prev-line{
    color:#ffffff;
    opacity:0.55;
    text-align:left;
}
.curr-line{
    color:#63d8ff;
    font-weight:bold;
    text-align:right;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页 Home</button>
    <button class="nav-btn" data-type="music">音乐 Music</button>
    <button class="nav-btn" data-type="video">视频 Video</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索 Search</button>
</div>

<div class="card-wrap" id="cardContainer">
    <div class="load-tip">正在加载资源，请稍等...</div>
</div>

<div class="player-box" id="playerWrap">
    <button class="lyric-toggle-btn" id="lyricToggleBtn">悬浮歌词</button>
    <div class="fullscreen-btn" id="fullBtn">⛶</div>
    <div class="float-lyric-wrap" id="floatLyricWrap">
        <div class="lyric-line prev-line" id="prevLyric"></div>
        <div class="lyric-line curr-line" id="currLyric"></div>
    </div>

    <div class="play-cover" id="playCoverBox">
        <img id="playCoverImg">
    </div>
    <video class="video-view" id="mainVideo" controls></video>
    <div class="control-bar">
        <div class="play-list" id="playListBox"></div>
        <div class="lyric-area" id="lyricBox">暂无播放内容</div>
    </div>
</div>
<audio id="mainAudio">

<script>
const API_BASE = "https://api.busisi.com";
let currentPlayList = [];
let currentTabType = "all";
let allResourceList = [];
let nowPlayingItem = null;
let parsedLyricList = [];
let lyricTimer = null;

const dom = {
    cardContainer: document.getElementById("cardContainer"),
    searchInput: document.getElementById("searchInput"),
    searchBtn: document.getElementById("searchBtn"),
    navBtns: document.querySelectorAll(".nav-btn"),
    fullBtn: document.getElementById("fullBtn"),
    mainVideo: document.getElementById("mainVideo"),
    mainAudio: document.getElementById("mainAudio"),
    playCoverBox: document.getElementById("playCoverBox"),
    playCoverImg: document.getElementById("playCoverImg"),
    playListBox: document.getElementById("playListBox"),
    lyricBox: document.getElementById("lyricBox"),
    floatLyricWrap: document.getElementById("floatLyricWrap"),
    prevLyric: document.getElementById("prevLyric"),
    currLyric: document.getElementById("currLyric"),
    lyricToggleBtn: document.getElementById("lyricToggleBtn"),
    playerWrap: document.getElementById("playerWrap")
};

// 悬浮歌词拖拽移动逻辑
(function initLyricDrag(){
    const wrap = dom.floatLyricWrap;
    let dragging = false;
    let ox, oy;
    const edgeThreshold = 14;

    wrap.addEventListener("mousedown",e=>{
        const rect = wrap.getBoundingClientRect();
        const pRect = dom.playerWrap.getBoundingClientRect();
        const isResizeEdge = (
            e.clientX - rect.left < edgeThreshold ||
            rect.right - e.clientX < edgeThreshold ||
            e.clientY - rect.top < edgeThreshold ||
            rect.bottom - e.clientY < edgeThreshold
        );
        if(isResizeEdge) return;

        dragging = true;
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        wrap.style.cursor = "grabbing";
    });
    document.addEventListener("mousemove",e=>{
        if(!dragging) return;
        const pRect = dom.playerWrap.getBoundingClientRect();
        let x = e.clientX - pRect.left - ox;
        let y = e.clientY - pRect.top - oy;
        x = Math.max(0, Math.min(x, dom.playerWrap.offsetWidth - wrap.offsetWidth));
        y = Math.max(0, Math.min(y, dom.playerWrap.offsetHeight - wrap.offsetHeight));
        wrap.style.left = `${x}px`;
        wrap.style.top = `${y}px`;
    });
    document.addEventListener("mouseup",()=>{
        dragging = false;
        wrap.style.cursor = "move";
    });
})();

// 悬浮歌词显隐开关
dom.lyricToggleBtn.addEventListener("click",()=>{
    dom.floatLyricWrap.style.display = dom.floatLyricWrap.style.display === "block" ? "none" : "block";
});

// 通用歌词入口：自动区分KRC / LRC
function parseLyric(rawText) {
    if(rawText.includes("krcc") || rawText.includes("KRC")){
        return parseKRC(rawText);
    }else{
        return parseLRC(rawText);
    }
}

// LRC标准解析器
function parseLRC(text){
    const result = [];
    const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
    const lines = text.split("\n");
    for(let line of lines){
        line = line.trim();
        const match = line.match(reg);
        if(!match) continue;
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = parseInt(match[3]||0);
        const time = min * 60 + sec + ms / 1000;
        const txt = match[4].trim();
        if(txt) result.push({time,text:txt});
    }
    result.sort((a,b)=>a.time - b.time);
    return result;
}

// KRC加密歌词解密解析器
function parseKRC(krcText){
    const krccMatch = krcText.match(/krcc:"([^"]+)"/);
    if(!krccMatch) return [];
    let base64Str = krccMatch[1];
    const key = [64, 71, 97, 119, 94, 50, 116, 71];
    let decodeStr = "";
    for(let i=0;i<base64Str.length;i++){
        decodeStr += String.fromCharCode(base64Str.charCodeAt(i) ^ key[i % key.length]);
    }
    const lineReg = /(\d+),\d+,\d+\|([^\|]+)\|/g;
    const list = [];
    let match;
    while((match = lineReg.exec(decodeStr)) !== null){
        const time = parseInt(match[1]) / 1000;
        const text = match[2].trim();
        if(text) list.push({time,text});
    }
    list.sort((a,b)=>a.time - b.time);
    return list;
}

// 根据播放进度刷新悬浮歌词
function updateFloatLyric(currentTime){
    if(parsedLyricList.length === 0){
        dom.prevLyric.innerText = "";
        dom.currLyric.innerText = "暂无歌词";
        return;
    }
    let activeIndex = 0;
    for(let i=0; i<parsedLyricList.length; i++){
        if(currentTime >= parsedLyricList[i].time){
            activeIndex = i;
        }else break;
    }
    const prev = parsedLyricList[activeIndex-1]?.text || "";
    const curr = parsedLyricList[activeIndex].text;
    dom.prevLyric.innerText = prev;
    dom.currLyric.innerText = curr;
}

window.addEventListener("load", async () => {
    if(location.protocol === "file:"){
        dom.cardContainer.innerHTML = `<div class="load-tip" style="color:red">禁止本地双击打开HTML，必须托管网页访问</div>`;
        return;
    }

    dom.navBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            dom.navBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentTabType = btn.dataset.type;
            renderFilterList();
        })
    });

    dom.searchBtn.addEventListener("click", searchResource);
    dom.searchInput.addEventListener("keydown", e => {
        if(e.key === "Enter") searchResource();
    });
    dom.fullBtn.addEventListener("click", toggleFullScreen);

    // 绑定播放进度监听，同步歌词
    function bindTimeUpdate(){
        function onTime(){
            const media = nowPlayingItem?.type === "video" ? dom.mainVideo : dom.mainAudio;
            if(media && !media.paused){
                updateFloatLyric(media.currentTime);
            }
        }
        dom.mainVideo.ontimeupdate = onTime;
        dom.mainAudio.ontimeupdate = onTime;
    }
    bindTimeUpdate();

    try {
        const res = await fetch(`${API_BASE}/getResourceList`);
        if(!res.ok) throw new Error(`接口请求失败：${res.status}`);
        allResourceList = await res.json();
        renderFilterList();
    } catch(err) {
        dom.cardContainer.innerHTML = `
            <div class="load-tip" style="color:red">
                连接后端接口失败<br>
                1.检查Worker是否部署完成<br>
                2.等待域名解析生效<br>
                错误信息：${err.message}
            </div>
        `;
        console.error("资源加载报错：", err);
    }
});

function renderFilterList() {
    let list = allResourceList;
    if(currentTabType !== "all") {
        list = list.filter(item => item.type === currentTabType);
    }
    renderCard(list);
}

function renderCard(list) {
    dom.cardContainer.innerHTML = "";
    if(list.length === 0) {
        dom.cardContainer.innerHTML = '<div class="load-tip">暂无匹配资源</div>';
        return;
    }
    list.forEach(item => {
        const card = document.createElement("div");
        card.className = "music-card";
        let coverHtml = item.coverImg
            ? `<div class="cover-box"><img src="${item.coverImg}" alt="封面"></div>`
            : `<div class="cover-box">无封面</div>`;
        card.innerHTML = `${coverHtml}<div class="card-text">${item.singer||"未知歌手"} - ${item.name}</div>`;

        card.addEventListener("click", () => {
            addPlaylist(item);
            playMedia(item);
        });
        dom.cardContainer.appendChild(card);
    })
}

function addPlaylist(item) {
    const isExist = currentPlayList.some(i => i.id === item.id);
    if(isExist) return;
    currentPlayList.push(item);
    renderPlaylist();
}

function renderPlaylist() {
    dom.playListBox.innerHTML = "";
    currentPlayList.forEach(item => {
        const li = document.createElement("div");
        li.className = "list-item";
        li.innerHTML = `${item.singer||"未知歌手"} - ${item.name}<span class="del-btn">×</span>`;

        li.addEventListener("click", e => {
            if(e.target.classList.contains("del-btn")) return;
            playMedia(item);
        });

        li.querySelector(".del-btn").addEventListener("click", e => {
            e.stopPropagation();
            currentPlayList = currentPlayList.filter(i => i.id !== item.id);
            renderPlaylist();
        });
        dom.playListBox.appendChild(li);
    })
}

async function playMedia(item) {
    nowPlayingItem = item;
    dom.mainVideo.pause();
    dom.mainVideo.src = "";
    dom.mainAudio.pause();
    dom.mainAudio.src = "";
    dom.lyricBox.innerText = "加载歌词中...";
    parsedLyricList = [];
    dom.prevLyric.innerText = "";
    dom.currLyric.innerText = "";

    if(item.type === "video" && item.videoLink) {
        dom.mainVideo.style.display = "block";
        dom.playCoverBox.style.display = "none";
        dom.mainVideo.src = encodeURI(item.videoLink);
        dom.mainVideo.play().catch(e => console.log("视频播放限制：", e));
    } else if(item.audioLink) {
        dom.mainVideo.style.display = "none";
        dom.playCoverBox.style.display = "flex";
        dom.mainAudio.src = encodeURI(item.audioLink);
        dom.mainAudio.play().catch(e => console.log("音频播放限制：", e));
    }

    if(item.coverImg) {
        dom.playCoverImg.src = item.coverImg;
    }

    try {
        let lyricKey = item.lyricName || item.id;
        const lyricRes = await fetch(`${API_BASE}/getLyric?name=${encodeURIComponent(lyricKey)}`);
        if(lyricRes.ok) {
            const lyricText = await lyricRes.text();
            dom.lyricBox.innerText = lyricText;
            // 调用通用解析函数，自动识别KRC/LRC
            parsedLyricList = parseLyric(lyricText);
        } else {
            dom.lyricBox.innerText = "暂无匹配歌词";
            parsedLyricList = [];
        }
    } catch {
        dom.lyricBox.innerText = "歌词加载失败";
        parsedLyricList = [];
    }
}

function toggleFullScreen() {
    const target = dom.mainVideo;
    function enterFull(el){
        if(el.requestFullscreen) el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if(el.mozRequestFullScreen) el.mozRequestFullscreen();
    }
    function exitFull(){
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }

    if(document.fullscreenElement || document.webkitFullscreenElement) {
        exitFull();
        dom.fullBtn.innerText = "⛶";
    } else {
        enterFull(target);
        dom.fullBtn.innerText = "⊡";
    }
}
document.addEventListener('fullscreenchange', updateFullIcon);
document.addEventListener('webkitfullscreenchange', updateFullIcon);
function updateFullIcon(){
    if(document.fullscreenElement || document.webkitFullscreenElement){
        dom.fullBtn.innerText = "⊡";
    }else{
        dom.fullBtn.innerText = "⛶";
    }
}

function searchResource() {
    const keyword = dom.searchInput.value.trim().toLowerCase();
    if(!keyword) {
        renderFilterList();
        return;
    }
    let sourceList = allResourceList;
    if(currentTabType !== "all") {
        sourceList = sourceList.filter(i => i.type === currentTabType);
    }
    const result = sourceList.filter(v => {
        const songName = (v.name || "").toLowerCase();
        const singerName = (v.singer || "").toLowerCase();
        return songName.includes(keyword) || singerName.includes(keyword);
    });
    renderCard(result);
}
</script>
</body>
</html>
