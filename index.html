<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posimusic｜音视频图片云端R2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "思源宋体", "SimSun", serif;
        }
        body {
            background-color: #f3ebd8;
            padding:20px;
            color:#3a2e20;
        }
        .app-container {
            display: grid;
            grid-template-columns: 60% 40%;
            gap:24px;
            max-width:1920px;
            margin:0 auto;
            border: 2px solid #b89b70;
            padding:24px;
            background-color:#f7efdd;
            background-image: radial-gradient(#d9c9b0 1px, transparent 1px);
            background-size:20px 20px;
            position: relative;
        }
        .scroll-player-wrap {
            border: 12px solid #c8a87c;
            border-image: linear-gradient(#94744e,#e2cdad,#94744e) 1;
            border-radius:8px;
            position:relative;
            background:#f9f1de;
            min-height:480px;
            display:flex;
            flex-direction:column;
        }
        .scroll-left,.scroll-right{
            position:absolute;
            top:-10px;
            bottom:-10px;
            width:32px;
            background:linear-gradient(90deg,#6b4c2e,#b89468,#6b4c2e);
            border-radius:12px;
        }
        .scroll-left{left:-12px;}
        .scroll-right{right:-12px;}

        .player-view{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            position:relative;
        }
        .media-box{
            position:relative;
            width:100%;
            max-height:240px;
        }
        video,audio{
            width:100%;
            max-height:220px;
        }

        .play-big-btn{
            display:none !important;
            width:120px;
            height:120px;
            border:2px solid #b89468;
            background:rgba(247,239,221,0.65);
            border-radius:8px;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        .play-big-btn svg{
            width:48px;height:48px;fill:#6b4c2e;
        }
        .music-icon-card{
            display:none !important;
            position:absolute;
            right:40px;
            bottom:30px;
            width:100px;
            height:120px;
            border:1px solid #b89468;
            background:rgba(247,239,221,0.7);
            align-items:center;
            justify-content:center;
        }
        .music-icon-card svg{
            width:60px;height:60px;fill:#5a432c;
        }

        .lyric-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:4px 10px;
            background:#e9ddc8;
            border-bottom:1px solid #b89b70;
        }
        .lyric-title{
            display:none;
            font-size:14px;
        }
        .lyric-toggle-btn{
            display:none;
        }

        .lyric-wrap{
            width:100%;
            margin-top:10px;
            border:1px solid #b89b70;
            border-radius:8px;
            position:relative;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            transition: max-height 0.35s ease-out;
        }
        .lyric-scroll-container{
            overflow:hidden;
            transition: max-height 0.35s ease-out;
            max-height:200px;
        }
        .lyric-scroll{
            transition: transform 0.35s ease-out;
        }
        .lyric-line{
            text-align:center;
            padding:10px 4px;
            font-size:18px;
            color:#66543c;
        }
        .lyric-line.active-line{
            font-size:21px;
            font-weight:bold;
        }
        .char-normal{
            color:#66543c;
        }
        .char-light{
            color:#e04420;
            font-weight:bold;
        }

        .player-bottom-bar{
            padding:16px 12px;
        }
        .progress-row{
            display:flex;
            gap:12px;
            align-items:center;
            margin-bottom:14px;
        }
        .time-text{
            font-size:13px;
            color:#66543c;
            min-width:40px;
        }
        .progress-bar{
            flex:1;
            height:6px;
            background:#c9b89e;
            border-radius:3px;
            position:relative;
            cursor:pointer;
        }
        .progress-dot{
            position:absolute;
            width:14px;height:14px;
            background:#4b3824;
            border-radius:50%;
            top:-4px;
            left:0%;
        }
        .control-buttons{
            display:flex;
            gap:32px;
            align-items:center;
            justify-content:center;
        }

        .ctrl-btn {
            width: 46px;
            height: 46px;
            border: none;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            border-radius: 12px;
            cursor: pointer;
            font-size: 22px;
            color: #3a2e20;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition: 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .ctrl-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05));
            border-radius: 12px 12px 0 0;
            pointer-events: none;
        }
        .ctrl-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .ctrl-btn:active {
            transform: translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }

        .play-pause {
            width: 68px;
            height: 68px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(145deg, #f7efdd, #d9b38c);
            color: #3a2e20;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.9),
                inset 0 -2px 0 rgba(180, 140, 100, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 8px rgba(90, 60, 40, 0.2);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            transition: 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .play-pause::before {
            content: "";
            position: absolute;
            top: 8%;
            left: 12%;
            width: 35%;
            height: 25%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05));
            border-radius: 50%;
            pointer-events: none;
        }
        .play-pause:hover {
            transform: translateY(-3px);
            background: linear-gradient(145deg, #fff7ea, #e0c9a6);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 1),
                inset 0 -2px 0 rgba(180, 140, 100, 0.6),
                0 8px 20px rgba(90, 60, 40, 0.45),
                0 4px 10px rgba(90, 60, 40, 0.25);
        }
        .play-pause:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 4px 8px rgba(90, 60, 40, 0.35),
                inset 0 -2px 0 rgba(255, 255, 255, 0.8),
                0 3px 10px rgba(90, 60, 40, 0.25);
        }

        .bottom-right-buttons{
            margin-left: auto;
            display:flex;
            gap:10px;
            align-items:center;
        }
        .fullscreen-bar-btn,
        .lyric-bar-btn {
            padding: 7px 14px;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            border: 1px solid rgba(184, 155, 112, 0.65);
            border-radius: 10px;
            color: #3a2e20;
            font-size: 14px;
            font-family: "思源宋体", "SimSun", serif;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition:0.18s ease;
            position:relative;
            overflow:hidden;
        }
        .fullscreen-bar-btn::before,
        .lyric-bar-btn::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:45%;
            background:linear-gradient(180deg,rgba(255,255,255,0.32),rgba(255,255,255,0.03));
            pointer-events:none;
        }
        .fullscreen-bar-btn:hover,
        .lyric-bar-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .fullscreen-bar-btn:active,
        .lyric-bar-btn:active{
            transform:translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }

        .right-sidebar{
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .top-btn-group{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }
        .btn-base{
            padding:7px 12px;
            border-radius:12px;
            border:none;
            font-size:14px;
            cursor:pointer;
            font-family:"思源宋体", "SimSun", serif;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            color:#3a2e20;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition:0.18s ease;
            position:relative;
            overflow:hidden;
        }
        .btn-base::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05));
            border-radius:12px 0 0 12px;
            pointer-events:none;
        }
        .btn-base:hover{
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .btn-base:active{
            transform: translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }
        .btn-upload{
            background: linear-gradient(145deg, rgba(255,210,170,0.95), rgba(204,120,70,0.95));
            color:#fff;
            text-shadow:0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-upload::before{
            background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
        }
        .btn-upload:hover{
            background: linear-gradient(145deg, rgba(255,222,190,0.98), rgba(218,132,82,0.98));
        }

        .search-input{
            width:100%;
            padding:12px 16px;
            border-radius:14px;
            border:1px solid #b89b70;
            background:#f9f1de;
            font-size:16px;
        }
        .tab-group-cloud{
            display:flex;
            gap:8px;
        }
        .tab-cloud{
            flex:1;
            padding:10px;
            border-radius:10px;
            border:1px solid #b89b70;
            text-align:center;
            font-size:15px;
            cursor:pointer;
            background:#e9ddc8;
        }
        .tab-cloud.active{
            background:#c8a87c;
            color:#fff;
        }

        .cloud-resource-box{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:14px;
            max-height:220px;
            overflow-y:auto;
        }
        .cloud-item{
            padding:8px 6px;
            border-bottom:1px solid #ddcdb4;
            cursor:pointer;
        }
        .cloud-item:hover{
            background:#e9ddc8;
        }
        .history-box{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:16px;
            flex:1;
            max-height:240px;
            overflow-y:auto;
        }
        .history-title{
            display:flex;
            justify-content:space-between;
            font-size:22px;
            margin-bottom:14px;
        }
        .history-item{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 0;
            border-bottom:1px solid #ddcdb4;
            cursor:pointer;
        }
        .item-left{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .check-box{
            width:20px;height:20px;
            border:1px solid #8c7250;
            border-radius:4px;
        }
        .back-arrow{
            position:absolute;
            top:16px;
            left:16px;
            font-size:32px;
            cursor:pointer;
        }
        #lrcFileInput{display:none;}

        /*图片预览弹窗*/
        .img-preview-modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .img-preview-modal img{
            max-width:90vw;
            max-height:90vh;
        }
        /*评论区*/
        .comment-wrap{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:14px;
            max-height:260px;
            overflow-y:auto;
        }
        .comment-input-row{
            display:flex;
            gap:8px;
            margin-bottom:10px;
        }
        .comment-input{
            flex:1;
            padding:8px;
            border-radius:8px;
            border:1px solid #b89b70;
            background:#f9f1de;
        }
        .comment-item{
            padding:8px 4px;
            border-bottom:1px solid #ddcdb4;
        }
        .comment-name{
            font-weight:bold;
        }
        /*登录弹窗样式*/
        .login-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-modal {
            width: 420px;
            background: #f7efdd;
            border: 2px solid #b89b70;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(90, 60, 40, 0.35);
        }
        .login-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #e9ddc8;
            border-bottom: 1px solid #b89b70;
        }
        .login-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #3a2e20;
        }
        .login-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #66543c;
            cursor: pointer;
            line-height: 1;
        }
        .login-modal-tabs {
            display: flex;
            border-bottom: 1px solid #b89b70;
        }
        .login-tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f9f1de;
            color: #66543c;
            font-size: 16px;
            cursor: pointer;
        }
        .login-tab-btn.active {
            background: #c8a87c;
            color: #fff;
        }
        .login-modal-body {
            padding: 20px;
        }
        .login-form,
        .register-form {
            display: none;
        }
        .login-form.active,
        .register-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #3a2e20;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b89b70;
            border-radius: 8px;
            background: #f9f1de;
            color: #3a2e20;
            font-size: 16px;
        }
        .login-submit-btn,
        .register-submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, rgba(255, 210, 170, 0.95), rgba(204, 120, 70, 0.95));
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(90, 60, 40, 0.25);
        }
        .login-modal-footer {
            padding: 12px 20px;
            font-size: 13px;
            color: #777;
            text-align: center;
            background: #e9ddc8;
            border-top: 1px solid #b89b70;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="back-arrow">←</div>
    <div class="scroll-player-wrap">
        <div class="scroll-left"></div>
        <div class="scroll-right"></div>
        <div class="player-view" id="playerView">
            <div class="media-box" id="mediaBox">
                <div class="play-big-btn" id="bigPlayBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="music-icon-card">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
        </div>

        <div class="lyric-wrap" id="lyricWrap">
            <div class="lyric-header">
                <span class="lyric-title">歌词</span>
            </div>
            <div class="lyric-scroll-container" id="lyricScrollContainer">
                <div class="lyric-scroll" id="lyricScroll">
                    <div class="lyric-line">支持 lrc / krc / txt 歌词；视频音频共用歌词模块</div>
                </div>
            </div>
        </div>

        <div class="player-bottom-bar">
            <div class="progress-row">
                <span class="time-text" id="curTime">00:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-dot" id="progressDot"></div>
                </div>
                <span class="time-text" id="totalTime">00:00</span>
            </div>
            <div class="control-buttons">
                <button class="ctrl-btn" id="prevBtn">◀◀</button>
                <button class="ctrl-btn play-pause" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn">▶▶</button>

                <div class="bottom-right-buttons">
                    <button class="fullscreen-bar-btn" id="fullBtn">全屏</button>
                    <button class="lyric-bar-btn" id="lyricBarBtn">📄 歌词</button>
                </div>
            </div>
        </div>
    </div>

    <div class="right-sidebar">
        <div class="top-btn-group">
            <button class="btn-base btn-login" id="loginBtn">🔐 登录注册</button>
            <button class="btn-base" id="collectBtn">⭐收藏</button>
            <button class="btn-base btn-upload" id="uploadBtn">👤 上传公开</button>
            <button class="btn-base btn-lrc" id="lrcBtn">📄 加载歌词</button>
            <input type="file" id="lrcFileInput" accept=".lrc,.krc,.txt">
        </div>
        <input class="search-input" placeholder="🔍 搜索音乐、视频、图片" id="searchInput">

        <div class="tab-group-cloud">
            <div class="tab-cloud active" data-prefix="music/">音乐</div>
            <div class="tab-cloud" data-prefix="video/">视频</div>
            <div class="tab-cloud" data-prefix="images/">图片</div>
        </div>

        <div class="cloud-resource-box" id="cloudBox">
            <div style="color:#777;text-align:center;">加载云端资源...</div>
        </div>
        <!--评论区面板-->
        <div class="comment-wrap">
            <div class="comment-input-row">
                <input class="comment-input" id="commentInput" placeholder="写下你的评论">
                <button class="btn-base" id="sendCommentBtn">发送</button>
            </div>
            <div id="commentListBox">
                <div style="color:#777;text-align:center;">暂无评论</div>
            </div>
        </div>

        <div class="history-box">
            <div class="history-title">
                <span>历史播放目录</span>
                <span id="foldHistory">—</span>
            </div>
            <div id="historyWrap">
                <div style="color:#777;text-align:center;">选择云端文件后记录出现</div>
            </div>
        </div>
    </div>
</div>

<!--图片预览弹窗-->
<div class="img-preview-modal" id="imgModal">
    <img id="previewImg"/>
</div>

<!--登录注册弹窗HTML-->
<div class="login-modal-overlay" id="loginModalOverlay">
    <div class="login-modal">
        <div class="login-modal-header">
            <span class="login-modal-title">账号登录</span>
            <button class="login-modal-close" id="loginModalClose">×</button>
        </div>
        <div class="login-modal-tabs">
            <button class="login-tab-btn active" data-tab="login">登录</button>
            <button class="login-tab-btn" data-tab="register">注册</button>
        </div>
        <div class="login-modal-body">
            <form class="login-form active" id="loginForm">
                <div class="form-group">

<script>
const API_BASE = "https://api.busisi.com";

let mediaEl = null;
let playList = [];
let currentIndex = -1;
let lyricData = [];
let lyricPanelOpen = true;
let currentCloudPrefix = "music/";
let currentPlayingKey = "";
let loginUser = null;
let token = localStorage.getItem("token");
let playHistory = JSON.parse(localStorage.getItem("playHistory")||"[]");
let favList = JSON.parse(localStorage.getItem("favList")||"[]");

const playerView = document.getElementById("playerView");
const mediaBox = document.getElementById("mediaBox");
const playPauseBtn = document.getElementById("playPauseBtn");
const bigPlayBtn = document.getElementById("bigPlayBtn");
const fullBtn = document.getElementById("fullBtn");
const lyricBarBtn = document.getElementById("lyricBarBtn");
const lyricScrollContainer = document.getElementById("lyricScrollContainer");
const lyricWrap = document.getElementById("lyricWrap");
const curTimeDom = document.getElementById("curTime");
const totalTimeDom = document.getElementById("totalTime");
const progressBar = document.getElementById("progressBar");
const progressDot = document.getElementById("progressDot");
const historyWrap = document.getElementById("historyWrap");
const lrcBtn = document.getElementById("lrcBtn");
const lrcFileInput = document.getElementById("lrcFileInput");
const lyricScroll = document.getElementById("lyricScroll");
const cloudBox = document.getElementById("cloudBox");
const tabCloudList = document.querySelectorAll(".tab-cloud");
const imgModal = document.getElementById("imgModal");
const previewImg = document.getElementById("previewImg");
const commentInput = document.getElementById("commentInput");
const sendCommentBtn = document.getElementById("sendCommentBtn");
const commentListBox = document.getElementById("commentListBox");
const collectBtn = document.getElementById("collectBtn");
const uploadBtn = document.getElementById("uploadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

//登录弹窗元素
const loginBtn = document.getElementById("loginBtn");
const loginModalOverlay = document.getElementById("loginModalOverlay");
const loginModalClose = document.getElementById("loginModalClose");
const loginTabBtns = document.querySelectorAll(".login-tab-btn");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const loginModalTitle = document.querySelector(".login-modal-title");

//读取本地登录缓存
const saved = localStorage.getItem("loginUser");
if(saved){
    loginUser = JSON.parse(saved);
    loginBtn.innerText = `已登录：${loginUser.username}`;
    loginBtn.disabled = true;
    loginBtn.style.opacity = "0.65";
}
renderHistory();

//弹窗控制函数
function openLoginModal() {
    loginModalOverlay.style.display = "flex";
    resetLoginModal();
}
function closeLoginModal() {
    loginModalOverlay.style.display = "none";
}
function resetLoginModal() {
    loginTabBtns.forEach(btn => btn.classList.remove("active"));
    loginTabBtns[0].classList.add("active");
    loginForm.classList.add("active");
    registerForm.classList.remove("active");
    loginModalTitle.innerText = "账号登录";
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("registerUsername").value = "";
    document.getElementById("registerPassword").value = "";
    document.getElementById("registerPassword2").value = "";
}

loginBtn.onclick = openLoginModal;
loginModalClose.onclick = closeLoginModal;
loginModalOverlay.onclick = e => {
    if (e.target === loginModalOverlay) closeLoginModal();
};

loginTabBtns.forEach(btn => {
    btn.onclick = () => {
        loginTabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        if (tab === "login") {
            loginForm.classList.add("active");
            registerForm.classList.remove("active");
            loginModalTitle.innerText = "账号登录";
        } else {
            loginForm.classList.remove("active");
            registerForm.classList.add("active");
            loginModalTitle.innerText = "账号注册";
        }
    };
});

//播放暂停点击事件
playPauseBtn.onclick = ()=>{
    if(!mediaEl) return;
    if(mediaEl.paused){
        mediaEl.play();
        playPauseBtn.innerText = "⏸";
    }else{
        mediaEl.pause();
        playPauseBtn.innerText = "▶";
    }
}

//登录提交 【修复成功判断 code===0】
loginForm.onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    if (!username || !password) {
        alert("请输入账号和密码");
        return;
    }
    const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    alert(json.msg);
    if (json.code === 0) {
        loginUser = { username };
        localStorage.setItem("loginUser", JSON.stringify(loginUser));
        closeLoginModal();
        loginBtn.innerText = `已登录：${loginUser.username}`;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.65";
    }
};

//注册提交 【修复成功判断 code===0】
registerForm.onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById("registerUsername").value.trim();
    const password = document.getElementById("registerPassword").value.trim();
    const password2 = document.getElementById("registerPassword2").value.trim();
    if (!username || !password || !password2) {
        alert("请填写完整信息");
        return;
    }
    if (password !== password2) {
        alert("两次密码不一致");
        return;
    }
    const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    alert(json.msg);
    if (json.code === 0) {
        loginUser = { username };
        localStorage.setItem("loginUser", JSON.stringify(loginUser));
        closeLoginModal();
        loginBtn.innerText = `已登录：${loginUser.username}`;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.65";
    }
};

//上传文件按钮事件
uploadBtn.onclick = async ()=>{
    alert("上传接口待后端实现");
}

//发送评论【修复接口地址为 /addcomment，和Worker后端匹配】
sendCommentBtn.onclick = async ()=>{
    if(!loginUser){
        alert("登录后才能发送评论");
        openLoginModal();
        return;
    }
    const text = commentInput.value.trim();
    if(!text) return;
    const res = await fetch(`${API_BASE}/addcomment`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            songKey:currentPlayingKey,
            username:loginUser.username,
            content:text
        })
    })
    const json = await res.json();
    alert(json.msg);
    commentInput.value = "";
    loadCommentList(currentPlayingKey);
}

//加载评论列表
async function loadCommentList(songKey){
    if(!songKey) return;
    const res = await fetch(`${API_BASE}/getcomment?songKey=${encodeURIComponent(songKey)}`);
    const json = await res.json();
    if(json.code!==0){
        commentListBox.innerHTML = `<div style="color:#777;text-align:center;">读取评论失败</div>`;
        return;
    }
    const list = json.comments;
    if(list.length===0){
        commentListBox.innerHTML = `<div style="color:#777;text-align:center;">暂无评论</div>`;
        return;
    }
    commentListBox.innerHTML = "";
    list.forEach(item=>{
        const div = document.createElement("div");
        div.className = "comment-item";
        const timeStr = new Date(item.time).toLocaleString();
        div.innerHTML = `
            <div class="comment-name">${item.username} <span style="font-size:12px;color:#888">${timeStr}</span></div>
            <div>${item.content}</div>
        `;
        commentListBox.appendChild(div);
    })
}

//收藏按钮
collectBtn.onclick = ()=>{
    if(!loginUser){
        alert("登录后可收藏");
        openLoginModal();
        return;
    }
    if(!currentPlayingKey) return;
    const idx = favList.indexOf(currentPlayingKey);
    if(idx>-1){
        favList.splice(idx,1);
        alert("已取消收藏");
        collectBtn.innerText = "⭐收藏";
    }else{
        favList.push(currentPlayingKey);
        alert("收藏成功");
        collectBtn.innerText = "★已收藏";
    }
    localStorage.setItem("favList",JSON.stringify(favList));
}

//歌词切换
function toggleLyricPanel(){
    lyricPanelOpen = !lyricPanelOpen;
    if(lyricPanelOpen){
        lyricWrap.style.maxHeight = "260px";
        lyricScrollContainer.style.maxHeight = "200px";
        lyricBarBtn.innerText = "📄 关闭歌词";
    }else{
        lyricWrap.style.maxHeight = "0px";
        lyricScrollContainer.style.maxHeight = "0px";
        lyricBarBtn.innerText = "📄 打开歌词";

}
lyricBarBtn.addEventListener("click",toggleLyricPanel);

//加载R2云端列表
async function loadCloudList(prefix){
    currentCloudPrefix = prefix;
    cloudBox.innerHTML = `<div style="color:#777;text-align:center;">加载中...</div>`;
    cloudBox.innerHTML = `<div style="color:#777;text-align:center;">文件列表接口待后端开发</div>`;

//切换云端标签
tabCloudList.forEach(tab=>{
    tab.onclick = ()=>{
        tabCloudList.forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
        loadCloudList(tab.dataset.prefix);
    }
})

//关闭图片弹窗
imgModal.onclick = ()=>{
    imgModal.style.display = "none";
}

//加载云端音视频
function loadCloudMedia(url,fileName){
    destroyMedia();
    currentPlayingKey = fileName;
    //加入播放历史
    if(!playHistory.includes(fileName)){
        playHistory.unshift(fileName);
        if(playHistory.length>30) playHistory.pop();
        localStorage.setItem("playHistory",JSON.stringify(playHistory));
        renderHistory();
    }
    collectBtn.innerText = favList.includes(fileName)?"★已收藏":"⭐收藏";

    const isVideo = /\.(mp4|mov)$/i.test(fileName);
    mediaEl = document.createElement(isVideo?"video":"audio");
    mediaEl.src = url;
    mediaBox.insertBefore(mediaEl, bigPlayBtn);
    bigPlayBtn.style.display="none";

    mediaEl.ontimeupdate = ()=>{
        curTimeDom.innerText = formatTime(mediaEl.currentTime);
        const pct = (mediaEl.currentTime/mediaEl.duration)*100;
        progressDot.style.left = pct+"%";
        updateLyric(mediaEl.currentTime);
    };
    mediaEl.onloadedmetadata = ()=>{
        totalTimeDom.innerText = formatTime(mediaEl.duration||0);
    };
    mediaEl.onended = ()=>{
        playPauseBtn.innerText = "▶";
        nextMedia();
    };
    mediaEl.play();
    playPauseBtn.innerText = "⏸";
    loadCommentList(fileName);
}

//上一首
prevBtn.onclick = ()=>{
    if(playList.length===0) return;
    currentIndex--;
    if(currentIndex<0) currentIndex = playList.length-1;
    const item = playList[currentIndex];
    const url = `${API_BASE}/getmusic?key=${encodeURIComponent(item.name)}`;
    loadCloudMedia(url,item.name);
}
//下一首
nextBtn.onclick = nextMedia;

function nextMedia(){
    if(playList.length===0) return;
    currentIndex++;
    if(currentIndex>=playList.length) currentIndex = 0;
    const item = playList[currentIndex];
    const url = `${API_BASE}/getmusic?key=${encodeURIComponent(item.name)}`;
    loadCloudMedia(url,item.name);
}

function formatTime(s){
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function destroyMedia(){
    if(mediaEl){
        mediaEl.pause();
        mediaEl.remove();
        mediaEl = null;
    }
    bigPlayBtn.style.display="none";
    clearLyric();
    currentPlayingKey = "";
    commentListBox.innerHTML = `<div style="color:#777;text-align:center;">暂无评论</div>`;
}
function clearLyric(){
    lyricData = [];
    lyricScroll.innerHTML = `<div class="lyric-line">支持 lrc / krc / txt 歌词；视频音频共用歌词模块</div>`;
}

//渲染播放历史
function renderHistory(){
    if(playHistory.length===0){
        historyWrap.innerHTML = `<div style="color:#777;text-align:center;">选择云端文件后记录出现</div>`;
        return;
    }
    historyWrap.innerHTML = "";
    playHistory.forEach(key=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerText = key;
        div.onclick = ()=>{
            const url = `${API_BASE}/getmusic?key=${encodeURIComponent(key)}`;
            loadCloudMedia(url,key);
        }
        historyWrap.appendChild(div);
    })
}

//LRC KRC解析
function parseSimpleLrc(text){
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
    const arr = [];
    let m;
    while((m=reg.exec(text))!==null){
        const t = Number(m[1])*60 + Number(m[2]) + Number(m[3]) / (m[3].length===2?100:1000);
        arr.push({
            time: t,
            text: m[4].trim()
        })
    }
    return arr;
}
