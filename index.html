<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 360px;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#204080,#3a6fc9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
}
.nav-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.nav-btn{
    padding: 8px 18px;
    background: #fff;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.nav-btn.active{
    background:#4299e1;
    color:#fff;
}
.nav-btn:hover:not(.active){
    background:#e6f0fc;
}
.search-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 999px 0 0 999px;
    outline: none;
    font-size: 15px;
}
.search-bar button{
    padding: 0 22px;
    border: none;
    background: #4299e1;
    color: #fff;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
.card-wrap{
    width: 96%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}
.music-card{
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #b8d8f0;
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 8px;
    overflow: hidden;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #204080;
    padding: 40px 0;
}
.player-box{
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 420px;
    height: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow: hidden;
    resize: both;
    z-index: 999;
    max-width: 95vw;
    max-height: 90vh;
}
.fullscreen-btn{
    position: absolute;
    top: 8px;
    right: 8px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
}
.lyric-toggle-btn{
    position:absolute;
    top:8px;
    left:8px;
    z-index:10;
    padding:4px 10px;
    border:none;
    border-radius:6px;
    background:rgba(0,0,0,0.4);
    color:#fff;
    cursor:pointer;
}
.play-cover{
    width: 100%;
    height: 58%;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    background: #eee;
    display: none;
    align-items: center;
    justify-content:center;
}
.play-cover img{
    width: 120px;
    height:120px;
    border-radius:12px;
    object-fit: cover;
}
.video-view{
    width: 100%;
    height: 58%;
    background: #000;
    display:block;
    object-fit: contain;
}
.control-bar{
    padding: 10px;
    height: 42%;
}
.play-list{
    height: 76px;
    overflow-x: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}
.list-item{
    position: relative;
    padding: 6px 10px;
    background: #f0f7fc;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 13px;
    cursor: pointer;
}
.del-btn{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: #ff6b6b;
    color: #fff;
    font-size: 11px;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    cursor: pointer;
}
.lyric-area{
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    line-height: 1.5;
}
/* 核心修改：默认显示悬浮歌词 */
.float-lyric-wrap{
    position: absolute;
    top: 60px;
    left: 16px;
    min-width:260px;
    min-height:90px;
    width:78%;
    z-index:15;
    cursor:move;
    user-select:none;
    resize:both;
    overflow:hidden;
    display:block;
}
.float-lyric-wrap::-webkit-scrollbar{
    display:none;
}
.lyric-line{
    padding:8px 14px;
    margin:4px 0;
    border-radius:8px;
    background:rgba(0,0,0,0.38);
    backdrop-filter:blur(6px);
    font-size:clamp(16px,2vw,26px);
    letter-spacing:2px;
}
.prev-line{
    color:#ffffff;
    opacity:0.55;
    text-align:left;
}
.curr-line{
    color:#63d8ff;
    font-weight:bold;
    text-align:right;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页 Home</button>
    <button class="nav-btn" data-type="music">音乐 Music</button>
    <button class="nav-btn" data-type="video">视频 Video</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索 Search</button>
</div>

<div class="card-wrap" id="cardContainer">
    <div class="load-tip">正在加载资源，请稍等...</div>
</div>

<div class="player-box" id="playerWrap">
    <button class="lyric-toggle-btn" id="lyricToggleBtn">悬浮歌词</button>
    <div class="fullscreen-btn" id="fullBtn">⛶</div>
    <div class="float-lyric-wrap" id="floatLyricWrap">
        <div class="lyric-line prev-line" id="prevLyric"></div>
        <div class="lyric-line curr-line" id="currLyric">暂无歌词</div>
    </div>

    <div class="play-cover" id="playCoverBox">
        <img id="playCoverImg">
    </div>
    <video class="video-view" id="mainVideo" controls playsinline webkit-playsinline></video>
    <div class="control-bar">
        <div class="play-list" id="playListBox"></div>
        <div class="lyric-area" id="lyricBox">暂无播放内容</div>
    </div>
</div>
<audio id="mainAudio">

<script>
const API_BASE = "https://api.busisi.com";
let currentPlayList = [];
let currentTabType = "all";
let allResourceList = [];
let nowPlayingItem = null;
let parsedLyricList = [];

const dom = {
    cardContainer: document.getElementById("cardContainer"),
    searchInput: document.getElementById("searchInput"),
    searchBtn: document.getElementById("searchBtn"),
    navBtns: document.querySelectorAll(".nav-btn"),
    fullBtn: document.getElementById("fullBtn"),
    mainVideo: document.getElementById("mainVideo"),
    mainAudio: document.getElementById("mainAudio"),
    playCoverBox: document.getElementById("playCoverBox"),
    playCoverImg: document.getElementById("playCoverImg"),
    playListBox: document.getElementById("playListBox"),
    lyricBox: document.getElementById("lyricBox"),
    floatLyricWrap: document.getElementById("floatLyricWrap"),
    prevLyric: document.getElementById("prevLyric"),
    currLyric: document.getElementById("currLyric"),
    lyricToggleBtn: document.getElementById("lyricToggleBtn"),
    playerWrap: document.getElementById("playerWrap")
};

// 悬浮歌词拖拽
(function initLyricDrag(){
    const wrap = dom.floatLyricWrap;
    let dragging = false, ox, oy;
    const edgeThreshold = 14;
    wrap.addEventListener("mousedown",e=>{
        const rect = wrap.getBoundingClientRect();
        const pRect = dom.playerWrap.getBoundingClientRect();
        const isResizeEdge = e.clientX-rect.left<edgeThreshold||rect.right-e.clientX<edgeThreshold||e.clientY-rect.top<edgeThreshold||rect.bottom-e.clientY<edgeThreshold;
        if(isResizeEdge) return;
        dragging = true;
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        wrap.style.cursor = "grabbing";
    });
    document.addEventListener("mousemove",e=>{
        if(!dragging) return;
        const pRect = dom.playerWrap.getBoundingClientRect();
        let x = e.clientX-pRect.left-ox;
        let y = e.clientY-pRect.top-oy;
        x = Math.max(0, Math.min(x, dom.playerWrap.offsetWidth-wrap.offsetWidth));
        y = Math.max(0, Math.min(y, dom.playerWrap.offsetHeight-wrap.offsetHeight));
        wrap.style.left = `${x}px`;
        wrap.style.top = `${y}px`;
    });
    document.addEventListener("mouseup",()=>dragging=false);
})();

dom.lyricToggleBtn.addEventListener("click",()=>{
    dom.floatLyricWrap.style.display = dom.floatLyricWrap.style.display==="block"?"none":"block";
});

// 双格式歌词解析
function parseLyric(rawText) {
    return rawText.includes("krcc")||rawText.includes("KRC") ? parseKRC(rawText) : parseLRC(rawText);
}
function parseLRC(text){
    const result = [];
    const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
    text.split("\n").forEach(line=>{
        line=line.trim();
        const m=line.match(reg);
        if(!m)return;
        const t = parseInt(m[1])*60 + parseInt(m[2]) + (parseInt(m[3]||0)/1000);
        const txt=m[4].trim();
        txt&&result.push({time:t,text:txt});
    });
    return result.sort((a,b)=>a.time-b.time);
}
function parseKRC(krcText){
    const km=krcText.match(/krcc:"([^"]+)"/);
    if(!km)return [];
    let b64=km[1],out="";
    const key=[64,71,97,119,94,50,116,71];
    for(let i=0;i<b64.length;i++) out+=String.fromCharCode(b64.charCodeAt(i)^key[i%8]);
    const list=[], reg=/(\d+),\d+,\d+\|([^\|]+)\|/g;
    let m;
    while((m=reg.exec(out))!==null){
        const t=parseInt(m[1])/1000, txt=m[2].trim();
        txt&&list.push({time:t,text:txt});
    }
    return list.sort((a,b)=>a.time-b.time);
}

function updateFloatLyric(nowT){
    if(!parsedLyricList.length){
        dom.prevLyric.innerText="";dom.currLyric.innerText="暂无歌词";return;
    }
    let idx=0;
    for(let i=0;i<parsedLyricList.length;i++){
        if(nowT>=parsedLyricList[i].time) idx=i;
        else break;
    }
    dom.prevLyric.innerText=parsedLyricList[idx-1]?.text||"";
    dom.currLyric.innerText=parsedLyricList[idx].text;
}

window.addEventListener("load", async () => {
    if(location.protocol==="file:"){
        dom.cardContainer.innerHTML=`<div class="load-tip" style="color:red">禁止本地双击打开HTML，必须网页托管访问</div>`;
        return;
    }
    dom.navBtns.forEach(btn=>{
        btn.addEventListener("click",()=>{
            dom.navBtns.forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            currentTabType=btn.dataset.type;
            renderFilterList();
        });
    });
    dom.searchBtn.addEventListener("click",searchResource);
    dom.searchInput.addEventListener("keydown",e=>e.key==="Enter"&&searchResource());
    dom.fullBtn.addEventListener("click",toggleFullScreen);

    function bindTime(){
        const cb=()=>{
            const media=nowPlayingItem?.type==="video"?dom.mainVideo:dom.mainAudio;
            media&&!media.paused&&updateFloatLyric(media.currentTime);
        };
        dom.mainVideo.ontimeupdate=cb;
        dom.mainAudio.ontimeupdate=cb;
    }
    bindTime();

    try{
        const res=await fetch(`${API_BASE}/getResourceList`);
        if(!res.ok) throw new Error(`接口${res.status}`);
        allResourceList=await res.json();
        renderFilterList();
    }catch(err){
        dom.cardContainer.innerHTML=`<div class="load-tip" style="color:red">接口连接失败<br>检查Worker部署/R2绑定<br>${err.message}</div>`;
        console.error(err);
    }
});

function renderFilterList(){
    let list=allResourceList;
    if(currentTabType!=="all") list=list.filter(i=>i.type===currentTabType);
    renderCard(list);
}
function renderCard(list){
    dom.cardContainer.innerHTML="";
    if(!list.length){dom.cardContainer.innerHTML='<div class="load-tip">暂无资源</div>';return;}
    list.forEach(item=>{
        const card=document.createElement("div");
        card.className="music-card";
        const cover=item.coverImg?`<div class="cover-box"><img src="${item.coverImg}"></div>`:`<div class="cover-box">无封面</div>`;
        card.innerHTML=`${cover}<div class="card-text">${item.singer||"未知歌手"} - ${item.name}</div>`;
        card.onclick=()=>{addPlaylist(item);playMedia(item);};
        dom.cardContainer.appendChild(card);
    })
}
function addPlaylist(item){
    if(currentPlayList.some(i=>i.id===item.id))return;
    currentPlayList.push(item);renderPlaylist();
}
function renderPlaylist(){
    dom.playListBox.innerHTML="";
    currentPlayList.forEach(item=>{
        const li=document.createElement("div");
        li.className="list-item";
        li.innerHTML=`${item.singer||"未知歌手"} - ${item.name}<span class="del-btn">×</span>`;
        li.onclick=e=>{if(!e.target.classList.contains("del-btn")) playMedia(item);};
        li.querySelector(".del-btn").onclick=e=>{
            e.stopPropagation();
            currentPlayList=currentPlayList.filter(i=>i.id!==item.id);
            renderPlaylist();
        };
        dom.playListBox.appendChild(li);
    })
}

async function playMedia(item){
    nowPlayingItem=item;
    dom.mainVideo.pause();dom.mainVideo.src="";
    dom.mainAudio.pause();dom.mainAudio.src="";
    dom.lyricBox.innerText="加载歌词中...";
    parsedLyricList=[];
    dom.prevLyric.innerText="";
    dom.currLyric.innerText="暂无歌词";

    // 移除多余encodeURI，解决双重编码路径404
    const isVideo = /\.(mp4|mov|m4v)$/i.test(item.name||"");
    if(isVideo && item.videoLink){
        dom.mainVideo.style.display="block";
        dom.playCoverBox.style.display="none";
        dom.mainVideo.src = item.videoLink;
        dom.mainVideo.play().catch(e=>console.log("播放需手动触发：",e));
    }else if(item.audioLink){
        dom.mainVideo.style.display="none";
        dom.playCoverBox.style.display="flex";
        dom.mainAudio.src = item.audioLink;
        dom.mainAudio.play().catch(e=>console.log("播放需手动触发：",e));
    }
    if(item.coverImg) dom.playCoverImg.src=item.coverImg;

    try{
        // 固定去children文件夹读取歌词
        const lyricName=item.lyricName;
        const lyricRes=await fetch(`${API_BASE}/getLyric?name=${encodeURIComponent(lyricName)}`);
        if(lyricRes.ok){
            const txt=await lyricRes.text();
            dom.lyricBox.innerText=txt;
            parsedLyricList=parseLyric(txt);
            // 加载歌词立刻渲染第一行
            updateFloatLyric(0);
        }else {
            dom.lyricBox.innerText="暂无匹配歌词";
            dom.currLyric.innerText="暂无匹配歌词";
        }
    }catch{
        dom.lyricBox.innerText="歌词加载失败";
        dom.currLyric.innerText="歌词加载失败";
    }
}

function toggleFullScreen(){
    const target=dom.mainVideo;
    const enter=el=>el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?.();
    const exit=()=>document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen?.();
    if(document.fullscreenElement||document.webkitFullscreenElement){exit();dom.fullBtn.innerText="⛶";}
    else{enter(target);dom.fullBtn.innerText="⊡";}
}
document.addEventListener('fullscreenchange',()=>{
    dom.fullBtn.innerText=document.fullscreenElement?"⊡":"⛶";
});
document.addEventListener('webkitfullscreenchange',()=>{
    dom.fullBtn.innerText=document.webkitFullscreenElement?"⊡":"⛶";
});

function searchResource(){
    const kw=dom.searchInput.value.trim().toLowerCase();
    if(!kw){renderFilterList();return;}
    let src=currentTabType==="all"?allResourceList:allResourceList.filter(i=>i.type===currentTabType);
    const res=src.filter(v=>{
        const n=(v.name||"").toLowerCase(),s=(v.singer||"").toLowerCase();
        return n.includes(kw)||s.includes(kw);
    });
    renderCard(res);
}
</script>
</body>
</html>
