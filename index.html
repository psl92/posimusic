<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 8%),
        radial-gradient(circle at 30% 10%, rgba(180,140,255,0.6) 0%, transparent 10%),
        radial-gradient(circle at 70% 40%, rgba(100,180,255,0.5) 0%, transparent 12%),
        radial-gradient(circle at 50% 80%, rgba(255,160,220,0.4) 0%, transparent 15%);
    pointer-events: none;
    z-index: -1;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    color: #222;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
}
/* 主分区：左播放目录 右播放器 2:1比例 */
.main-wrap{
    display: flex;
    width: 96%;
    margin: 0 auto;
    gap: 16px;
}
/* 左侧播放目录 占1/3 */
.play-list-wrap{
    width: 33%;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.45);
    min-height: 600px;
    padding: 12px;
}
/* 右侧播放器主体 占2/3 */
.player-wrap{
    width: 67%;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.45);
    min-height: 600px;
    padding: 12px;
}
/* 歌曲卡片容器 一行8列 */
#cardContainer{
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap:14px;
    padding:16px;
}
.music-card{
    position: relative;
    border-radius:14px;
    overflow:hidden;
    background:rgba(255,255,255,0.28);
    backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.24s ease;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(130,100,255,0.25);
    border-color: rgba(255,255,255,0.75);
}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
}
.card-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.card-info{
    padding:8px 10px;
}
.card-title{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:6px;
    color: #111;
}
.card-meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#333;
    opacity:0.9;
}
.comment-btn{
    cursor:pointer;
    padding: 2px 4px;
    border-radius: 6px;
}
.comment-btn:hover{
    background: rgba(80,140,255,0.2);
    color:#1967ff;
}
/* 底部播放控制栏 */
.bottom-player-bar{
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 110px;
    background: rgba(255,255,255,0.32);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    padding: 0 40px;
    gap: 24px;
}
/* 胶囊3D按钮样式 */
.capsule-btn{
    padding: 8px 20px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(145deg, #73a8ff, #407bff);
    color: #fff;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(64,123,255,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.2s;
}
.capsule-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(64,123,255,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
}
/* 进度条样式 对齐底部按钮水平线 */
.progress-wrap{
    flex: 1;
}
.progress-bar{
    width: 100%;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.4);
    margin-top: 12px;
}
.progress-inner{
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #407bff, #b273ff);
}
/* 悬浮歌词窗口 鼠标移入显示边框可拖拽 */
.lyric-window{
    position: fixed;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 24px;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 6px #000;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: default;
    user-select: none;
}
.lyric-window:hover{
    border-color: rgba(255,255,255,0.6);
    cursor: move;
}
/* 侧边控制按钮 播放器/播放目录开关 */
.side-control-group{
    position: fixed;
    right: 30px;
    bottom: 130px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
</style>
</head>
<body>
<h1 class="main-title">步丝丝音乐</h1>
<div class="main-wrap">
    <!-- 左侧播放目录 1/3 -->
    <div class="play-list-wrap">
        <h3 style="padding:10px 12px">播放列表</h3>
        <div id="cardContainer"></div>
    </div>
    <!-- 右侧播放器主体 2/3 -->
    <div class="player-wrap">
        <h3 style="padding:10px 12px">播放界面</h3>
        <div style="width:100%;height:450px;display:flex;align-items:center;justify-content:center;color:#777">
            播放器展示区域
        </div>
    </div>
</div>

<!-- 底部播放控制栏 -->
<div class="bottom-player-bar">
    <button class="capsule-btn" id="prevBtn">上一曲</button>
    <button class="capsule-btn" id="playBtn">播放/暂停</button>
    <button class="capsule-btn" id="nextBtn">下一曲</button>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="progress-inner" id="progressInner" style="width:0%"></div>
        </div>
    </div>
    <span id="timeText">00:00 / 00:00</span>
</div>

<!-- 侧边弹窗开关 -->
<div class="side-control-group">
    <button class="capsule-btn" id="togglePlayerWin">播放器窗口</button>
    <button class="capsule-btn" id="toggleListWin">播放目录</button>
</div>

<!-- 悬浮歌词 -->
<div class="lyric-window" id="lyricBox">
    <span class="lyric-normal">暂无匹配歌词</span>
</div>

<!-- 音频播放器 -->
<audio id="audioPlayer">

<script>
let audioDom = document.getElementById("audioPlayer");
let currentSongItem = null;
let playListData = [];
let lyricDrag = false;
let lyricOffsetX = 0;
let lyricOffsetY = 0;
const lyricBox = document.getElementById("lyricBox");
const progressInner = document.getElementById("progressInner");
const timeText = document.getElementById("timeText");

window.addEventListener("load", async function () {
    if (location.protocol === "file:") {
        console.warn("禁止本地file协议打开，请部署网页访问");
        return;
    }
    await loadAllResources();
    setTimeout(async () => {
        await loadAllResources();
    }, 200);
});

// 拉取R2全部音乐资源
async function loadAllResources() {
    try {
        const res = await fetch("https://api.busisi.com/list");
        const list = await res.json();
        playListData = list;
        renderMusicCardList(list);
    } catch (err) {
        console.error("资源列表加载失败", err);
    }
}

// 渲染卡片：封面、歌名、播放次数、评论数
function renderMusicCardList(arr) {
    const container = document.getElementById("cardContainer");
    container.innerHTML = "";
    arr.forEach(item => {
        const coverUrl = item.cover || "";
        const playCnt = item.playCount || 0;
        const commentCnt = item.commentCount || 0;

        const div = document.createElement("div");
        div.className = "music-card";
        div.dataset.id = item.key;
        div.dataset.src = item.url;
        div.dataset.name = item.name;

        div.innerHTML = `
            <div class="card-cover">
                <img src="${coverUrl}" alt="${item.name}" onerror="this.src=''">
            </div>
            <div class="card-info">
                <div class="card-title">${item.name}</div>
                <div class="card-meta">
                    <span class="play-count">▶ ${playCnt}</span>
                    <span class="comment-btn">💬 ${commentCnt}</span>
                </div>
            </div>
        `;
        container.appendChild(div);
    });
}

// 上报播放次数
async function addPlayCount(resourceId) {
    try {
        await fetch(`https://api.busisi.com/addPlayCount?id=${encodeURIComponent(resourceId)}`);
    } catch (e) {
        console.log("播放计数上报失败", e);
    }
}

// 卡片点击事件代理：播放歌曲 / 打开评论
document.addEventListener("click", async function (e) {
    // 点击评论按钮
    if (e.target.classList.contains("comment-btn")) {
        const cardDom = e.target.closest(".music-card");
        const songId = cardDom.dataset.id;
        const inputText = prompt("写下你的评论：");
        if (!inputText || inputText.trim() === "") return;
        try {
            await fetch("https://api.busisi.com/addComment", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: songId,
                    msg: inputText.trim()
                })
            });
            // 提交完重新刷新列表拿到最新评论数字
            await loadAllResources();
        } catch (err) {
            alert("评论提交失败");
        }
        return;
    }

    // 点击卡片本体播放音乐
    const card = e.target.closest(".music-card");
    if (!card) return;
    const src = card.dataset.src;
    const name = card.dataset.name;
    const songKey = card.dataset.id;
    currentSongItem = card;

    audioDom.src = src;
    audioDom.play();
    // 上报播放次数
    addPlayCount(songKey);
});

// 播放器基础进度更新
audioDom.addEventListener("timeupdate", function () {
    const curr = audioDom.currentTime;
    const total = audioDom.duration || 0;
    const rate = (curr / total) * 100;
    progressInner.style.width = rate + "%";
    timeText.innerText = `${formatTime(curr)} / ${formatTime(total)}`;
});

// 时间格式化
function formatTime(s) {
    if(isNaN(s)) return "00:00";
    let m = Math.floor(s / 60);
    let sec = Math.floor(s % 60);
    return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

// 播放器结束自动下一首
audioDom.addEventListener("ended", function () {
    playNextSong();
});

// 下一首逻辑
function playNextSong() {
    if (!playListData.length || !currentSongItem) return;
    const idx = playListData.findIndex(x => x.key === currentSongItem.dataset.id);
    let nextIndex = idx + 1;
    if (nextIndex >= playListData.length) nextIndex = 0;
    const next = playListData[nextIndex];
    const cardDom = document.querySelector(`.music-card[data-id="${next.key}"]`);
    if (cardDom) cardDom.click();
}

// 上一曲
document.getElementById("prevBtn").addEventListener("click",()=>{
    if (!playListData.length || !currentSongItem) return;
    const idx = playListData.findIndex(x => x.key === currentSongItem.dataset.id);
    let prevIndex = idx - 1;
    if (prevIndex < 0) prevIndex = playListData.length - 1;
    const prev = playListData[prevIndex];
    const cardDom = document.querySelector(`.music-card[data-id="${prev.key}"]`);
    if (cardDom) cardDom.click();
})

// 下一曲按钮
document.getElementById("nextBtn").addEventListener("click",playNextSong);

// 播放暂停按钮
document.getElementById("playBtn").addEventListener("click",()=>{
    if(audioDom.paused) audioDom.play();
    else audioDom.pause();
})

// 悬浮歌词拖拽逻辑
lyricBox.addEventListener("mousedown",(e)=>{
    lyricDrag = true;
    lyricOffsetX = e.clientX - lyricBox.offsetLeft;
    lyricOffsetY = e.clientY - lyricBox.offsetTop;
    lyricBox.style.transition = "none";
})
document.addEventListener("mousemove",(e)=>{
    if(!lyricDrag) return;
    lyricBox.style.left = (e.clientX - lyricOffsetX) + "px";
    lyricBox.style.top = (e.clientY - lyricOffsetY) + "px";
    lyricBox.style.transform = "none";
})
document.addEventListener("mouseup",()=>{
    lyricDrag = false;
    lyricBox.style.transition = "all 0.15s ease";
})

// 侧边开关按钮预留逻辑（可扩展弹窗显示隐藏）
document.getElementById("togglePlayerWin").addEventListener("click",()=>{
    alert("播放器窗口开关逻辑待扩展");
})
document.getElementById("toggleListWin").addEventListener("click",()=>{
    alert("播放目录窗口开关逻辑待扩展");
})
</script>
</body>
</html>
