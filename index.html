<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 360px;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#204080,#3a6fc9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
}
.nav-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.nav-btn{
    padding: 8px 18px;
    background: #fff;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
.nav-btn.active{
    background:#4299e1;
    color:#fff;
}
.nav-btn:hover:not(.active){
    background:#e6f0fc;
}
.search-bar{
    width: 94%;
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 999px 0 0 999px;
    outline: none;
    font-size: 15px;
}
.search-bar button{
    padding: 0 22px;
    border: none;
    background: #4299e1;
    color: #fff;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
.card-wrap{
    width: 96%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}
.music-card{
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 14px #b8d8f0;
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 8px;
    overflow: hidden;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #204080;
    padding: 40px 0;
}
.player-box{
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 420px;
    height: 340px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 25px #94b9da;
    overflow: hidden;
    resize: both;
    z-index: 999;
}
.fullscreen-btn{
    position: absolute;
    top: 8px;
    right: 8px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: grid;
    place-items: center;
}
.play-cover{
    width: 100%;
    height: 58%;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    background: #eee;
    display: none;
    align-items: center;
    justify-content:center;
}
.play-cover img{
    width: 120px;
    height:120px;
    border-radius:12px;
    object-fit: cover;
}
.video-view{
    width: 100%;
    height: 58%;
    background: #000;
    display:block;
}
.control-bar{
    padding: 10px;
    height: 42%;
}
.play-list{
    height: 76px;
    overflow-x: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}
.list-item{
    position: relative;
    padding: 6px 10px;
    background: #f0f7fc;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 13px;
    cursor: pointer;
}
.del-btn{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: #ff6b6b;
    color: #fff;
    font-size: 11px;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    cursor: pointer;
}
.lyric-area{
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    line-height: 1.5;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页 Home</button>
    <button class="nav-btn" data-type="music">音乐 Music</button>
    <button class="nav-btn" data-type="video">视频 Video</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索 Search</button>
</div>

<div class="card-wrap" id="cardContainer">
    <div class="load-tip">正在加载资源，请稍等...</div>
</div>

<div class="player-box" id="playerWrap">
    <div class="fullscreen-btn" id="fullBtn">⛶</div>
    <div class="play-cover" id="playCoverBox">
        <img id="playCoverImg">
    </div>
    <video class="video-view" id="mainVideo" controls></video>
    <div class="control-bar">
        <div class="play-list" id="playListBox"></div>
        <div class="lyric-area" id="lyricBox">暂无播放内容</div>
    </div>
</div>
<!-- 新增：音频播放器，专门播放音乐mp3（隐藏） -->
<audio id="mainAudio">

<script>
// 后端接口地址，固定绑定
const API_BASE = "https://api.busisi.com";
let currentPlayList = [];
let currentTabType = "all";
let allResourceList = [];
let nowPlayingItem = null;

// 页面元素缓存
const dom = {
    cardContainer: document.getElementById("cardContainer"),
    searchInput: document.getElementById("searchInput"),
    searchBtn: document.getElementById("searchBtn"),
    navBtns: document.querySelectorAll(".nav-btn"),
    fullBtn: document.getElementById("fullBtn"),
    mainVideo: document.getElementById("mainVideo"),
    mainAudio: document.getElementById("mainAudio"),
    playCoverBox: document.getElementById("playCoverBox"),
    playCoverImg: document.getElementById("playCoverImg"),
    playListBox: document.getElementById("playListBox"),
    lyricBox: document.getElementById("lyricBox")
};

window.addEventListener("load", async () => {
    // 禁止本地直接打开HTML运行
    if(location.protocol === "file:"){
        dom.cardContainer.innerHTML = `<div class="load-tip" style="color:red">禁止本地双击打开HTML，必须托管网页访问</div>`;
        return;
    }

    // 顶部导航切换事件
    dom.navBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            dom.navBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentTabType = btn.dataset.type;
            renderFilterList();
        })
    });

    // 搜索按钮点击
    dom.searchBtn.addEventListener("click", searchResource);
    // 回车快捷搜索
    dom.searchInput.addEventListener("keydown", e => {
        if(e.key === "Enter") searchResource();
    });
    // 全屏按钮
    dom.fullBtn.addEventListener("click", toggleFullScreen);

    // 请求后端拉取全部音乐视频资源
    try {
        const res = await fetch(`${API_BASE}/getResourceList`);
        if(!res.ok) throw new Error(`接口请求失败：${res.status}`);
        allResourceList = await res.json();
        renderFilterList();
    } catch(err) {
        dom.cardContainer.innerHTML = `
            <div class="load-tip" style="color:red">
                连接后端接口失败<br>
                1.检查Worker是否部署完成<br>
                2.等待域名解析生效<br>
                错误信息：${err.message}
            </div>
        `;
        console.error("资源加载报错：", err);
    }
});

// 根据分类筛选渲染列表
function renderFilterList() {
    let list = allResourceList;
    if(currentTabType !== "all") {
        list = list.filter(item => item.type === currentTabType);
    }
    renderCard(list);
}

// 渲染歌曲卡片
function renderCard(list) {
    dom.cardContainer.innerHTML = "";
    if(list.length === 0) {
        dom.cardContainer.innerHTML = '<div class="load-tip">暂无匹配资源</div>';
        return;
    }
    list.forEach(item => {
        const card = document.createElement("div");
        card.className = "music-card";
        let coverHtml = item.coverImg
            ? `<div class="cover-box"><img src="${item.coverImg}" alt="封面"></div>`
            : `<div class="cover-box">无封面</div>`;
        card.innerHTML = `${coverHtml}<div class="card-text">${item.singer||"未知歌手"} - ${item.name}</div>`;

        // 点击卡片播放音视频
        card.addEventListener("click", () => {
            addPlaylist(item);
            playMedia(item);
        });
        dom.cardContainer.appendChild(card);
    })
}

// 添加进播放列表（去重）
function addPlaylist(item) {
    const isExist = currentPlayList.some(i => i.id === item.id);
    if(isExist) return;
    currentPlayList.push(item);
    renderPlaylist();
}

// 渲染底部横向播放列表
function renderPlaylist() {
    dom.playListBox.innerHTML = "";
    currentPlayList.forEach(item => {
        const li = document.createElement("div");
        li.className = "list-item";
        li.innerHTML = `${item.singer||"未知歌手"} - ${item.name}<span class="del-btn">×</span>`;

        // 点击切换播放
        li.addEventListener("click", e => {
            if(e.target.classList.contains("del-btn")) return;
            playMedia(item);
        });

        // 删除单条播放记录
        li.querySelector(".del-btn").addEventListener("click", e => {
            e.stopPropagation();
            currentPlayList = currentPlayList.filter(i => i.id !== item.id);
            renderPlaylist();
        });
        dom.playListBox.appendChild(li);
    })
}

// 播放音频/视频
async function playMedia(item) {
    nowPlayingItem = item;
    // 先停止全部媒体
    dom.mainVideo.pause();
    dom.mainVideo.src = "";
    dom.mainAudio.pause();
    dom.mainAudio.src = "";
    dom.lyricBox.innerText = "加载歌词中...";

    // 区分音乐/视频，分开播放器
    if(item.type === "video" && item.videoLink) {
        // 视频：使用video标签，显示视频画面，隐藏封面
        dom.mainVideo.style.display = "block";
        dom.playCoverBox.style.display = "none";
        dom.mainVideo.src = item.videoLink;
        dom.mainVideo.play().catch(e => console.log("视频播放限制：", e));
    } else if(item.audioLink) {
        // 音乐：使用audio标签，隐藏video黑屏区域，展示封面
        dom.mainVideo.style.display = "none";
        dom.playCoverBox.style.display = "flex";
        dom.mainAudio.src = item.audioLink;
        dom.mainAudio.play().catch(e => console.log("音频播放限制：", e));
    }

    // 封面赋值
    if(item.coverImg) {
        dom.playCoverImg.src = item.coverImg;
    }

    // 加载歌词（优先使用歌曲id，兼容没有lyricName字段情况，你可以根据后端字段调整）
    try {
        let lyricKey = item.lyricName || item.id;
        const lyricRes = await fetch(`${API_BASE}/getLyric?name=${lyricKey}`);
        if(lyricRes.ok) {
            const lyricText = await lyricRes.text();
            dom.lyricBox.innerText = lyricText;
        } else {
            dom.lyricBox.innerText = "暂无匹配歌词";
        }
    } catch {
        dom.lyricBox.innerText = "歌词加载失败";
    }
}

// 视频全屏切换【修复浏览器兼容】
function toggleFullScreen() {
    const target = dom.mainVideo;
    // 兼容多浏览器前缀
    function enterFull(el){
        if(el.requestFullscreen) el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
    }
    function exitFull(){
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }

    if(document.fullscreenElement || document.webkitFullscreenElement) {
        exitFull();
        dom.fullBtn.innerText = "⛶";
    } else {
        enterFull(target);
        dom.fullBtn.innerText = "⊡";
    }
}
// 监听全屏切换，自动更新图标
document.addEventListener('fullscreenchange', updateFullIcon);
document.addEventListener('webkitfullscreenchange', updateFullIcon);
function updateFullIcon(){
    if(document.fullscreenElement || document.webkitFullscreenElement){
        dom.fullBtn.innerText = "⊡";
    }else{
        dom.fullBtn.innerText = "⛶";
    }
}

// 搜索歌曲功能
function searchResource() {
    const keyword = dom.searchInput.value.trim().toLowerCase();
    if(!keyword) {
        renderFilterList();
        return;
    }
    let sourceList = allResourceList;
    if(currentTabType !== "all") {
        sourceList = sourceList.filter(i => i.type === currentTabType);
    }
    const result = sourceList.filter(v => {
        const songName = (v.name || "").toLowerCase();
        const singerName = (v.singer || "").toLowerCase();
        return songName.includes(keyword) || singerName.includes(keyword);
    });
    renderCard(result);
}
</script>
</body>
</html>
