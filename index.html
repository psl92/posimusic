步丝丝音乐 前台客户端（接口全对齐版）
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
    outline: none !important;
}
button{
    border: none !important;
    outline: none !important;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
/* 星光闪烁层 */
body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1px);
    background-size: 20px 20px, 35px 35px, 50px 50px;
    background-position: 0 0, 10px 10px, 25px 25px;
    animation: twinkle 8s infinite ease-in-out;
}
body::after{
    display:none;
}
@keyframes twinkle{
    0%{ opacity: 0.6; }
50%{ opacity: 1; }
    100%{ opacity: 0.6; }
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    font-family: "KaiTi","STKaiti",serif;
    background: linear-gradient(135deg,#ff88bb,#ffdd77,#88ddff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    position: relative;
    z-index: 2;
}
.nav-bar{
    width: 94%;
    max-width: 1400px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
}
.nav-btn{
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    background: linear-gradient(135deg, #ffe6f2, #e6f4ff);
    color:#333344;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 4px 12px rgba(160,190,230,0.15);
    backdrop-filter: blur(6px);
}
.nav-btn.active{
    background: linear-gradient(145deg, #ffb4d8, #9cd4ff);
    color:#222;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.7), 0 6px 16px rgba(170,200,240,0.22);
}
.nav-btn:hover:not(.active){
    transform: translateY(-1px);
    background: linear-gradient(135deg, #ffdcec, #d9ecff);
}
.search-bar{
    width: 94%;
    max-width: 1400px;
    margin: 0 auto 24px;
    display: flex;
    position: relative;
    z-index: 2;
}
.search-bar input{
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px 0 0 999px;
    font-size: 15px;
    background: rgba(255,255,255,0.75);
    color:#222;
    backdrop-filter: blur(6px);
}
.search-bar input::placeholder{
    color:#666;
}
.search-bar button{
    padding: 0 22px;
    background: linear-gradient(145deg, #ffb4d8, #9cd4ff);
    color: #222;
    border-radius: 0 999px 999px 0;
    cursor: pointer;
}
.main-wrap{
    width: 94%;
    max-width: 1400px;
 margin:0 auto;
    display:flex;
    gap:24px;
    align-items:flex-start;
    position: relative;
    z-index: 2;
}
.left-card-area{
    width:100%;
}
.card-wrap{
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 16px;
}
.music-card{
    background: rgba(255,255,255,0.65);
    border-radius: 16px;
    padding: 12px;
    cursor: pointer;
 transition: transform 0.2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 4px 12px rgba(160,190,230,0.12);
}
.music-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 6px 18px rgba(150,180,220,0.2);
}
.cover-box{
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 16px;
}
.cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-text{
    font-size: 13px;
    text-align: center;
    color:#333;
}
.card-text small{
    font-size:11px;
    opacity:0.7;
}
.load-tip{
    text-align: center;
    font-size: 16px;
    color: #444;
    padding: 40px 0;
    grid-column:1/-1;
}

/* ===== 悬浮播放器窗口 ===== */
.right-big-container{
    position: fixed;
    top:140px;
    right:2%;
    width:400px;
    height:340px;
    min-width:360px;
 min-height:300px;
    background:rgba(255,255,255,0.65);
    border-radius:20px;
    overflow:hidden;
    display:flex;
    z-index:99;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 10px 28px rgba(140,170,210,0.18);
}
.right-big-container.minimize-state{
    display:none;
}
.drag-handle{
    position:absolute;
    width:100%;
    height:28px;
    top:0;
    left:0;
    cursor:move;
    z-index:5;
    display:flex;
    justify-content: flex-end;
    align-items:center;
    padding-right:8px;
}
.minimize-win-btn{
    width:28px;
 height:22px;
    border-radius:999px;
    background: linear-gradient(135deg, #ffe6f2, #e6f4ff);
    color:#333;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter: blur(4px);
}
.resize-handle{
    position:absolute;
    z-index:10;
}
.resize-t{top:0;left:12px;right:12px;height:6px;cursor:n-resize;}
.resize-b{bottom:0;left:12px;right:12px;height:6px;cursor:s-resize;}
.resize-l{left:0;top:12px;bottom:12px;width:6px;cursor:w-resize;}
.resize-r{right:0;top:12px;bottom:12px;width:6px;cursor:e-resize;}
.resize-lt{left:0;top:0;width:12px;height:12px;cursor:nw-resize;}
.resize-rt{right:0;top:0;width:12px;height:12px;cursor:ne-resize;}
.resize-lb{left:0;bottom:0;width:12px;height:12px;cursor:sw-resize;}
.resize-rb{right:0;bottom:0;width:12px;height:12px;cursor:se-resize;}

.playlist-sidebar{
    width:38%;
    border-right:1px solid rgba(180,200,230,0.35);
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,0.35);
}
.player-window{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
}
.sidebar-head{
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(180,200,230,0.35);
    margin-top:28px;
}
.sidebar-head h4{
    font-size:18px;
    color:#333;
}
.hideSideBtn{
    border-radius:999px;
    padding:4px 10px;
    cursor:pointer;
    color:#333;
    background: linear-gradient(135deg, #ffe6f2, #e6f4ff);
    backdrop-filter: blur(4px);
}
.playlist-scroll{
    flex:1;
    overflow-y:auto;
    padding:10px;
}
.playlist-scroll::-webkit-scrollbar{
    width:4px;
}
.playlist-scroll::-webkit-scrollbar-thumb{
    background:rgba(160,190,220,0.45);
    border-radius:4px;
}
.playlist-item{
    padding:8px 10px;
    border-radius:12px;
    margin-bottom:6px;
    background:rgba(255,255,255,0.6);
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    color:#333;
    transition:0.15s;
}
.playlist-item.active{
    background: linear-gradient(145deg, #ffb4d8, #9cd4ff);
    color:#111;
}
.playlist-item:hover{
    background:rgba(255,255,255,0.85);
}
.playlist-item.active:hover{
    background: linear-gradient(145deg, #ffaace, #8ecbfa);
}
.item-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    max-width:82%;
}
.item-del{
    width:22px;
    height:22px;
    border-radius:999px;
    background: linear-gradient(145deg,#ff8fb3,#f05b8c);
    color:#fff;
    font-size:12px;
    cursor:pointer;
    flex-shrink:0;
}

.video-container{
    flex:1;
    padding:8px;
    position:relative;
    margin-top:28px;
}
#mainVideo{
    width:100%;
    height:100%;
    background:#000;
    border-radius:12px;
 object-fit:contain;
}
.fullscreen-video-btn{
    position:absolute;
    top:10px;
    right:10px;
    padding:4px 10px;
    border-radius:999px;
    background: linear-gradient(135deg, #ffe6f2, #e6f4ff);
    color:#333;
    cursor:pointer;
    font-size:12px;
    backdrop-filter: blur(4px);
}

/* ========== 底部播放器布局 ========== */
.bottom-player{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(16px);
    padding:12px 20px 18px;
    z-index:999;
}
.bottom-player .inner-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
}
.left-control-group{
    display:flex;
    gap:10px;
    align-items:center;
    flex-shrink:0;
}
.mid-progress-area{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:0 16px;
}
.right-control-group{
    display:flex;
    gap:10px;
    align-items:center;
 flex-shrink:0;
}
.progress-wrap{
    width:100%;
    height:10px;
    background:rgba(200,220,245,0.5);
    border-radius:999px;
    cursor:pointer;
}
.progress-bar{
    height:100%;
    width:0%;
    background: linear-gradient(90deg,#ff98cc,#82c2ff);
    border-radius:999px;
}
.time-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#333;
}
.player-control-row{
    display:flex;
    justify-content:center;
    gap:10px;
    align-items:center;
}
/* 水晶钻石胶囊按钮 */
.control-btn{
    border-radius: 999px;
    background: linear-gradient(135deg, #ffe6f2, #e6f4ff);
    color:#333;
    font-size:16px;
    cursor:pointer;
    padding:8px 14px;
    backdrop-filter: blur(4px);
    transition: all 0.12s ease;
}
.control-btn:active{
    transform: translateY(2px);
}
.control-btn.play-main{
 padding:8px 22px;
    background: linear-gradient(145deg, #ffb4d8, #9cd4ff);
    color:#111;
}

.lyric-area{
    text-align: center;
 font-size: 18px;
    color: #333;
    margin-top: 8px;
    line-height: 2;
    padding:10px;
    min-height:110px;
}
.lyric-normal{color:#666;}
.lyric-active{color:#ff4488;font-weight:bold;}

/* =========【酷狗样式悬浮歌词】========= */
.float-lyric-wrap{
    position: fixed;
    bottom: 170px;
    left: 30px;
    min-width:260px;
    min-height:110px;
    width:380px;
    z-index:9999;
    cursor:move;
    user-select:none;
    overflow:hidden;
    display:block;
    padding:12px 16px;
    border-radius:14px;
    background: transparent;
    transition: all 0.25s ease;
}
.float-lyric-wrap:hover{
    background:rgba(255,255,255,0.35);
    backdrop-filter: blur(4px);
}
.lyric-line{
    padding:8px 14px;
    margin:6px 0;
    border-radius:12px;
    background:transparent;
    font-size:clamp(18px,2.2vw,28px);
    letter-spacing:2px;
    text-shadow:0 0 6px rgba(255,180,220,0.55);
}
.prev-line{
    color:#222;
    opacity:0.55;
    text-align:left;
}
.curr-line{
    text-align:right;
}
</style>
</head>
<body>
<div class="main-title">步丝丝《朝歌》</div>

<div class="nav-bar">
    <button class="nav-btn active" data-type="all">首页 Home</button>
<button class="nav-btn" data-type="music">音乐 Music</button>
    <button class="nav-btn" data-type="video">视频 Video</button>
    <button class="nav-btn" data-type="image">图片</button>
    <button class="nav-btn" data-type="reward">赞赏</button>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="搜索歌曲名、歌手">
    <button id="searchBtn">搜索 Search</button>
</div>

<div class="main-wrap">
    <div class="left-card-area">
        <div class="card-wrap" id="cardContainer">
            <div class="load-tip">正在加载资源，请稍等...</div>
        </div>
    </div>
</div>

<!-- 右侧悬浮播放器窗口 -->
<div class="right-big-container" id="floatWindow">
    <div class="drag-handle" id="dragHandle">
        <button class="minimize-win-btn" id="minWinBtn">−</button>
    </div>
    <div class="resize-handle resize-t" data-dir="t"></div>
    <div class="resize-handle resize-b" data-dir="b"></div>
    <div class="resize-handle resize-l" data-dir="l"></div>
    <div class="resize-handle resize-r" data-dir="r"></div>
    <div class="resize-handle resize-lt" data-dir="lt"></div>
    <div class="resize-handle resize-rt" data-dir="rt"></div>
    <div class="resize-handle resize-lb" data-dir="lb"></div>
    <div class="resize-handle resize-rb" data-dir="rb"></div>

    <div class="playlist-sidebar" id="playlistSide">
        <div class="sidebar-head">
            <h4>播放目录</h4>
            <button class="hideSideBtn" id="hideSideBtn">收起</button>
        </div>
        <div class="playlist-scroll" id="playlistScroll"></div>
    </div>

    <div class="player-window">
        <div class="video-container">
            <video id="mainVideo" preload="auto" playsinline webkit-playsinline></video>
            <button class="fullscreen-video-btn" id="videoFullBtn">全屏</button>
        </div>
</div>
</div>

<!-- 底部播放器：最终布局 -->
<div class="bottom-player">
    <div class="inner-row">
 <!-- 左侧：播放目录切换按钮 + 播放控制 -->
        <div class="left-control-group">
            <button class="control-btn" id="togglePlaylistBtn">目录</button>
            <div class="player-control-row">
                <button class="control-btn" id="prevBtn">◀◀</button>
                <button class="control-btn" id="rewindBtn">◀</button>
                <button class="control-btn play-main" id="playPauseBtn">▶</button>
                <button class="control-btn" id="forwardBtn">▶</button>
                <button class="control-btn" id="nextBtn">▶▶</button>
 </div>
        </div>
        <!-- 中间：进度条+时间 -->
        <div class="mid-progress-area">
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-row">
                <span id="currentTimeText">00:00</span>
                <span id="totalTimeText">00:00</span>
            </div>
        </div>
<!-- 右侧：打开播放器按钮（和进度条水平平齐） -->
        <div class="right-control-group">
            <button class="control-btn" id="openFloatWinBtn">播放器</button>
            <button class="control-btn" id="lyricToggleBtn">悬浮歌词</button>
        </div>
    </div>
</div>

<!-- 悬浮歌词容器 -->
<div class="float-lyric-wrap" id="floatLyricWrap" style="display: none;">
    <div class="lyric-line prev-line" id="prevLyricLine">--</div>
    <div class="lyric-line curr-line lyric-active" id="currLyricLine">等待播放</div>
</div>

<script>
// ==================== 全局接口配置（全量对齐后端接口）====================
const API_BASE_URL = "http://localhost:8080/api";
const API = {
    // 首页资源接口
    getAllResource: `${API_BASE_URL}/resource/all`,
    getMusicResource: `${API_BASE_URL}/resource/music`,
    getVideoResource: `${API_BASE_URL}/resource/video`,
    getImageResource: `${API_BASE_URL}/resource/image`,
    // 搜索接口
    searchResource: `${API_BASE_URL}/resource/search`,
    // 歌曲播放、歌词接口
    getMusicUrl: `${API_BASE_URL}/music/url`,
    getMusicLyric: `${API_BASE_URL}/music/lyric`
};

// ==================== 全局变量 ====================
let currentMusicList = [];
let currentPlayIndex = -1;
let lyricList = [];
let lyricTimer = null;
let floatLyricShow = false;

// DOM节点
const cardContainer = document.getElementById('cardContainer');
const playlistScroll = document.getElementById('playlistScroll');
const mainVideo = document.getElementById('mainVideo');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const currentTimeText = document.getElementById('currentTimeText');
const totalTimeText = document.getElementById('totalTimeText');
const playPauseBtn = document.getElementById('playPauseBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const rewindBtn = document.getElementById('rewindBtn');
const forwardBtn = document.getElementById('forwardBtn');
const searchBtn = document.getElementById('searchBtn');
const searchInput = document.getElementById('searchInput');
const navBtns = document.querySelectorAll('.nav-btn');
const floatWindow = document.getElementById('floatWindow');
const minWinBtn = document.getElementById('minWinBtn');
const openFloatWinBtn = document.getElementById('openFloatWinBtn');
const videoFullBtn = document.getElementById('videoFullBtn');
const hideSideBtn = document.getElementById('hideSideBtn');
const playlistSide = document.getElementById('playlistSide');
const togglePlaylistBtn = document.getElementById('togglePlaylistBtn');
const floatLyricWrap = document.getElementById('floatLyricWrap');
const lyricToggleBtn = document.getElementById('lyricToggleBtn');
const prevLyricLine = document.getElementById('prevLyricLine');
const currLyricLine = document.getElementById('currLyricLine');

// ==================== 工具函数 ====================
// 时间格式化
function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    let m = Math.floor(seconds / 60);
    let s = Math.floor(seconds % 60);
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

// 接口请求封装
async function request(url, params = {}) {
    const query = new URLSearchParams(params).toString();
    const res = await fetch(query ? `${url}?${query}` : url);
    return await res.json();
}

// ==================== 核心页面渲染接口 ====================
// 加载首页资源
async function loadResource(type = 'all') {
    cardContainer.innerHTML = '<div class="load-tip">正在加载资源，请稍等...</div>';
    let res;
    try {
        switch (type) {
            case 'all': res = await request(API.getAllResource); break;
            case 'music': res = await request(API.getMusicResource); break;
            case 'video': res = await request(API.getVideoResource); break;
            case 'image': res = await request(API.getImageResource); break;
            default: res = await request(API.getAllResource);
        }
        if (res.code === 200 && res.data) {
            renderCardList(res.data);
            currentMusicList = res.data.filter(item => item.type === 'music');
            renderPlaylist();
        } else {
            cardContainer.innerHTML = '<div class="load-tip">资源加载失败</div>';
        }
    } catch (err) {
        cardContainer.innerHTML = '<div class="load-tip">接口请求异常，请检查后端服务</div>';
        console.error("资源加载接口异常：", err);
    }
}

// 渲染资源卡片
function renderCardList(list) {
    if (!list || list.length === 0) {
        cardContainer.innerHTML = '<div class="load-tip">暂无资源数据</div>';
        return;
    }
    let html = '';
    list.forEach((item, index) => {
        html += `
 <div class="music-card" data-index="${index}" data-id="${item.id}" data-type="${item.type}">
            <div class="cover-box">
                <img src="${item.cover || 'https://picsum.photos/200/200'}" alt="封面">
            </div>
            <div class="card-text">
                <div>${item.name || '未知资源'}</div>
 <small>${item.author || '未知作者'}</small>
            </div>
        </div>
        `;
    });
    cardContainer.innerHTML = html;

    // 绑定卡片点击播放事件
    document.querySelectorAll('.music-card').forEach(card => {
        card.addEventListener('click', () => {
            const idx = parseInt(card.dataset.index);
            playMedia(idx, list[idx]);
        });
    });
}

// 渲染播放列表
function renderPlaylist() {
    if (!currentMusicList.length) {
        playlistScroll.innerHTML = '<div class="load-tip" style="font-size:12px;padding:20px 0">暂无播放曲目</div>';
        return;
    }
    let html = '';
    currentMusicList.forEach((item, index) => {
        html += `
        <div class="playlist-item ${index === currentPlayIndex ? 'active' : ''}" data-index="${index}">
            <div class="item-name">${item.name}</div>
            <div class="item-del" data-del="${index}">×</div>
        </div>
        `;
    });
    playlistScroll.innerHTML = html;

    // 列表点击播放
    document.querySelectorAll('.playlist-item').forEach(item => {
        item.addEventListener('click', (e) => {
            if (e.target.classList.contains('item-del')) return;
            const idx = parseInt(item.dataset.index);
            playMedia(idx, currentMusicList[idx]);
        });
    });

    // 删除单曲
    document.querySelectorAll('.item-del').forEach(del => {
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(del.dataset.del);
            currentMusicList.splice(idx, 1);
            if (currentPlayIndex === idx) currentPlayIndex = -1;
            renderPlaylist();
        });
    });
}

// ==================== 播放核心接口 ====================
async function playMedia(index, item) {
    if (!item) return;
    currentPlayIndex = index;
    renderPlaylist();
    try {
        // 获取播放地址
        const urlRes = await request(API.getMusicUrl, { id: item.id });
        if (urlRes.code !== 200 || !urlRes.data.url) {
            alert("暂无播放资源");
            return;
        }
        mainVideo.src = urlRes.data.url;
        mainVideo.play();
        playPauseBtn.innerText = '❚❚';

        // 获取歌词
        const lyricRes = await request(API.getMusicLyric, { id: item.id });
        lyricList = lyricRes.code === 200 ? lyricRes.data : [];
        startLyricScroll();
    } catch (err) {
        console.error("播放接口异常：", err);
        alert("播放失败，请重试");
    }
}

// ==================== 歌词滚动逻辑 ====================
function startLyricScroll() {
    clearInterval(lyricTimer);
    if (!lyricList.length) {
        currLyricLine.innerText = "暂无歌词";
        prevLyricLine.innerText = "--";
        return;
    }
    lyricTimer = setInterval(() => {
        const currentTime = mainVideo.currentTime;
        let curr = lyricList.findIndex((item, idx) => {
            return currentTime >= item.time && (!lyricList[idx+1] || currentTime < lyricList[idx+1].time);
        });
        if (curr !== -1) {
            prevLyricLine.innerText = lyricList[curr-1]?.content || "";
            currLyricLine.innerText = lyricList[curr].content;
        }
    }, 300);
}

// ==================== 进度条、时间更新 ====================
mainVideo.addEventListener('timeupdate', () => {
    const percent = (mainVideo.currentTime / mainVideo.duration) * 100 || 0;
    progressBar.style.width = percent + '%';
    currentTimeText.innerText = formatTime(mainVideo.currentTime);
    totalTimeText.innerText = formatTime(mainVideo.duration);
});

// 进度条拖拽跳转
progressWrap.addEventListener('click', (e) => {
    const offset = e.offsetX;
    const width = progressWrap.clientWidth;
    mainVideo.currentTime = (offset / width) * mainVideo.duration;
});

// 播放结束自动下一首
mainVideo.addEventListener('ended', () => {
    nextBtn.click();
});

// ==================== 播放控制事件 ====================
// 暂停/播放
playPauseBtn.addEventListener('click', () => {
    if (!mainVideo.src) return;
    if (mainVideo.paused) {
        mainVideo.play();
        playPauseBtn.innerText = '❚❚';
    } else {
        mainVideo.pause();
        playPauseBtn.innerText = '▶';
    }
});

// 上一首
prevBtn.addEventListener('click', () => {
    if (!currentMusicList.length) return;
    let idx = currentPlayIndex - 1;
    if (idx < 0) idx = currentMusicList.length - 1;
    playMedia(idx, currentMusicList[idx]);
});

// 下一首
nextBtn.addEventListener('click', () => {
    if (!currentMusicList.length) return;
    let idx = currentPlayIndex + 1;
    if (idx >= currentMusicList.length) idx = 0;
    playMedia(idx, currentMusicList[idx]);
});

// 快进/快退 5秒
rewindBtn.addEventListener('click', () => mainVideo.currentTime -= 5);
forwardBtn.addEventListener('click', () => mainVideo.currentTime += 5);

// ==================== 搜索接口事件 ====================
searchBtn.addEventListener('click', async () => {
    const key = searchInput.value.trim();
    if (!key) return alert("请输入搜索内容");
    cardContainer.innerHTML = '<div class="load-tip">搜索中...</div>';
    try {
        const res = await request(API.searchResource, { key: key });
        if (res.code === 200) {
            renderCardList(res.data);
            currentMusicList = res.data.filter(item => item.type === 'music');
            renderPlaylist();
        } else {
            cardContainer.innerHTML = '<div class="load-tip">暂无搜索结果</div>';
        }
    } catch (err) {
        cardContainer.innerHTML = '<div class="load-tip">搜索接口异常</div>';
    }
});

searchInput.addEventListener('keydown', (e) => e.key === 'Enter' && searchBtn.click());

// ==================== 导航分类接口 ====================
navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        navBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadResource(btn.dataset.type);
    });
});

// ==================== 页面控件交互 ====================
// 最小化播放器
minWinBtn.addEventListener('click', () => floatWindow.classList.add('minimize-state'));
// 打开播放器
openFloatWinBtn.addEventListener('click', () => floatWindow.classList.remove('minimize-state'));
// 视频全屏
videoFullBtn.addEventListener('click', () => {
    if (mainVideo.requestFullscreen) mainVideo.requestFullscreen();
});
// 收起/展开播放列表
let sideHide = false;
hideSideBtn.addEventListener('click', () => {
    sideHide = !sideHide;
    playlistSide.style.width = sideHide ? '0' : '38%';
    hideSideBtn.innerText = sideHide ? '展开' : '收起';
});
togglePlaylistBtn.addEventListener('click', () => hideSideBtn.click());

// 悬浮歌词开关
lyricToggleBtn.addEventListener('click', () => {
    floatLyricShow = !floatLyricShow;
    floatLyricWrap.style.display = floatLyricShow ? 'block' : 'none';
    lyricToggleBtn.innerText = floatLyricShow ? '关闭歌词' : '悬浮歌词';
});

// 页面初始化加载
window.onload = () => {
    loadResource('all');
};
</script>

</body>
</html>
