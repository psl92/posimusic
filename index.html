<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
.main-title{
    text-align: center;
    padding:20px 0 12px;
    font-size:42px;
    color:#224477;
}
.top-tab{
    display:flex;
    gap:8px;
    padding:12px 20px;
}
.tab-btn{
    padding:8px 16px;
    border-radius:8px;
    background:#ffffff;
    cursor:pointer;
}
.search-wrap{
    display:flex;
    gap:6px;
    padding:0 20px 16px;
}
#search-input{
    flex:1;
    padding:8px 12px;
    border-radius:6px;
    border:1px solid #ccc;
}
#search-btn{
    padding:8px 14px;
    background:#4088ee;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.content-wrap{
    padding:0 20px;
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(140px,1fr));
    gap:14px;
}
.item-card{
    background:#fff;
    border-radius:10px;
    padding:10px;
    cursor:pointer;
}
.item-card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:6px;
    background:#eee;
}
.player-box{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    width:90%;
    max-width:600px;
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 12px #00000022;
}
audio,video{
    width:100%;
}
.lyric-box{
    margin-top:8px;
    max-height:100px;
    overflow:auto;
    font-size:14px;
    color:#444;
}
</style>
</head>
<body>
<div class="main-title">《朝歌》</div>
<div class="top-tab">
    <div class="tab-btn" data-type="music">音乐</div>
    <div class="tab-btn" data-type="video">视频</div>
    <div class="tab-btn" data-type="images">图片</div>
</div>
<div class="search-wrap">
    <input id="search-input" placeholder="搜索歌曲、歌手">
    <button id="search-btn">搜索</button>
</div>
<div class="content-wrap" id="content"></div>

<div class="player-box">
    <div id="media-container"></div>
    <div class="lyric-box" id="lyric-dom">暂无歌词</div>
</div>

<script>
const WORKER_HOST = "https://api.busisi.com";
let allFileList = [];
let currentSongName = "";

function getResourceUrl(fileKey){
    return `${WORKER_HOST}/r2?path=${encodeURIComponent(fileKey)}`
}

async function loadAllFiles(){
    try{
        const res = await fetch(`${WORKER_HOST}/list`);
        allFileList = await res.json();
        renderList("music");
    }catch(e){
        console.error("读取文件列表失败",e);
    }
}

function renderList(typeKey){
    const dom = document.getElementById("content");
    dom.innerHTML = "";
    const filterArr = allFileList.filter(item=> item.startsWith(typeKey+"/"));
    filterArr.forEach(key=>{
        let fileName = key.split("/")[1];
        let card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
            <img src="" alt="封面">
            <div>${fileName}</div>
        `;
        card.onclick = ()=>playMedia(key,fileName);
        dom.appendChild(card);

        let baseName = fileName.split(".")[0];
        let coverKey = allFileList.find(f=>{
            const fn = f.split("/")[1];
            return f.startsWith("images/") && fn.split(".")[0] === baseName;
        });
        if(coverKey){
            card.querySelector("img").src = getResourceUrl(coverKey);
        }
    })
}

async function playMedia(fileKey,fileName){
    currentSongName = fileName.split(".")[0];
    const mediaDom = document.getElementById("media-container");
    mediaDom.innerHTML = "";
    let mediaUrl = getResourceUrl(fileKey);

    if(fileKey.startsWith("music/")){
        let audio = document.createElement("audio");
        audio.controls = true;
        audio.preload="auto";
        audio.src = mediaUrl;
        mediaDom.appendChild(audio);
    }else if(fileKey.startsWith("video/")){
        let video = document.createElement("video");
        video.controls = true;
        video.preload="auto";
        video.src = mediaUrl;
        mediaDom.appendChild(video);
    }
    await loadLyric(currentSongName);
}

async function loadLyric(songBase){
    const lyricDom = document.getElementById("lyric-dom");
    lyricDom.innerText = "加载歌词...";
    let lyricKey = allFileList.find(f=>{
        const fn = f.split("/")[1];
        return f.startsWith("lyric/") && fn.split(".")[0] === songBase;
    });
    if(!lyricKey){
        lyricDom.innerText = "暂无歌词";
        return;
    }
    try{
        const res = await fetch(getResourceUrl(lyricKey));
        const text = await res.text();
        lyricDom.innerText = text;
    }catch(err){
        lyricDom.innerText = "歌词读取失败";
    }
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick=()=>{
        renderList(btn.dataset.type);
    }
})

document.getElementById("search-btn").onclick=()=>{
    let kw = document.getElementById("search-input").value.trim().toLowerCase();
    const dom = document.getElementById("content");
    dom.innerHTML = "";
    const filterArr = allFileList.filter(item=>{
        const name = item.split("/")[1].toLowerCase();
        return name.includes(kw);
    });
    filterArr.forEach(key=>{
        let fileName = key.split("/")[1];
        let card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `<img src="" alt="封面"><div>${fileName}</div>`;
        card.onclick = ()=>playMedia(key,fileName);
        dom.appendChild(card);
        let baseName = fileName.split(".")[0];
        let coverKey = allFileList.find(f=>{
            const fn = f.split("/")[1];
            return f.startsWith("images/") && fn.split(".")[0] === baseName;
        });
        if(coverKey) card.querySelector("img").src = getResourceUrl(coverKey);
    })
}

loadAllFiles();
</script>
</body>
</html>
