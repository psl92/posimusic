<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #a8e0ff 0%, #e0f4ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 140px;
    position: relative;
}
body::before{
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.7) 0%, transparent 10%),
        radial-gradient(circle at 30% 10%, rgba(160,120,255,0.5) 0%, transparent 12%),
        radial-gradient(circle at 70% 40%, rgba(100,180,255,0.4) 0%, transparent 15%);
    pointer-events: none;
    z-index: 0;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    color: #1a4b80;
    text-shadow: 0 0 8px #84c8ff;
    position: relative;
    z-index: 1;
}
/* 主容器 左右2:1布局 */
.wrap-main{
    display: flex;
    width: 96%;
    margin: 0 auto;
    gap: 16px;
    position: relative;
    z-index: 1;
}
/* 左侧播放器区域 2/3 */
.player-box{
    width: 66.66%;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 30px;
    box-shadow: 0 0 20px rgba(120,180,255,0.25);
}
/* 右侧播放列表 1/3 */
.playlist-box{
    width: 33.33%;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 20px;
    box-shadow: 0 0 20px rgba(120,180,255,0.25);
    max-height: 70vh;
    overflow-y: auto;
}
.playlist-box h3{
    color: #1a4b80;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(100,160,255,0.3);
    padding-bottom: 8px;
}
.song-item{
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: 0.2s;
    color: #193b63;
}
.song-item:hover{
    background: rgba(130,190,255,0.35);
}
.song-item.active{
    background: rgba(80,160,255,0.45);
    font-weight: bold;
}
/* 胶囊水晶按钮样式 全局统一 */
.btn-capsule{
    padding: 9px 22px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg,#40a0ff,#945bff);
    color: #fff;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(80,140,255,0.4);
    cursor: pointer;
    transition: 0.25s;
}
.btn-capsule:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(80,140,255,0.55);
}
/* 底部播放控制栏 */
.bottom-control{
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: rgba(10,30,60,0.75);
    backdrop-filter: blur(16px);
    padding: 18px 30px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 99;
}
.progress-wrap{
    flex: 1;
}
#progress-bar{
    width: 100%;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.2);
    outline: none;
    cursor: pointer;
}
/* 悬浮歌词窗口 */
.lyric-window{
    position: fixed;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 14px;
    z-index: 98;
    cursor: default;
    user-select: none;
}
.lyric-window:hover{
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.35);
}
.lyric-text{
    font-size: 24px;
    color: #fff;
    text-shadow: 0 0 6px #000;
    text-align: center;
}
/* 播放器封面区域 */
.cover-area{
    width: 220px;
    height: 220px;
    background: rgba(0,0,0,0.15);
    border-radius: 16px;
    margin: 0 auto 24px;
    overflow: hidden;
}
.cover-area img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.song-name{
    text-align: center;
    font-size: 26px;
    color: #15355c;
    margin-bottom: 20px;
}
</style>
</head>
<body>
<h1 class="main-title">步丝丝音乐播放器</h1>

<div class="wrap-main">
    <!-- 左侧播放器 2/3 -->
    <div class="player-box">
        <div class="cover-area" id="coverBox">
            <img src="" id="songCover" alt="歌曲封面">
        </div>
        <h2 class="song-name" id="songName">未播放歌曲</h2>
        <div style="text-align:center;gap:12px;display:flex;justify-content:center;">
            <button class="btn-capsule" id="prevBtn">上一曲</button>
            <button class="btn-capsule" id="playBtn">播放</button>
            <button class="btn-capsule" id="nextBtn">下一曲</button>
            <button class="btn-capsule" id="lyricToggle">悬浮歌词</button>
        </div>
    </div>

    <!-- 右侧播放列表 1/3 -->
    <div class="playlist-box">
        <h3>歌曲列表（自动读取Worker资源）</h3>
        <div id="songList"></div>
    </div>
</div>

<!-- 底部控制栏 -->
<div class="bottom-control">
    <button class="btn-capsule" id="playMini">播放/暂停</button>
    <div class="progress-wrap">
        <input type="range" min="0" max="100" value="0" id="progress-bar">
    </div>
    <span id="timeText">00:00 / 00:00</span>
</div>

<!-- 悬浮歌词窗口 -->
<div class="lyric-window" id="lyricWin" style="display:none;">
    <div class="lyric-text" id="currLyric">暂无歌词</div>
</div>

<audio id="audioPlayer">

<script>
// ========== 配置项 替换成你自己的Worker接口地址 ==========
const WORKER_API = "https://api.busisi.com";
// R2桶文件夹划分
const PATH_MUSIC = "/music/";
const PATH_LYRIC = "/lyric/";
const PATH_COVER = "/cover/";

// 全局变量
let audio = document.getElementById("audioPlayer");
let songListDom = document.getElementById("songList");
let progressBar = document.getElementById("progress-bar");
let timeText = document.getElementById("timeText");
let playBtn = document.getElementById("playBtn");
let playMini = document.getElementById("playMini");
let prevBtn = document.getElementById("prevBtn");
let nextBtn = document.getElementById("nextBtn");
let lyricToggle = document.getElementById("lyricToggle");
let lyricWin = document.getElementById("lyricWin");
let currLyric = document.getElementById("currLyric");
let songNameDom = document.getElementById("songName");
let songCoverDom = document.getElementById("songCover");

let allSong = [];
let nowIndex = 0;
let lyricShow = false;

// 1. 初始化拉取Worker内全部音乐列表
async function loadAllMusic() {
    try {
        let res = await fetch(`${WORKER_API}/listMusic`);
        let data = await res.json();
        allSong = data.list;
        renderSongList();
    } catch(err) {
        songListDom.innerHTML = "<div style='color:#c00;'>加载歌曲失败，请检查Worker接口</div>";
        console.error("加载音乐列表错误：",err);
    }
}

// 渲染右侧播放列表
function renderSongList() {
    songListDom.innerHTML = "";
    allSong.forEach((item,idx)=>{
        let div = document.createElement("div");
        div.className = "song-item";
        div.innerText = item.name;
        div.dataset.index = idx;
        div.onclick = ()=> playSong(idx);
        songListDom.appendChild(div);
    })
}

// 播放指定歌曲，自动匹配歌词、封面
async function playSong(index) {
    nowIndex = index;
    let song = allSong[index];
    // 重置播放列表激活样式
    document.querySelectorAll(".song-item").forEach(d=>d.classList.remove("active"));
    document.querySelector(`.song-item[data-index="${index}"]`).classList.add("active");

    // 加载音频
    audio.src = `${WORKER_API}${PATH_MUSIC}${song.file}`;
    songNameDom.innerText = song.name;

    // 加载封面
    songCoverDom.src = `${WORKER_API}${PATH_COVER}${song.name}.jpg`;

    // 加载同名歌词 lrc/krc
    loadLyric(song.name);

    audio.play();
    playBtn.innerText = "暂停";
}

// 读取对应歌名歌词文件
async function loadLyric(songName) {
    try{
        let lyricRes = await fetch(`${WORKER_API}${PATH_LYRIC}${songName}.lrc`);
        if(!lyricRes.ok) throw new Error("无lrc歌词");
        let lyricText = await lyricRes.text();
        parseLyric(lyricText);
    }catch(e){
        currLyric.innerHTML = "<span>暂无匹配歌词</span>";
    }
}

let lyricArr = [];
// 解析lrc歌词
function parseLyric(lrcText) {
    lyricArr = [];
    let reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
    let match;
    while((match = reg.exec(lrcText))!==null){
        let min = Number(match[1]);
        let sec = Number(match[2]);
        let ms = Number(match[3]);
        let time = min*60 + sec + ms/1000;
        lyricArr.push({time,text:match[4]});
    }
    lyricArr.sort((a,b)=>a.time - b.time);
}

// 同步歌词播放
audio.addEventListener("timeupdate",()=>{
    let curTime = audio.currentTime;
    // 更新进度条
    let percent = (curTime / audio.duration)*100 || 0;
    progressBar.value = percent;
    // 时间格式化
    timeText.innerText = formatTime(curTime)+" / "+formatTime(audio.duration||0);

    // 匹配当前歌词
    let showText = "暂无歌词";
    for(let i=0;i<lyricArr.length;i++){
        if(lyricArr[i].time <= curTime){
            showText = lyricArr[i].text;
        }else break;
    }
    currLyric.innerText = showText;
})

// 进度条跳转
progressBar.addEventListener("input",()=>{
    let target = (progressBar.value / 100) * audio.duration;
    audio.currentTime = target;
})

// 格式化秒数为 00:00
function formatTime(s) {
    if(isNaN(s)) return "00:00";
    let m = Math.floor(s/60);
    let ss = Math.floor(s%60);
    return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}

// 播放暂停切换
function togglePlay() {
    if(audio.paused){
        audio.play();
        playBtn.innerText = "暂停";
        playMini.innerText = "暂停";
    }else{
        audio.pause();
        playBtn.innerText = "播放";
        playMini.innerText = "播放";
    }
}
playBtn.onclick = togglePlay;
playMini.onclick = togglePlay;

// 上一曲
prevBtn.onclick = ()=>{
    if(allSong.length===0)return;
    nowIndex = nowIndex <=0 ? allSong.length-1 : nowIndex-1;
    playSong(nowIndex);
}
// 下一曲
nextBtn.onclick = ()=>{
    if(allSong.length===0)return;
    nowIndex = nowIndex >= allSong.length-1 ? 0 : nowIndex+1;
    playSong(nowIndex);
}

// 悬浮歌词开关
lyricToggle.onclick = ()=>{
    lyricShow = !lyricShow;
    lyricWin.style.display = lyricShow ? "block" : "none";
}

// 歌词窗口拖拽
let drag = false, offsetX, offsetY;
lyricWin.addEventListener("mousedown",e=>{
    drag = true;
    offsetX = e.clientX - lyricWin.offsetLeft;
    offsetY = e.clientY - lyricWin.offsetTop;
    lyricWin.style.transform = "none";
})
document.addEventListener("mousemove",e=>{
    if(!drag)return;
    lyricWin.style.left = (e.clientX - offsetX)+"px";
    lyricWin.style.top = (e.clientY - offsetY)+"px";
})
document.addEventListener("mouseup",()=>drag=false);

// 歌曲播放结束自动下一首
audio.addEventListener("ended",()=>{
    nextBtn.click();
})

// 页面加载完成自动读取Worker音乐列表
window.onload = loadAllMusic;
</script>
</body>
</html>
