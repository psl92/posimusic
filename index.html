<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粉水晶音乐前台</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #b9e6ff 0%, #e6f5ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    background-image: radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
    background-size: 40px 40px;
}
/* 漂浮星光粒子 */
.star{
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{
    0%,100%{opacity:0.3}
    50%{opacity:1}
}
/* 顶部导航 */
.nav-wrap{
    width: 100%;
    padding: 24px 40px 16px;
    display: flex;
    align-items: center;
    gap:12px;
    flex-wrap: wrap;
}
.nav-title{
    width: 100%;
    text-align: center;
    font-size: 34px;
    color: #165ea8;
    font-weight: bold;
    margin-bottom:16px;
}
/* 水晶胶囊导航按钮 */
.nav-btn{
    border-radius: 999px;
    border:1px solid rgba(80,180,255,0.6);
    background: linear-gradient(180deg, rgba(185,232,255,0.38), rgba(125,202,255,0.2));
    box-shadow: 0 0 12px rgba(95,188,255,0.28), inset 0 3px 7px rgba(255,255,255,0.5);
    color:#155ba5;
    padding:10px 22px;
    cursor: pointer;
    transition:0.2s;
    font-size:15px;
}
.nav-btn.active{
    background: linear-gradient(180deg, rgba(120,210,255,0.55), rgba(70,175,255,0.35));
    box-shadow:0 0 18px rgba(80,180,255,0.45);
}
.nav-btn:hover{
    box-shadow:0 0 20px rgba(95,188,255,0.48);
}
/* 搜索栏 */
.search-row{
    width: calc(100% - 80px);
    margin:0 40px 20px;
    display:flex;
    gap:12px;
    align-items:center;
}
.search-input{
    flex:1;
    border-radius:999px;
    border:1px solid rgba(80,180,255,0.45);
    background: rgba(255,255,255,0.35);
    padding:10px 20px;
    outline:none;
    font-size:15px;
}
.search-btn{
    border-radius:999px;
    border:1px solid rgba(80,180,255,0.6);
    background: linear-gradient(180deg, rgba(185,232,255,0.38), rgba(125,202,255,0.2));
    box-shadow: 0 0 12px rgba(95,188,255,0.28), inset 0 3px 7px rgba(255,255,255,0.5);
    color:#155ba5;
    padding:10px 24px;
    cursor: pointer;
    white-space: nowrap;
}
/* 主体双栏布局 */
.main-wrap{
    display:flex;
    padding:0 40px 30px;
    gap:24px;
    align-items:flex-start;
}
/* 左侧卡片区域 一行5列 纵向滚动 */
.left-card-area{
    flex:1;
    height: 460px;
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap:16px;
    padding:8px;
}
/* 滚动条美化水晶风格 */
.left-card-area::-webkit-scrollbar{
    width:8px;
}
.left-card-area::-webkit-scrollbar-thumb{
    background:rgba(80,180,255,0.35);
    border-radius:999px;
}
.song-card{
    border-radius:14px;
    border:1px solid rgba(80,180,255,0.55);
    background:linear-gradient(180deg, rgba(185,232,255,0.35), rgba(125,202,255,0.18));
    box-shadow:0 0 12px rgba(95,188,255,0.25), inset 0 3px 7px rgba(255,255,255,0.45);
    padding:14px 8px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}
.song-card:hover{
    transform:translateY(-4px);
    box-shadow:0 0 20px rgba(80,180,255,0.4);
}
.card-title{
    color:#155ba5;
    font-size:14px;
    margin-top:8px;
}
.card-singer{
    color:#3478b8;
    font-size:12px;
    margin-top:4px;
}
/* 右侧播放目录+播放器容器 */
.right-wrap{
    width: 520px;
    display:flex;
    flex-direction:column;
    gap:20px;
}
/* 播放目录面板 */
.playlist-panel{
    height:460px;
    border-radius:16px;
    border:2px solid rgba(80,180,255,0.5);
    background:linear-gradient(180deg, rgba(185,232,255,0.28), rgba(125,202,255,0.12));
    box-shadow:0 0 16px rgba(95,188,255,0.22), inset 0 0 10px rgba(255,255,255,0.35);
    padding:16px;
    overflow-y:auto;
}
.playlist-panel::-webkit-scrollbar{
    width:8px;
}
.playlist-panel::-webkit-scrollbar-thumb{
    background:rgba(80,180,255,0.35);
    border-radius:999px;
}
.playlist-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}
.playlist-title{
    color:#155ba5;
    font-weight:bold;
}
.close-mini{
    border-radius:999px;
    border:1px solid rgba(80,180,255,0.5);
    background:rgba(255,255,255,0.2);
    padding:4px 10px;
    cursor:pointer;
    color:#155ba5;
    font-size:12px;
}
.playlist-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:8px;
    background:rgba(200,235,255,0.22);
    border:1px solid rgba(80,180,255,0.35);
    color:#155ba5;
}
.del-item{
    width:24px;
    height:24px;
    border-radius:50%;
    border:none;
    background:rgba(255,120,120,0.25);
    color:#c83c3c;
    cursor:pointer;
}
/* 播放器面板 */
.player-box{
    border-radius:16px;
    border:2px solid rgba(80,180,255,0.5);
    background:linear-gradient(180deg, rgba(185,232,255,0.28), rgba(125,202,255,0.12));
    box-shadow:0 0 16px rgba(95,188,255,0.22), inset 0 0 10px rgba(255,255,255,0.35);
    padding:16px;
    resize:both;
    overflow:hidden;
    min-width:420px;
    min-height:420px;
    max-width:95vw;
    max-height:85vh;
    position:relative;
}
.player-top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}
.player-tag{
    color:#155ba5;
    font-size:14px;
}
.top-ctrl-group{
    display:flex;
    gap:8px;
}
.top-ctrl-btn{
    width:28px;
    height:28px;
    border-radius:8px;
    border:1px solid rgba(80,180,255,0.5);
    background:rgba(255,255,255,0.2);
    cursor:pointer;
}
/* 中间视频/封面区域 */
.media-display{
    width:100%;
    height:240px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
}
.cover-icon{
    width:120px;
    height:120px;
    border-radius:16px;
    border:2px solid rgba(80,180,255,0.55);
    background:linear-gradient(180deg, rgba(140,210,255,0.45), rgba(80,180,255,0.25));
    box-shadow:0 0 18px rgba(80,180,255,0.35), inset 0 0 12px rgba(255,255,255,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:50px;
}
video{
    width:100%;
    height:100%;
    border-radius:12px;
    object-fit:contain;
    display:none;
}
/* 底部控制栏：后退+播放+前进+进度条同行 */
.player-bottom-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.crystal-capsule-btn{
    border-radius:999px;
    border:1px solid rgba(75,175,255,0.6);
    background: linear-gradient(180deg, rgba(185,232,255,0.38), rgba(125,202,255,0.2));
    box-shadow: 0 0 12px rgba(95,188,255,0.28), inset 0 3px 7px rgba(255,255,255,0.5);
    color:#155ba5;
    padding:8px 14px;
    border:none;
    cursor: pointer;
    transition:0.2s;
    flex-shrink:0;
}
.crystal-capsule-btn:hover{
    box-shadow:0 0 20px rgba(95,188,255,0.48);
}
/* 水晶进度条 */
.crystal-progress{
    flex:1;
    height:10px;
    border-radius:999px;
    background:rgba(202,236,255,0.26);
    border:1px solid rgba(88,184,255,0.42);
    box-shadow: inset 0 0 6px rgba(80,180,255,0.22);
    cursor:pointer;
}
.crystal-progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#66c9ff,#339dff);
    box-shadow:0 0 10px rgba(80,180,255,0.52);
    width:0%;
    transition:width 0.1s linear;
}
/* 歌词面板 */
.lyric-panel{
    padding:12px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(180,230,255,0.25), rgba(120,200,255,0.12));
    border:1px solid rgba(80,180,255,0.35);
    text-align:center;
    min-height:60px;
    color:#155ba5;
}
.lyric-line{
    font-size:16px;
    line-height:26px;
}
.lyric-active{
    color:#339dff;
    font-weight:bold;
    text-shadow:0 0 6px rgba(51,157,255,0.4);
}
</style>
</head>
<body>
<!-- 生成星光粒子 -->
<script>
for(let i=0;i<80;i++){
    let s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';
    document.body.appendChild(s);
}
</script>

<div class="nav-wrap">
    <div class="nav-title">步丝丝《朝歌》</div>
    <button class="nav-btn active">首页Home</button>
    <button class="nav-btn">音乐Music</button>
    <button class="nav-btn">视频Video</button>
    <button class="nav-btn">图片</button>
    <button class="nav-btn">赞赏</button>
</div>

<div class="search-row">
    <input class="search-input" placeholder="搜索歌曲名、歌手">
    <button class="search-btn">搜索Search</button>
</div>

<div class="main-wrap">
    <!-- 左侧卡片：一行5列 纵向滚动 -->
    <div class="left-card-area">
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目1</div>
            <div class="card-singer">未知歌手</div>
        </div>
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目2</div>
            <div class="card-singer">未知歌手</div>
        </div>
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目3</div>
            <div class="card-singer">未知歌手</div>
        </div>
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目4</div>
            <div class="card-singer">未知歌手</div>
        </div>
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目5</div>
            <div class="card-singer">未知歌手</div>
        </div>
        <div class="song-card">
            <div style="width:80px;height:80px;margin:0 auto;border-radius:10px;border:1px solid rgba(80,180,255,0.4);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:#155ba5;">无封面</div>
            <div class="card-title">测试曲目6</div>
            <div class="card-singer">未知歌手</div>
        </div>
    </div>

    <div class="right-wrap">
        <!-- 播放目录 -->
        <div class="playlist-panel">
            <div class="playlist-head">
                <span class="playlist-title">播放目录</span>
                <button class="close-mini">收起</button>
            </div>
            <div class="playlist-item">
                <span>1. 盟定道义之一仙</span>
                <button class="del-item">×</button>
            </div>
            <div class="playlist-item">
                <span>2. 天地浩荡尘埃</span>
                <button class="del-item">×</button>
            </div>
            <div class="playlist-item">
                <span>3. 豆包.mp4</span>
                <button class="del-item">×</button>
            </div>
            <div class="playlist-item">
                <span>4. hua.mp4</span>
                <button class="del-item">×</button>
            </div>
        </div>

        <!-- 播放器 -->
        <div class="player-box">
            <div class="player-top-bar">
                <span class="player-tag">悬浮歌词</span>
                <div class="top-ctrl-group">
                    <button class="top-ctrl-btn" id="fullscreenBtn">⛶</button>
                    <button class="top-ctrl-btn">−</button>
                </div>
            </div>
            <div class="media-display">
                <div class="cover-icon">▶</div>
                <video id="videoPlayer"></video>
            </div>
            <!-- 底部控制栏：后退+播放+前进+进度条同行 -->
            <div class="player-bottom-bar">
                <button class="crystal-capsule-btn" id="backBtn">后退10s</button>
                <button class="crystal-capsule-btn" id="playBtn">播放</button>
                <button class="crystal-capsule-btn" id="forwardBtn">前进10s</button>
                <div class="crystal-progress" id="progressWrap">
                    <div class="crystal-progress-fill" id="progressFill"></div>
                </div>
            </div>
            <!-- 底部歌词区域 -->
            <div class="lyric-panel" id="lyricBox">
                <div class="lyric-line lyric-active">曾经各国各地灵气十足满玉花香</div>
            </div>
        </div>
    </div>
</div>

<script>
// 播放器基础交互
const video=document.getElementById('videoPlayer');
const playBtn=document.getElementById('playBtn');
const backBtn=document.getElementById('backBtn');
const forwardBtn=document.getElementById('forwardBtn');
const progressFill=document.getElementById('progressFill');
const progressWrap=document.getElementById('progressWrap');
const fullscreenBtn=document.getElementById('fullscreenBtn');

// 播放暂停切换
playBtn.addEventListener('click',()=>{
    if(video.paused){
        video.play();
        playBtn.innerText='暂停';
    }else{
        video.pause();
        playBtn.innerText='播放';
    }
});
// 快进快退
backBtn.addEventListener('click',()=>{video.currentTime-=10;});
forwardBtn.addEventListener('click',()=>{video.currentTime+=10;});
// 进度条更新
video.addEventListener('timeupdate',()=>{
    let per=(video.currentTime/video.duration)*100;
    if(!isNaN(per)) progressFill.style.width=per+'%';
});
// 点击进度条跳转
progressWrap.addEventListener('click',e=>{
    let rect=progressWrap.getBoundingClientRect();
    let clickPer=(e.clientX-rect.left)/rect.width;
    video.currentTime=clickPer*video.duration;
});
// 全屏切换
fullscreenBtn.addEventListener('click',()=>{
    if(!document.fullscreenElement){
        document.querySelector('.player-box').requestFullscreen();
    }else{
        document.exitFullscreen();
    }
});
// 卡片加入播放列表
document.querySelectorAll('.song-card').forEach(card=>{
    card.addEventListener('click',function(){
        let name=this.querySelector('.card-title').innerText;
        let item=document.createElement('div');
        item.className='playlist-item';
        item.innerHTML=`<span>${name}</span><button class="del-item">×</button>`;
        document.querySelector('.playlist-panel').appendChild(item);
        item.querySelector('.del-item').addEventListener('click',e=>{
            e.stopPropagation();
            item.remove();
        })
    })
})
// 列表删除事件委托
document.querySelector('.playlist-panel').addEventListener('click',e=>{
    if(e.target.classList.contains('del-item')){
        e.target.parentElement.remove();
    }
})
</script>
</body>
</html>
