<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
.main-title{
    text-align: center;
    padding:20px 0 12px;
    font-size:42px;
    color:#223355;
}
.wrap{
    max-width:1400px;
    margin:0 auto;
    padding:0 20px;
}
.main-layout{
    display:flex;
    gap:16px;
    margin-top:20px;
}
.player-box{
    width:66.666%;
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:24px;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 8px 30px rgba(120,90,200,0.15);
}
.list-box{
    width:33.333%;
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 8px 30px rgba(120,90,200,0.15);
    max-height:600px;
    overflow-y:auto;
}
.cover-area{
    width:220px;
    height:220px;
    border-radius:12px;
    background:#e8edf8;
    margin:0 auto 20px;
    overflow:hidden;
}
.cover-area img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.song-name-text{
    text-align:center;
    font-size:22px;
    color:#223355;
    margin-bottom:24px;
}
.btn-group{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:20px;
}
.btn{
    padding:10px 22px;
    border:none;
    border-radius:999px;
    font-size:16px;
    color:#fff;
    background:linear-gradient(145deg,#7b61ff,#4834d4);
    box-shadow: 0 4px 12px rgba(72,52,212,0.35),inset 0 1px 0 rgba(255,255,255,0.25);
    cursor:pointer;
    transition:0.2s;
}
.btn:active{
    transform:translateY(2px);
    box-shadow: 0 2px 6px rgba(72,52,212,0.35);
}
.bottom-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(14px);
    padding:14px 24px;
    border-top:1px solid rgba(255,255,255,0.7);
}
.progress-wrap{
    width:100%;
    height:8px;
    background:#ccd4ee;
    border-radius:999px;
    margin-bottom:10px;
    cursor:pointer;
}
.progress-bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#7b61ff,#4834d4);
}
.time-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#444;
}
.song-item{
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:6px;
    cursor:pointer;
    transition:0.2s;
}
.song-item:hover{
    background:rgba(123,97,255,0.12);
}
.song-item.active{
    background:rgba(123,97,255,0.22);
    color:#4834d4;
}
.lyric-float{
    position:fixed;
    left:120px;
    bottom:100px;
    padding:8px 14px;
    font-size:26px;
    color:#ffffff;
    text-shadow:0 0 8px #222;
    border:2px solid transparent;
    border-radius:10px;
    cursor:default;
    user-select:none;
    z-index:999;
}
.lyric-float:hover{
    border-color:rgba(255,255,255,0.45);
    cursor:move;
}
.lyric-normal{
    opacity:0.65;
}
.lyric-high{
    color:#ffdd44;
}
</style>
</head>
<body>
    <h1 class="main-title">步丝丝音乐播放器</h1>
    <div class="wrap">
        <div class="main-layout">
            <div class="player-box">
                <div class="cover-area">
                    <img id="songCoverDom" src="" alt="">
                </div>
                <div class="song-name-text" id="songNameDom">未选择歌曲</div>
                <div class="btn-group">
                    <button class="btn" id="playBtn">播放</button>
                    <button class="btn" id="prevBtn">上一首</button>
                    <button class="btn" id="nextBtn">下一首</button>
                </div>
            </div>
            <div class="list-box">
                <h3>歌曲列表（自动读取Worker资源）</h3>
                <div id="songListWrap">
                    <div>加载歌曲中...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-row">
            <span id="currTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <div class="lyric-float" id="currLyric">
        <span class="lyric-normal">暂无匹配歌词</span>
    </div>

    <audio id="audioDom">

<script>
const WORKER_API = "https://api.busisi.com";
const PATH_MUSIC = "/music/";
const PATH_LYRIC = "/lyric/";
const PATH_COVER = "/cover/";

const dom = {
    audioDom: document.querySelector("#audioDom"),
    songCoverDom: document.querySelector("#songCoverDom"),
    songNameDom: document.querySelector("#songNameDom"),
    playBtn: document.querySelector("#playBtn"),
    prevBtn: document.querySelector("#prevBtn"),
    nextBtn: document.querySelector("#nextBtn"),
    songListWrap: document.querySelector("#songListWrap"),
    progressWrap: document.querySelector("#progressWrap"),
    progressBar: document.querySelector("#progressBar"),
    currTime: document.querySelector("#currTime"),
    totalTime: document.querySelector("#totalTime"),
    currLyric: document.querySelector("#currLyric")
};

let allSong = [];
let nowIndex = 0;
let lyricArr = [];

async function tryLoadCover(baseUrl, name){
    const exts = ["jpg","jpeg","png","webp"];
    for(let ext of exts){
        const res = await fetch(`${baseUrl}${name}.${ext}`);
        if(res.ok){
            return `${baseUrl}${name}.${ext}`;
        }
    }
    return "";
}

async function tryLoadLyric(baseUrl, name){
    const exts = ["lrc","krc"];
    for(let ext of exts){
        const res = await fetch(`${baseUrl}${name}.${ext}`);
        if(res.ok){
            return await res.text();
        }
    }
    return null;
}

async function loadAllMusicList(){
    try{
        const res = await fetch(`${WORKER_API}/listMusic`);
        const json = await res.json();
        allSong = json.list || [];
        renderSongList();
    }catch(err){
        dom.songListWrap.innerHTML = `<div style="color:red">加载音乐列表错误：${err.message}</div>`;
    }
}

function renderSongList(){
    let html = "";
    allSong.forEach((item,idx)=>{
        html += `<div class="song-item" data-index="${idx}">${item.name}</div>`;
    });
    dom.songListWrap.innerHTML = html;
    document.querySelectorAll(".song-item").forEach(el=>{
        el.onclick = ()=>{
            const i = Number(el.dataset.index);
            playSong(i);
        }
    })
}

async function playSong(index) {
    nowIndex = index;
    let song = allSong[index];
    document.querySelectorAll(".song-item").forEach(d=>d.classList.remove("active"));
    document.querySelector(`.song-item[data-index="${index}"]`).classList.add("active");

    dom.audioDom.src = `${WORKER_API}${PATH_MUSIC}${song.file}`;
    dom.songNameDom.innerText = song.name;
    //直接使用原始中文歌名，不做encodeURIComponent
    const rawName = song.name;

    const coverSrc = await tryLoadCover(`${WORKER_API}${PATH_COVER}`,rawName);
    if(coverSrc){
        dom.songCoverDom.src = coverSrc;
    }else{
        dom.songCoverDom.src = "";
    }

    const lyricText = await tryLoadLyric(`${WORKER_API}${PATH_LYRIC}`,rawName);
    if(lyricText){
        parseLyric(lyricText);
    }else{
        dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        lyricArr = [];
    }

    try{
        await dom.audioDom.play();
        dom.playBtn.innerText = "暂停";
    }catch(err){
        dom.playBtn.innerText = "播放";
    }
}

function parseLyric(text){
    lyricArr = [];
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
    let m;
    while((m = reg.exec(text))!==null){
        const min = Number(m[1]);
        const sec = Number(m[2]);
        const ms = Number(m[3]);
        const time = min*60 + sec + ms/1000;
        lyricArr.push({time,text:m[4]});
    }
}

function updateLyric(){
    if(!lyricArr.length) return;
    const t = dom.audioDom.currentTime;
    let showText = "";
    for(let i=0;i<lyricArr.length;i++){
        if(lyricArr[i].time <= t){
            showText = lyricArr[i].text;
        }
    }
    dom.currLyric.innerHTML = `<span class="lyric-high">${showText||" "}</span>`;
}

function formatTime(s){
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

dom.audioDom.ontimeupdate = ()=>{
    const curr = dom.audioDom.currentTime;
    const total = dom.audioDom.duration||0;
    dom.progressBar.style.width = (curr/total*100 ||0)+"%";
    dom.currTime.innerText = formatTime(curr);
    dom.totalTime.innerText = formatTime(total);
    updateLyric();
}

dom.audioDom.onended = ()=>{
    nextSong();
}

dom.playBtn.onclick = ()=>{
    if(dom.audioDom.paused){
        dom.audioDom.play();
        dom.playBtn.innerText = "暂停";
    }else{
        dom.audioDom.pause();
        dom.playBtn.innerText = "播放";
    }
}

dom.prevBtn.onclick = ()=>{
    let i = nowIndex-1;
    if(i<0) i = allSong.length-1;
    playSong(i);
}

dom.nextBtn.onclick = ()=>{
    nextSong();
}
function nextSong(){
    let i = nowIndex+1;
    if(i>=allSong.length) i=0;
    playSong(i);
}

dom.progressWrap.onclick = (e)=>{
    const rect = dom.progressWrap.getBoundingClientRect();
    const per = (e.clientX - rect.left)/rect.width;
    dom.audioDom.currentTime = per * dom.audioDom.duration;
}

let drag = false,dx,dy;
dom.currLyric.onmousedown = function(e){
    drag = true;
    dx = e.clientX - dom.currLyric.offsetLeft;
    dy = e.clientY - dom.currLyric.offsetTop;
}
document.onmousemove = function(e){
    if(!drag) return;
    dom.currLyric.style.left = (e.clientX - dx)+"px";
    dom.currLyric.style.top = (e.clientY - dy)+"px";
}
document.onmouseup = ()=>drag=false;

loadAllMusicList();
</script>
</body>
</html>
