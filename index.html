<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:linear-gradient(160deg,#ffd8ee 0%,#d0edff 100%);min-height:100vh;padding-bottom:180px;}
.title{text-align:center;font-size:38px;padding:24px 0;color:#234578;}
.tab{display:flex;gap:10px;padding:0 16px 16px;}
.tab>div{padding:8px 18px;background:#fff;border-radius:8px;cursor:pointer;}
.wrap{padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
.card{background:#fff;padding:10px;border-radius:10px;cursor:pointer;}
.card img{width:100%;height:110px;object-fit:cover;background:#eee;border-radius:6px;}
.player{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:92%;max-width:620px;background:#fff;padding:14px;border-radius:12;box-shadow:0 2px 14px #00000020;}
.lyric-bottom{margin-top:10px;max-height:100px;overflow:auto;font-size:14px;color:#333;}

/* 悬浮歌词弹窗样式 */
.karaoke-win{
    position:fixed;
    left:40px;
    top:40px;
    width:520px;
    height:400px;
    background:rgba(0,0,0.82);
    border-radius:14px;
    resize:both;
    overflow:hidden;
    cursor:move;
    z-index:9999;
    display:none;
    min-width:300px;
    min-height:220px;
}
.karaoke-header{
    width:100%;
    height:42px;
    background:rgba(40,40,40,0.6);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    color:#fff;
    font-size:14px;
    cursor:move;
}
.karaoke-close{
    background:#e64545;
    border:none;
    color:#fff;
    padding:2px 8px;
    border-radius:4px;
    cursor:pointer;
}
.karaoke-content{
    width:100%;
    height:calc(100% - 42px);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:10px;
}
.kara-line{
    text-align:center;
    margin:16px 0;
    font-size:26px;
    color:#bbbbbb;
    position:relative;
    white-space:nowrap;
}
.kara-active{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    overflow:hidden;
    color:#ffdd33;
}
.open-kara-btn{
    position:fixed;
    bottom:120px;
    right:20px;
    padding:6px 12px;
    background:#22b559;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    z-index:99;
}
</style>
</head>
<body>
<div class="title">步丝丝音乐</div>
<div class="tab">
    <div data-folder="music">音乐</div>
    <div data-folder="video">视频</div>
    <div data-folder="images">图片</div>
</div>
<div class="wrap" id="box"></div>

<!-- 底部播放器 -->
<div class="player">
    <div id="mediaDom"></div>
    <div class="lyric-bottom" id="lyricDom">暂无歌词</div>
</div>

<!-- 打开悬浮歌词按钮 -->
<button class="open-kara-btn" id="openKaraBtn">打开悬浮歌词</button>

<!-- 可拖拽缩放歌词弹窗 -->
<div class="karaoke-win" id="karaWin">
    <div class="karaoke-header" id="karaDragBar">
        <span>悬浮歌词窗口(可拖动/缩放右下角)</span>
        <button class="kara-close" id="karaCloseBtn">关闭</button>
    </div>
    <div class="karaoke-content" id="karaContent"></div>
</div>

<script>
const API = "https://api.busisi.com";
let fileAll = [];
let lyricTextArr = [];
let currentTime = 0;
let dragState = {isDrag:false,startX:0,startY:0,winX:0,winY:0};

// 元素缓存
const karaWin = document.getElementById("karaWin");
const dragBar = document.getElementById("karaDragBar");
const karaContent = document.getElementById("karaContent");
const openKaraBtn = document.getElementById("openKaraBtn");
const karaCloseBtn = document.getElementById("karaCloseBtn");

// 窗口拖拽逻辑
dragBar.addEventListener("mousedown",(e)=>{
    dragState.isDrag = true;
    dragState.startX = e.clientX;
    dragState.startY = e.clientY;
    dragState.winX = karaWin.offsetLeft;
    dragState.winY = karaWin.offsetTop;
    document.body.style.userSelect = "none";
})
document.addEventListener("mousemove",(e)=>{
    if(!dragState.isDrag) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    karaWin.style.left = dragState.winX + dx + "px";
    karaWin.style.top = dragState.winY + dy + "px";
})
document.addEventListener("mouseup",()=>{
    dragState.isDrag = false;
    document.body.style.userSelect = "";
})
// 弹窗开关
openKaraBtn.onclick = ()=> karaWin.style.display = "block";
karaCloseBtn.onclick = ()=> karaWin.style.display = "none";

// LRC歌词解析
function parseLRC(raw){
    const reg = /\[(\d{2}):(\d{2})\.(\d{1,3})\]/g;
    let list = [];
    raw.split("\n").forEach(line=>{
        const matches = [...line.matchAll(reg)];
        const txt = line.replace(reg,"").trim();
        if(!txt) return;
        matches.forEach(m=>{
            const min = Number(m[1]);
            const sec = Number(m[2]);
            const ms = Number(m[3]);
            const total = min*60 + sec + ms/1000;
            list.push({time:total,text:txt});
        })
    })
    list.sort((a,b)=>a.time - b.time);
    return list;
}

// 刷新双区域歌词（底部+悬浮弹窗）
function updateLyric(){
    if(!lyricTextArr.length) return;
    let activeIdx = 0;
    lyricTextArr.forEach((item,idx)=>{
        if(currentTime >= item.time) activeIdx = idx;
    })
    // 底部简易歌词
    let bottomHtml = "";
    lyricTextArr.forEach((item,idx)=>{
        bottomHtml += `<div style="${idx===activeIdx?'color:#1155cc;font-weight:bold':''}">${item.text}</div>`
    })
    document.getElementById("lyricDom").innerHTML = bottomHtml;
    // 悬浮弹窗滚动歌词
    let karaHtml = "";
    lyricTextArr.forEach((item,idx)=>{
        let rate = 0;
        if(idx === activeIdx){
            const nextT = lyricTextArr[idx+1]?.time || currentTime+8;
            const dur = nextT - item.time;
            const pass = currentTime - item.time;
            rate = Math.min(100, pass/dur*100);
        }
        karaHtml += `
        <div class="kara-line">
            <span class="kara-active" style="width:${rate}%">${item.text}</span>${item.text}
        </div>`
    })
    karaContent.innerHTML = karaHtml;
    // 滚动居中当前行
    const allLines = karaContent.querySelectorAll(".kara-line");
    if(allLines[activeIdx]){
        karaContent.scrollTop = allLines[activeIdx].offsetTop - karaContent.clientHeight/2;
    }
}
setInterval(updateLyric, 400);

//读取全部文件列表
async function loadFileList(){
    const res = await fetch(`${API}/list`);
    fileAll = await res.json();
    render("music");
}

//渲染列表
function render(folder){
    const box = document.getElementById("box");
    box.innerHTML = "";
    const arr = fileAll.filter(k=>k.startsWith(folder+"/"));
    arr.forEach(key=>{
        const filename = key.split("/")[1];
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<img alt="封面"><div>${filename}</div>`;
        card.onclick = ()=>play(key,filename);
        box.appendChild(card);

        const baseName = filename.split(".")[0];
        const coverKey = fileAll.find(f=>{
            const fn = f.split("/")[1];
            return f.startsWith("images/") && fn.split(".")[0] === baseName;
        })
        if(coverKey){
            card.querySelector("img").src = `${API}/r2?path=${encodeURIComponent(coverKey)}`;
        }
    })
}

//播放媒体，同步时间更新歌词
async function play(fileKey,fileName){
    lyricTextArr = [];
    currentTime = 0;
    const mediaDom = document.getElementById("mediaDom");
    mediaDom.innerHTML = "";
    const url = `${API}/r2?path=${encodeURIComponent(fileKey)}`;
    const base = fileName.split(".")[0];
    let mediaEl = null;

    if(fileKey.startsWith("music/")){
        mediaEl = document.createElement("audio");
        mediaEl.controls = true;
    }else if(fileKey.startsWith("video/")){
        mediaEl = document.createElement("video");
        mediaEl.controls = true;
    }
    mediaEl.src = url;
    mediaDom.appendChild(mediaEl);
    // 同步播放进度给歌词
    mediaEl.ontimeupdate = ()=>{
        currentTime = mediaEl.currentTime;
    }
    await loadLyric(base);
}

//加载歌词
async function loadLyric(songName){
    const lyricDom = document.getElementById("lyricDom");
    lyricDom.innerText = "加载歌词...";
    const lyricKey = fileAll.find(f=>{
        const fn = f.split("/")[1];
        return f.startsWith("lyric/") && fn.split(".")[0] === songName;
    })
    if(!lyricKey){
        lyricTextArr = [];
        lyricDom.innerText = "暂无歌词";
        karaContent.innerHTML = "<div style='color:#aaa;text-align:center;margin-top:80px'>无歌词文件</div>";
        return;
    }
    const resp = await fetch(`${API}/r2?path=${encodeURIComponent(lyricKey)}`);
    const rawLrc = await resp.text();
    lyricTextArr = parseLRC(rawLrc);
    updateLyric();
}

//切换标签
document.querySelectorAll(".tab>div").forEach(t=>{
    t.onclick = ()=>render(t.dataset.folder);
})

loadFileList();
</script>
</body>
</html>
