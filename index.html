<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Posimusic 播放器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f7f5fc;
    color:#222;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Microsoft Yahei",sans-serif;
    overflow:hidden;
}

/* 顶部导航 */
.top-header{
    height:72px;
    display:flex;
    align-items:center;
    padding:0 24px;
    gap:24px;
    border-bottom:1px solid #e2dde9;
    position:fixed;
    top:0;left:0;right:0;
    background:#fff;
    z-index:100;
}
.search-box{
    width:280px;
    border:1px solid #d8d2e3;
    border-radius:99px;
    padding:8px 14px;
    outline:none;
}
.tab-group{display:flex;gap:32px;}
.tab-item{cursor:pointer;font-size:15px;color:#666;}
.tab-item.active{color:#7b42d8;font-weight:bold;}
.btn-import{
    margin-left:auto;
    border:1px solid #b8a2dd;
    background:#fff;
    padding:7px 22px;
    border-radius:99px;
    cursor:pointer;
    color:#7b42d8;
}

/* 导入弹窗 */
.import-mask{
    position:fixed;
    inset:0;
    background:#00000060;
    z-index:400;
    display:none;
    align-items:center;
    justify-content:center;
}
.import-mask.show{display:flex;}
.import-box{
    width:460px;
    background:#fff;
    border-radius:14px;
    padding:24px;
}
.import-title{font-size:18px;font-weight:bold;margin-bottom:16px;}
.import-close{
    float:right;
    border:none;background:none;font-size:22px;cursor:pointer;
}
.import-drag{
    border:2px dashed #b8a2dd;
    border-radius:10px;
    padding:30px 12px;
    text-align:center;
    cursor:pointer;
    margin-bottom:14px;
}
.import-drag.active{background:#f3edff;}
.import-tip{font-size:12px;color:#777;margin-top:8px;}

/* 左侧历史侧边栏 */
.left-sidebar{
    width:190px;
    position:fixed;
    top:72px;bottom:88px;
    left:0;
    background:#fff;
    border-right:1px solid #e2dde9;
    padding:16px 12px;
    overflow-y:auto;
}
.sidebar-title{font-weight:bold;margin-bottom:12px;font-size:16px;}
.history-item{
    padding:8px 6px;
    font-size:14px;
    border-radius:6px;
    cursor:pointer;
}
.history-item:hover{background:#f1ecfa;}

/* 主卡片区域 */
.main-content{
    margin-top:72px;
    margin-left:190px;
    margin-bottom:88px;
    padding:20px;
    height:calc(100vh - 72px - 88px);
    overflow-y:auto;
}
.card-wrap{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:18px;
}
.card-item{
    background:#fff;
    border-radius:12px;
    padding:12px;
    border:1px solid #e9e4f2;
    cursor:pointer;
    transition:0.2s;
}
.card-item:hover{transform:translateY(-3px);box-shadow:0 6px 14px #00000012;}
.card-cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:8px;
    position:relative;
    overflow:hidden;
    background:#eee;
}
.card-more{
    position:absolute;
    top:6px;right:6px;
    width:22px;height:22px;
    border-radius:50%;
    background:#00000040;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
}
.card-play{
    position:absolute;
    bottom:6px;right:6px;
    width:26px;height:26px;
    border-radius:50%;
    background:#7b42d8;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
}
.card-info{margin-top:10px;}
.card-title{
    font-weight:bold;font-size:14px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.card-author{font-size:12px;color:#777;margin:4px 0;}
.card-stat{
    font-size:11px;color:#888;
    display:flex;gap:8px;flex-wrap:wrap;
    margin:6px 0;
}
.btn-card-download{
    width:100%;
    padding:5px 0;
    border:none;
    background:#ede6f9;
    color:#7b42d8;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}

/* 底部常驻播放器 */
.bottom-player{
    height:88px;
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid #e2dde9;
    display:flex;align-items:center;
    padding:0 24px;
    gap:14px;
    z-index:100;
}
.bottom-player button{
    background:none;border:none;
    font-size:20px;
    cursor:pointer;
    color:#444;
}
.progress-wrap{
    flex:1;
}
.progress-bar{
    width:100%;height:6px;
    background:#e2dde9;
    border-radius:99px;
    position:relative;
    cursor:pointer;
}
.progress-dot{
    position:absolute;
    width:14px;height:14px;
    background:#7b42d8;
    border-radius:50%;
    top:-4px;
}

/* 弹窗播放器遮罩 */
.popup-mask{
    position:fixed;
    inset:0;
    background:#00000070;
    z-index:200;
    display:none;
    align-items:center;justify-content:center;
}
.popup-mask.show{display:flex;}
.popup-player-box{
    width:620px;
    background:#fff;
    border-radius:16px;
    padding:24px;
    position:relative;
}
.popup-close{
    position:absolute;
    top:14px;right:14px;
    border:none;background:none;font-size:24px;cursor:pointer;
}
.popup-info{margin-bottom:12px;}
.popup-title{font-size:20px;font-weight:bold;}
.popup-author{font-size:14px;color:#777;margin-top:4px;}
.popup-media{
    width:100%;
    max-height:320px;
    background:#000;
    border-radius:8px;
    margin-bottom:14px;
}
.popup-control{
    display:flex;gap:16px;justify-content:center;
    margin-top:10px;
}
.popup-control button{
    padding:8px 18px;
    border:1px solid #b8a2dd;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    color:#7b42d8;
}

/* 卡片更多弹出菜单 */
.card-more-menu{
    position:fixed;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px 0;
    min-width:120px;
    z-index:300;
    display:none;
}
.card-more-menu.show{display:block;}
.card-more-menu div{
    padding:7px 14px;
    cursor:pointer;
    font-size:13px;
}
.card-more-menu div:hover{background:#f3f0fa;}

/* 可拖拽悬浮歌词【修改：7行歌词】 */
.float-lyric{
    position:absolute;
    width:420px;
    background:#ffffffdd;
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:14px;
    left:100px;top:120px;
    cursor:move;
    z-index:210;
    display:none;
}
.float-lyric.show{display:block;}
.lyric-search-row{
    display:flex;gap:8px;margin-bottom:10px;
}
.lyric-search-input{
    flex:1;
    padding:6px 10px;
    border:1px solid #c8b8e2;
    border-radius:6px;
    outline:none;
}
.lyric-btn{
    padding:6px 10px;
    border:1px solid #b8a2dd;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
    color:#7b42d8;
    font-size:13px;
}
/* 歌词容器，固定7行高度 */
.lyric-container{
    min-height:220px;
    overflow:hidden;
}
.lyric-item{
    text-align:center;
    font-size:15px;
    line-height:2.2;
    color:#44444480;
    transition:all 0.3s ease;
}
/* 当前正在唱的行变色高亮 */
.lyric-item.active{
    color:#7b42d8;
    font-weight:bold;
    font-size:18px;
    opacity:1;
}

/* 响应式适配 */
@media (max-width:1400px){
    .card-wrap{grid-template-columns:repeat(6,1fr);}
}
@media (max-width:1000px){
    .card-wrap{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:720px){
    .left-sidebar{display:none;}
    .main-content{margin-left:0;}
    .card-wrap{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<!--导入弹窗-->
<div class="import-mask" id="importMask">
    <div class="import-box">
        <button class="import-close" id="importClose">×</button>
        <div class="import-title">导入本地文件</div>
        <div class="import-drag" id="importDrag">
            <p>点击或者拖拽文件到此处</p>
            <input type="file" multiple id="importFileInput" style="display:none"/>
        </div>
        <div class="import-tip">
            支持音频：mp3 flac wav m4a ogg<br/>
            视频：mp4 mov webm<br/>
            歌词：lrc
        </div>
    </div>
</div>

<!--顶部导航-->
<div class="top-header">
    <input class="search-box" placeholder="搜索作品、作者"/>
    <div class="tab-group">
        <div class="tab-item active" data-type="music">音乐</div>
        <div class="tab-item" data-type="video">视频</div>
        <div class="tab-item" data-type="image">图片</div>
    </div>
    <button class="btn-import" id="btnImportOpen">导入</button>
</div>

<!--左侧历史播放侧边栏-->
<div class="left-sidebar">
    <div class="sidebar-title">历史播放</div>
    <div id="historyList"></div>
</div>

<!--主卡片区域-->
<div class="main-content">
    <div class="card-wrap" id="cardWrap"></div>
</div>

<!--底部常驻播放器-->
<div class="bottom-player">
    <button id="btnPrev">◀</button>
    <button id="btnPlay">▶</button>
    <button id="btnNext">▶▶</button>
    <button id="btnRewind">⏪</button>
    <button id="btnForward">⏩</button>
    <div class="progress-wrap">
        <div class="progress-bar" id="bottomProgressBar">
            <div class="progress-dot" id="bottomDot"></div>
        </div>
    </div>
    <button id="btnBottomFav">♡</button>
    <button id="btnMode">🔁</button>
    <button id="btnBottomPause">⏸</button>
</div>

<!--弹窗播放器遮罩-->
<div class="popup-mask" id="popupMask">
    <div class="popup-player-box">
        <button class="popup-close" id="popupClose">×</button>
        <div class="popup-info">
            <div class="popup-title" id="popTitle"></div>
            <div class="popup-author" id="popAuthor"></div>
        </div>
        <video class="popup-media" id="popMedia"></video>
        <div class="popup-control">
            <button id="popPrev">上一曲</button>
            <button id="popPlay">播放</button>
            <button id="popNext">下一曲</button>
        </div>
    </div>
</div>

<!--卡片更多菜单-->
<div class="card-more-menu" id="moreMenu">
    <div data-act="share">分享</div>
    <div data-act="addToCollect">加入收藏</div>
    <div data-act="copyKey">复制资源Key</div>
</div>

<!--可拖拽悬浮歌词面板【7行歌词版本】-->
<div class="float-lyric" id="floatLyric">
    <div class="lyric-search-row">
        <input class="lyric-search-input" id="lyricSearchInput" placeholder="搜索歌词"/>
        <button class="lyric-btn" id="lyricSearchBtn">搜索</button>
        <button class="lyric-btn" id="lyricImportBtn">导入歌词</button>
        <input type="file" accept=".lrc" id="lyricFileInput" style="display:none;">
    </div>
    <div class="lyric-container" id="lyricContainer"></div>
</div>

<script>
//支持格式
const AUDIO_EXTS = [".mp3",".flac",".wav",".m4a",".ogg"];
const VIDEO_EXTS = [".mp4",".mov",".webm"];
const LYRIC_EXTS = [".lrc"];
const MAX_SHOW_LINES = 7; //固定显示7行歌词

// 模拟后端资源数据
let mockResourceList = [
    {
        coverImg:"",
        name:"朝歌",
        author:"步丝丝",
        playCount:1243,
        favCount:322,
        commentCount:89,
        resourceKey:"song001",
        type:"audio",
        localUrl:"",
        lyricText:"[00:00.00]欢迎收听\n[00:05.20]朝歌\n[00:10.40]风越过山河万里\n[00:16.10]岁月辗转成歌\n[00:21.00]落日漫过城头\n[00:26.30]山河岁岁依旧\n[00:31.20]往事化作东流\n[00:36.50]千古一梦悠悠"
    },
    {
        coverImg:"",
        name:"晚风序",
        author:"步丝丝",
        playCount:876,
        favCount:211,
        commentCount:43,
        resourceKey:"song002",
        type:"audio",
        localUrl:"",
        lyricText:"[00:00.00]晚风序\n[00:04.30]夜色漫过窗台\n[00:09.20]星光落满衣襟\n[00:14.10]月光淌过街巷\n[00:19.40]晚风轻轻低吟\n[00:24.20]人间烟火温柔\n[00:29.60]岁月缓缓前行\n[00:34.10]心事随风飘零"
    }
];

// 全局播放队列、下标、播放模式 0列表循环 1单曲循环 2随机
let playQueue = [...mockResourceList];
let currentIndex = 0;
let playMode = 0;
let historyArr = [];
let lyricArr = [];
let currentPlayItem = null;
let currentLyricLine = -1;

// DOM
const dom = {
    importMask:document.getElementById("importMask"),
    importClose:document.getElementById("importClose"),
    btnImportOpen:document.getElementById("btnImportOpen"),
    importDrag:document.getElementById("importDrag"),
    importFileInput:document.getElementById("importFileInput"),

    //歌词弹窗dom
    floatLyric:document.getElementById("floatLyric"),
    lyricContainer:document.getElementById("lyricContainer"),
    lyricSearchInput:document.getElementById("lyricSearchInput"),
    lyricSearchBtn:document.getElementById("lyricSearchBtn"),
    lyricImportBtn:document.getElementById("lyricImportBtn"),
    lyricFileInput:document.getElementById("lyricFileInput"),

    cardWrap:document.getElementById("cardWrap"),
    historyList:document.getElementById("historyList"),
    popupMask:document.getElementById("popupMask"),
    popupClose:document.getElementById("popupClose"),
    popTitle:document.getElementById("popTitle"),
    popAuthor:document.getElementById("popAuthor"),
    popMedia:document.getElementById("popMedia"),
    popPlay:document.getElementById("popPlay"),
    moreMenu:document.getElementById("moreMenu"),
    //底部播放器
    btnPrev:document.getElementById("btnPrev"),
    btnPlay:document.getElementById("btnPlay"),
    btnNext:document.getElementById("btnNext"),
    btnRewind:document.getElementById("btnRewind"),
    btnForward:document.getElementById("btnForward"),
    bottomProgressBar:document.getElementById("bottomProgressBar"),
    bottomDot:document.getElementById("bottomDot"),
    btnBottomFav:document.getElementById("btnBottomFav"),
    btnMode:document.getElementById("btnMode"),
    btnBottomPause:document.getElementById("btnBottomPause")
};

//获取文件后缀小写
function getExt(filename){
    const idx = filename.lastIndexOf(".");
    if(idx === -1) return "";
    return filename.slice(idx).toLowerCase();
}

//LRC解析
function parseLRC(text){
    const res = [];
    const reg = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
    text.split("\n").forEach(line=>{
        line = line.trim();
        const m = line.match(reg);
        if(!m) return;
        const time = parseInt(m[1])*60 + parseInt(m[2]) + (parseInt(m[3]||0)/1000);
        const txt = m[4].trim();
        res.push({time,txt});
    });
    return res.sort((a,b)=>a.time-b.time);
}

//渲染7行歌词，中间行active高亮
function renderLyricView(activeIdx){
    dom.lyricContainer.innerHTML = "";
    if(lyricArr.length === 0){
        dom.lyricContainer.innerHTML = `<div class="lyric-item">暂无歌词</div>`;
        return;
    }
    // 计算起始索引，让当前行在7行的正中间（第4行）
    const half = Math.floor(MAX_SHOW_LINES / 2);
    let start = activeIdx - half;
    if(start < 0) start = 0;
    let end = start + MAX_SHOW_LINES;
    if(end > lyricArr.length) {
        end = lyricArr.length;
        start = end - MAX_SHOW_LINES;
        if(start < 0) start = 0;
    }
    for(let i = start; i < end; i++){
        const div = document.createElement("div");
        div.className = "lyric-item" + (i === activeIdx ? " active":"");
        div.innerText = lyricArr[i].txt;
        dom.lyricContainer.appendChild(div);
    }
}

//加载歌词文本，立刻生效
function loadLyricText(lrcRawText){
    lyricArr = parseLRC(lrcRawText);
    currentLyricLine = -1;
    renderLyricView(-1);
}

//悬浮歌词：本地导入lrc
dom.lyricImportBtn.addEventListener("click",()=>dom.lyricFileInput.click());
dom.lyricFileInput.addEventListener("change",e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        const txt = ev.target.result;
        loadLyricText(txt);
        if(currentPlayItem) currentPlayItem.lyricText = txt;
    };
    reader.readAsText(file);
});

//悬浮歌词：搜索歌词（预留对接Worker接口）
dom.lyricSearchBtn.addEventListener("click",async ()=>{
    const keyword = dom.lyricSearchInput.value.trim();
    if(!keyword){alert("请输入歌曲名搜索歌词");return;}
    console.log("搜索歌词关键词：",keyword);
    alert("搜索歌词功能，对接Worker后端接口获取lrc文本");
});

//导入文件处理
function handleImportFiles(files){
    Array.from(files).forEach(file=>{
        const ext = getExt(file.name);
        if(AUDIO_EXTS.includes(ext) || VIDEO_EXTS.includes(ext)){
            const url = URL.createObjectURL(file);
            const newItem = {
                coverImg:"",
                name:file.name,
                author:"本地导入",
                playCount:0,
                favCount:0,
                commentCount:0,
                resourceKey:"local_"+Date.now()+"_"+Math.random().toString(36),
                type:AUDIO_EXTS.includes(ext)?"audio":"video",
                localUrl:url,
                lyricText:""
            };
            mockResourceList.unshift(newItem);
        }else if(LYRIC_EXTS.includes(ext)){
            const reader = new FileReader();
            reader.onload = e=>{
                const lyricContent = e.target.result;
                alert("已读取歌词文件，可绑定到对应歌曲");
                console.log("歌词文本",lyricContent);
            };
            reader.readAsText(file);
        }
    });
    renderCard(mockResourceList);
}

//导入弹窗事件
dom.btnImportOpen.addEventListener("click",()=>dom.importMask.classList.add("show"));
dom.importClose.addEventListener("click",()=>dom.importMask.classList.remove("show"));
dom.importDrag.addEventListener("click",()=>dom.importFileInput.click());
dom.importFileInput.addEventListener("change",e=>handleImportFiles(e.target.files));

//拖拽导入
dom.importDrag.addEventListener("dragover",e=>{e.preventDefault();dom.importDrag.classList.add("active");});
dom.importDrag.addEventListener("dragleave",()=>dom.importDrag.classList.remove("active"));
dom.importDrag.addEventListener("drop",e=>{
    e.preventDefault();
    dom.importDrag.classList.remove("active");
    handleImportFiles(e.dataTransfer.files);
});

//渲染卡片
function renderCard(list){
    dom.cardWrap.innerHTML = "";
    list.forEach(item=>{
        const div = document.createElement("div");
        div.className = "card-item";
        div.innerHTML = `
            <div class="card-cover">
                <span class="card-more">●</span>
                <span class="card-play">▶</span>
            </div>
            <div class="card-info">
                <div class="card-title">${item.name}</div>
                <div class="card-author">${item.author}</div>
                <div class="card-stat">
                    <span>播放:${item.playCount}</span>
                    <span>收藏:${item.favCount}</span>
                </div>
                <button class="btn-card-download">下载</button>
            </div>
        `;
        div.dataset.key = item.resourceKey;
        div.dataset.data = JSON.stringify(item);
        div.querySelector(".card-more").addEventListener("click",e=>{
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            dom.moreMenu.style.left = rect.left +"px";
            dom.moreMenu.style.top = (rect.top+24)+"px";
            dom.moreMenu.classList.add("show");
            dom.moreMenu.dataset.cur = JSON.stringify(item);
        });
        div.querySelector(".btn-card-download").addEventListener("click",e=>{
            e.stopPropagation();
            alert("下载，对接worker下载接口");
        });
        div.addEventListener("click",()=>openPopupPlayer(item));
        dom.cardWrap.appendChild(div);
    });
}

//渲染历史记录
function renderHistory(){
    dom.historyList.innerHTML = "";
    historyArr.forEach(item=>{
        const div = document.createElement("div");
        div.className="history-item";
        div.innerText = item.name;
        div.addEventListener("click",()=>openPopupPlayer(item));
        dom.historyList.appendChild(div);
    })
}

//打开弹窗播放器，音频/视频通用
function openPopupPlayer(item){
    currentPlayItem = item;
    dom.popTitle.innerText = item.name;
    dom.popAuthor.innerText = item.author;
    dom.popupMask.classList.add("show");
    dom.floatLyric.classList.add("show");
    lyricArr = parseLRC(item.lyricText||"");
    currentLyricLine = -1;
    renderLyricView(-1);

    //本地优先，对接worker这里替换url
    if(item.localUrl){
        dom.popMedia.src = item.localUrl;
    }else{
        dom.popMedia.src = "";
    }
    dom.popMedia.currentTime = 0;
    dom.popPlay.innerText = "播放";

    if(!historyArr.find(x=>x.resourceKey===item.resourceKey)){
        historyArr.unshift(item);
        renderHistory();
    }
    currentIndex = playQueue.findIndex(p=>p.resourceKey === item.resourceKey);
}

//关闭弹窗
dom.popupClose.addEventListener("click",()=>{
    dom.popupMask.classList.remove("show");
    dom.floatLyric.classList.remove("show");
    dom.popMedia.pause();
});

//弹窗播放暂停
dom.popPlay.addEventListener("click",()=>{
    if(dom.popMedia.paused){
        dom.popMedia.play();
        dom.popPlay.innerText = "暂停";
    }else{
        dom.popMedia.pause();
        dom.popPlay.innerText = "播放";
    }
});

//上一曲
function playPrev(){
    if(playMode===2){
        currentIndex = Math.floor(Math.random()*playQueue.length);
    }else{
        currentIndex--;
        if(currentIndex<0) currentIndex = playQueue.length-1;
    }
    openPopupPlayer(playQueue[currentIndex]);
}
//下一曲
function playNext(){
    if(playMode===2){
        currentIndex = Math.floor(Math.random()*playQueue.length);
    }else{
        currentIndex++;
        if(currentIndex>=playQueue.length) currentIndex=0;
    }
    openPopupPlayer(playQueue[currentIndex]);
}

//弹窗上下曲
document.getElementById("popPrev").addEventListener("click",playPrev);
document.getElementById("popNext").addEventListener("click",playNext);

//底部播放器全部按键
dom.btnPrev.onclick = playPrev;
dom.btnNext.onclick = playNext;
dom.btnPlay.onclick = ()=>{
    if(dom.popMedia.paused){dom.popMedia.play();dom.popPlay.innerText="暂停";}
    else {dom.popMedia.pause();dom.popPlay.innerText="播放";}
};
dom.btnBottomPause.onclick = ()=>{
    dom.popMedia.pause();
    dom.popPlay.innerText="播放";
};
//快退5秒
dom.btnRewind.onclick = ()=>{
    dom.popMedia.currentTime = Math.max(0, dom.popMedia.currentTime-5);
};
//快进5秒
dom.btnForward.onclick = ()=>{
    dom.popMedia.currentTime = dom.popMedia.currentTime+5;
};
//进度条点击跳转
dom.bottomProgressBar.addEventListener("click",e=>{
    const rect = dom.bottomProgressBar.getBoundingClientRect();
    const percent = (e.clientX-rect.left)/rect.width;
    if(dom.popMedia.duration) dom.popMedia.currentTime = percent * dom.popMedia.duration;
});
//播放模式切换 0列表循环，1单曲循环，2随机
dom.btnMode.onclick = ()=>{
    playMode++;
    if(playMode>2) playMode=0;
    const modeText = ["🔁列表循环","🔂单曲循环","🎲随机播放"];
    dom.btnMode.innerText = modeText[playMode];
};
//底部收藏
dom.btnBottomFav.onclick = ()=>{
    alert("收藏逻辑，对接后端收藏接口");
};

//媒体时间更新，7行歌词同步+底部进度条同步
dom.popMedia.addEventListener("timeupdate",()=>{
    const t = dom.popMedia.currentTime;
    let active = -1;
    for(let i=0;i<lyricArr.length;i++){
        if(lyricArr[i].time <= t) active = i;
    }
    if(active !== currentLyricLine){
        currentLyricLine = active;
        renderLyricView(active);
    }
    if(dom.popMedia.duration){
        const pct = t / dom.popMedia.duration;
        dom.bottomDot.style.left = (pct*100)+"%";
    }
});
//播放结束处理
dom.popMedia.addEventListener("ended",()=>{
    if(playMode ===1){
        dom.popMedia.currentTime =0;
        dom.popMedia.play();
    }else{
        playNext();
    }
});

//悬浮歌词拖拽
(function initLyricDrag(){
    const wrap = dom.floatLyric;
    let dragging = false,startX,startY,initLeft,initTop;
    wrap.addEventListener("mousedown",e=>{
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = wrap.getBoundingClientRect();
        initLeft = rect.left;
        initTop = rect.top;
        wrap.style.zIndex = 9999;
        e.preventDefault();
    });
    document.addEventListener("mousemove",e=>{
        if(!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        wrap.style.left = (initLeft + dx) + "px";
        wrap.style.top = (initTop + dy) + "px";
    });
    document.addEventListener("mouseup",()=>{ dragging = false; });
})();

//卡片更多菜单点击
dom.moreMenu.addEventListener("click",e=>{
    const act = e.target.dataset.act;
    const item = JSON.parse(dom.moreMenu.dataset.cur);
    if(act==="share") alert(`分享：${item.name}`);
    if(act==="addToCollect") alert("加入收藏，对接接口");
    if(act==="copyKey"){
        navigator.clipboard.writeText(item.resourceKey);
        alert("已复制资源key");
    }
    dom.moreMenu.classList.remove("show");
});
document.addEventListener("click",()=>dom.moreMenu.classList.remove("show"));

//标签切换
document.querySelectorAll(".tab-item").forEach(tab=>{
    tab.addEventListener("click",function(){
        document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
        this.classList.add("active");
        const type = this.dataset.type;
        console.log("切换分类：",type,"对接接口筛选音乐/视频/图片");
    })
});

//搜索框
document.querySelector(".search-box").addEventListener("input",e=>{
    const kw = e.target.value.trim();
    console.log("搜索关键词：",kw,"对接搜索接口");
});

//无限滚动（触底加载下一页）
let page = 1;
document.querySelector(".main-content").addEventListener("scroll",async function(e){
    const el = e.target;
    if(el.scrollTop + el.clientHeight >= el.scrollHeight - 120){
        page++;
        console.log("触底加载下一页 page=",page,"对接后端分页接口追加卡片");
    }
});

//初始化
renderCard(mockResourceList);
renderHistory();
</script>
