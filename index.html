<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posimusic｜音视频图片云端R2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "思源宋体", "SimSun", serif;
        }
        body {
            background-color: #f3ebd8;
            padding:20px;
            color:#3a2e20;
        }
        .app-container {
            display: grid;
            grid-template-columns: 60% 40%;
            gap:24px;
            max-width:1920px;
            margin:0 auto;
            border: 2px solid #b89b70;
            padding:24px;
            background-color:#f7efdd;
            background-image: radial-gradient(#d9c9b0 1px, transparent 1px);
            background-size:20px 20px;
            position: relative;
        }
        .scroll-player-wrap {
            border: 12px solid #c8a87c;
            border-image: linear-gradient(#94744e,#e2cdad,#94744e) 1;
            border-radius:8px;
            position:relative;
            background:#f9f1de;
            min-height:480px;
            display:flex;
            flex-direction:column;
        }
        .scroll-left,.scroll-right{
            position:absolute;
            top:-10px;
            bottom:-10px;
            width:32px;
            background:linear-gradient(90deg,#6b4c2e,#b89468,#6b4c2e);
            border-radius:12px;
        }
        .scroll-left{left:-12px;}
        .scroll-right{right:-12px;}

        .player-view{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            position:relative;
        }
        .media-box{
            position:relative;
            width:100%;
            max-height:240px;
        }
        video,audio{
            width:100%;
            max-height:220px;
            display:none;
        }

        .play-big-btn{
            display:none !important;
            width:120px;
            height:120px;
            border:2px solid #b89468;
            background:rgba(247,239,221,0.65);
            border-radius:8px;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        .play-big-btn svg{
            width:48px;height:48px;fill:#6b4c2e;
        }
        .music-icon-card{
            display:none !important;
            position:absolute;
            right:40px;
            bottom:30px;
            width:100px;
            height:120px;
            border:1px solid #b89468;
            background:rgba(247,239,221,0.7);
            align-items:center;
            justify-content:center;
        }
        .music-icon-card svg{
            width:60px;height:60px;fill:#5a432c;
        }

        .lyric-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:4px 10px;
            background:#e9ddc8;
            border-bottom:1px solid #b89b70;
        }
        .lyric-title{
            display:none;
            font-size:14px;
        }
        .lyric-toggle-btn{
            display:none;
        }

        .lyric-wrap{
            width:100%;
            margin-top:10px;
            border:1px solid #b89b70;
            border-radius:8px;
            position:relative;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            transition: max-height 0.35s ease-out;
            max-height:260px;
        }
        .lyric-scroll-container{
            overflow:hidden;
            transition: max-height 0.35s ease-out;
            max-height:200px;
        }
        .lyric-scroll{
            transition: transform 0.35s ease-out;
        }
        .lyric-line{
            text-align:center;
            padding:10px 4px;
            font-size:18px;
            color:#66543c;
        }
        .lyric-line.active-line{
            font-size:21px;
            font-weight:bold;
        }
        .char-normal{
            color:#66543c;
        }
        .char-light{
            color:#e04420;
            font-weight:bold;
        }

        .player-bottom-bar{
            padding:16px 12px;
        }
        .progress-row{
            display:flex;
            gap:12px;
            align-items:center;
            margin-bottom:14px;
        }
        .time-text{
            font-size:13px;
            color:#66543c;
            min-width:40px;
        }
        .progress-bar{
            flex:1;
            height:6px;
            background:#c9b89e;
            border-radius:3px;
            position:relative;
            cursor:pointer;
        }
        .progress-dot{
            position:absolute;
            width:14px;height:14px;
            background:#4b3824;
            border-radius:50%;
            top:-4px;
            left:0%;
        }
        .control-buttons{
            display:flex;
            gap:32px;
            align-items:center;
            justify-content:center;
        }

        .ctrl-btn {
            width: 46px;
            height: 46px;
            border: none;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            border-radius: 12px;
            cursor: pointer;
            font-size: 22px;
            color: #3a2e20;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition: 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .ctrl-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05));
            border-radius: 12px 12px 0 0;
            pointer-events: none;
        }
        .ctrl-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .ctrl-btn:active {
            transform: translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }

        .play-pause {
            width: 68px;
            height: 68px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(145deg, #f7efdd, #d9b38c);
            color: #3a2e20;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.9),
                inset 0 -2px 0 rgba(180, 140, 100, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 8px rgba(90, 60, 40, 0.2);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            transition: 0.18s ease;
            position: relative;
            overflow: hidden;
        }
        .play-pause::before {
            content: "";
            position: absolute;
            top: 8%;
            left: 12%;
            width: 35%;
            height: 25%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05));
            border-radius: 50%;
            pointer-events: none;
        }
        .play-pause:hover {
            transform: translateY(-3px);
            background: linear-gradient(145deg, #fff7ea, #e0c9a6);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 1),
                inset 0 -2px 0 rgba(180, 140, 100, 0.6),
                0 8px 20px rgba(90, 60, 40, 0.45),
                0 4px 10px rgba(90, 60, 40, 0.25);
        }
        .play-pause:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 4px 8px rgba(90, 60, 40, 0.35),
                inset 0 -2px 0 rgba(255, 255, 255, 0.8),
                0 3px 10px rgba(90, 60, 40, 0.25);
        }

        .bottom-right-buttons{
            margin-left: auto;
            display:flex;
            gap:10px;
            align-items:center;
        }
        .fullscreen-bar-btn,
        .lyric-bar-btn {
            padding: 7px 14px;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            border: 1px solid rgba(184, 155, 112, 0.65);
            border-radius: 10px;
            color: #3a2e20;
            font-size: 14px;
            font-family: "思源宋体", "SimSun", serif;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition:0.18s ease;
            position:relative;
            overflow:hidden;
        }
        .fullscreen-bar-btn::before,
        .lyric-bar-btn::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:45%;
            background:linear-gradient(180deg,rgba(255,255,255,0.32),rgba(255,255,255,0.03));
            pointer-events:none;
        }
        .fullscreen-bar-btn:hover,
        .lyric-bar-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .fullscreen-bar-btn:active,
        .lyric-bar-btn:active{
            transform:translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }

        .right-sidebar{
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .top-btn-group{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }
        .btn-base{
            padding:7px 12px;
            border-radius:12px;
            border:none;
            font-size:14px;
            cursor:pointer;
            font-family:"思源宋体", "SimSun", serif;
            background: linear-gradient(145deg, rgba(248, 244, 235, 0.95), rgba(218, 199, 175, 0.95));
            color:#3a2e20;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 4px 12px rgba(90, 60, 40, 0.25),
                0 2px 4px rgba(90, 60, 40, 0.15);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            transition:0.18s ease;
            position:relative;
            overflow:hidden;
        }
        .btn-base::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05));
            border-radius:12px 0 0 12px;
            pointer-events:none;
        }
        .btn-base:hover{
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(255, 250, 240, 0.98), rgba(225, 205, 180, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(180, 150, 120, 0.6),
                0 6px 16px rgba(90, 60, 40, 0.35),
                0 3px 6px rgba(90, 60, 40, 0.2);
        }
        .btn-base:active{
            transform: translateY(1px);
            box-shadow:
                inset 0 2px 4px rgba(90, 60, 40, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(90, 60, 40, 0.2);
        }
        .btn-upload{
            background: linear-gradient(145deg, rgba(255,210,170,0.95), rgba(204,120,70,0.95));
            color:#fff;
            text-shadow:0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-upload::before{
            background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
        }
        .btn-upload:hover{
            background: linear-gradient(145deg, rgba(255,222,190,0.98), rgba(218,132,82,0.98));
        }

        .search-input{
            width:100%;
            padding:12px 16px;
            border-radius:14px;
            border:1px solid #b89b70;
            background:#f9f1de;
            font-size:16px;
        }
        .tab-group-cloud{
            display:flex;
            gap:8px;
        }
        .tab-cloud{
            flex:1;
            padding:10px;
            border-radius:10px;
            border:1px solid #b89b70;
            text-align:center;
            font-size:15px;
            cursor:pointer;
            background:#e9ddc8;
        }
        .tab-cloud.active{
            background:#c8a87c;
            color:#fff;
        }

        .cloud-resource-box{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:14px;
            max-height:220px;
            overflow-y:auto;
        }
        .cloud-item{
            padding:8px 6px;
            border-bottom:1px solid #ddcdb4;
            cursor:pointer;
        }
        .cloud-item:hover{
            background:#e9ddc8;
        }
        .history-box{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:16px;
            flex:1;
            max-height:240px;
            overflow-y:auto;
        }
        .history-title{
            display:flex;
            justify-content:space-between;
            font-size:22px;
            margin-bottom:14px;
        }
        .history-item{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 0;
            border-bottom:1px solid #ddcdb4;
            cursor:pointer;
        }
        .item-left{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .check-box{
            width:20px;height:20px;
            border:1px solid #8c7250;
            border-radius:4px;
        }
        .back-arrow{
            position:absolute;
            top:16px;
            left:16px;
            font-size:32px;
            cursor:pointer;
        }
        #lrcFileInput{display:none;}

        /*图片预览弹窗*/
        .img-preview-modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .img-preview-modal img{
            max-width:90vw;
            max-height:90vh;
        }
        /*评论区*/
        .comment-wrap{
            border:1px solid #c8b494;
            border-radius:12px;
            padding:14px;
            max-height:260px;
            overflow-y:auto;
        }
        .comment-input-row{
            display:flex;
            gap:8px;
            margin-bottom:10px;
        }
        .comment-input{
            flex:1;
            padding:8px;
            border-radius:8px;
            border:1px solid #b89b70;
            background:#f9f1de;
        }
        .comment-item{
            padding:8px 4px;
            border-bottom:1px solid #ddcdb4;
        }
        .comment-name{
            font-weight:bold;
        }
        /*元数据信息*/
        #mediaMetaInfo{
            padding:8px 10px;
            font-size:13px;
            color:#444;
            border:1px solid #c8b494;
            border-radius:12px;
        }
        /*登录弹窗样式*/
        .login-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-modal {
            width: 420px;
            background: #f7efdd;
            border: 2px solid #b89b70;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(90, 60, 40, 0.35);
        }
        .login-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #e9ddc8;
            border-bottom: 1px solid #b89b70;
        }
        .login-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #3a2e20;
        }
        .login-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #66543c;
            cursor: pointer;
            line-height: 1;
        }
        .login-modal-tabs {
            display: flex;
            border-bottom: 1px solid #b89b70;
        }
        .login-tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f9f1de;
            color: #66543c;
            font-size: 16px;
            cursor: pointer;
        }
        .login-tab-btn.active {
            background: #c8a87c;
            color: #fff;
        }
        .login-modal-body {
            padding: 20px;
        }
        .login-form,
        .register-form {
            display: none;
        }
        .login-form.active,
        .register-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #3a2e20;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b89b70;
            border-radius: 8px;
            background: #f9f1de;
            color: #3a2e20;
            font-size: 16px;
        }
        .login-submit-btn,
        .register-submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, rgba(255, 210, 170, 0.95), rgba(204, 120, 70, 0.95));
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(90, 60, 40, 0.25);
        }
        .login-modal-footer {
            padding: 12px 20px;
            font-size: 13px;
            color: #777;
            text-align: center;
            background: #e9ddc8;
            border-top: 1px solid #b89b70;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="back-arrow">←</div>
    <div class="scroll-player-wrap">
        <div class="scroll-left"></div>
        <div class="scroll-right"></div>
        <div class="player-view" id="playerView">
            <div class="media-box" id="mediaBox">
                <audio id="audioEl">
                <video id="videoEl"></video>
                <div class="play-big-btn" id="bigPlayBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="music-icon-card">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
        </div>

        <div class="lyric-wrap" id="lyricWrap">
            <div class="lyric-header">
                <span class="lyric-title">歌词</span>
            </div>
            <div class="lyric-scroll-container" id="lyricScrollContainer">
                <div class="lyric-scroll" id="lyricScroll">
                    <div class="lyric-line">支持 lrc / krc / txt 歌词；视频音频共用歌词模块</div>
                </div>
            </div>
        </div>

        <div class="player-bottom-bar">
            <div class="progress-row">
                <span class="time-text" id="curTime">00:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-dot" id="progressDot"></div>
                </div>
                <span class="time-text" id="totalTime">00:00</span>
            </div>
            <div class="control-buttons">
                <button class="ctrl-btn" id="prevBtn">◀◀</button>
                <button class="ctrl-btn play-pause" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn">▶▶</button>

                <div class="bottom-right-buttons">
                    <button class="fullscreen-bar-btn" id="fullBtn">全屏</button>
                    <button class="lyric-bar-btn" id="lyricBarBtn">📄 关闭歌词</button>
                </div>
            </div>
        </div>
    </div>

    <div class="right-sidebar">
        <div class="top-btn-group">
            <button class="btn-base btn-login" id="loginBtn">🔐 登录注册</button>
            <button class="btn-base" id="collectBtn">⭐收藏</button>
            <button class="btn-base btn-upload" id="uploadBtn">👤 上传公开</button>
            <button class="btn-base btn-lrc" id="lrcBtn">📄 加载歌词</button>
            <input type="file" id="lrcFileInput" accept=".lrc,.krc,.txt">
        </div>
        <input class="search-input" placeholder="🔍 搜索音乐、视频、图片" id="searchInput">

        <div class="tab-group-cloud">
            <div class="tab-cloud active" data-prefix="music/">音乐</div>
            <div class="tab-cloud" data-prefix="video/">视频</div>
            <div class="tab-cloud" data-prefix="images/">图片</div>
        </div>

        <div class="cloud-resource-box" id="cloudBox">
            <div style="color:#777;text-align:center;">加载云端资源...</div>
        </div>
        <!--====新增元数据DOM====-->
        <div id="mediaMetaInfo"></div>
        <!--评论区面板-->
        <div class="comment-wrap">
            <div class="comment-input-row">
                <input class="comment-input" id="commentInput" placeholder="写下你的评论">
                <button class="btn-base" id="sendCommentBtn">发送</button>
            </div>
            <div id="commentListBox">
                <div style="color:#777;text-align:center;">暂无评论</div>
            </div>
        </div>

        <div class="history-box">
            <div class="history-title">
                <span>历史播放目录</span>
                <span id="foldHistory">—</span>
            </div>
            <div id="historyWrap">
                <div style="color:#777;text-align:center;">选择云端文件后记录出现</div>
            </div>
        </div>
    </div>
</div>

<!--图片预览弹窗-->
<div class="img-preview-modal" id="imgModal">
    <img id="previewImg"/>
</div>

<!--登录注册弹窗HTML-->
<div class="login-modal-overlay" id="loginModalOverlay">
    <div class="login-modal">
        <div class="login-modal-header">
            <span class="login-modal-title">账号登录</span>

</div>

<script>
const API_BASE = "https://api.busisi.com";

let mediaEl = null;
let playList = [];
let currentIndex = -1;
let lyricData = [];
let lyricPanelOpen = true;
let currentCloudPrefix = "music/";
let currentPlayingKey = "";
let loginUser = null;
let token = localStorage.getItem("token");
let playHistory = JSON.parse(localStorage.getItem("playHistory")||"[]");
let favList = JSON.parse(localStorage.getItem("favList")||"[]");

// 补全局媒体dom
const audioEl = document.getElementById("audioEl");
const videoEl = document.getElementById("videoEl");

const playerView = document.getElementById("playerView");
const mediaBox = document.getElementById("mediaBox");
const playPauseBtn = document.getElementById("playPauseBtn");
const bigPlayBtn = document.getElementById("bigPlayBtn");
const fullBtn = document.getElementById("fullBtn");
const lyricBarBtn = document.getElementById("lyricBarBtn");
const lyricScrollContainer = document.getElementById("lyricScrollContainer");
const lyricWrap = document.getElementById("lyricWrap");
const curTimeDom = document.getElementById("curTime");
const totalTimeDom = document.getElementById("totalTime");
const progressBar = document.getElementById("progressBar");
const progressDot = document.getElementById("progressDot");
const historyWrap = document.getElementById("historyWrap");
const lrcBtn = document.getElementById("lrcBtn");
const lrcFileInput = document.getElementById("lrcFileInput");
const lyricScroll = document.getElementById("lyricScroll");
const cloudBox = document.getElementById("cloudBox");
const tabCloudList = document.querySelectorAll(".tab-cloud");
const imgModal = document.getElementById("imgModal");
const previewImg = document.getElementById("previewImg");
const commentInput = document.getElementById("commentInput");
const sendCommentBtn = document.getElementById("sendCommentBtn");
const commentListBox = document.getElementById("commentListBox");
const collectBtn = document.getElementById("collectBtn");
const uploadBtn = document.getElementById("uploadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const mediaMetaInfo = document.getElementById("mediaMetaInfo");

//登录弹窗元素
const loginBtn = document.getElementById("loginBtn");
const loginModalOverlay = document.getElementById("loginModalOverlay");
const loginModalClose = document.getElementById("loginModalClose");
const loginTabBtns = document.querySelectorAll(".login-tab-btn");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const loginModalTitle = document.querySelector(".login-modal-title");

//读取本地登录缓存
const saved = localStorage.getItem("loginUser");
if(saved){
    loginUser = JSON.parse(saved);
    loginBtn.innerText = `已登录：${loginUser.username}`;
    loginBtn.disabled = true;
    loginBtn.style.opacity = "0.65";
}
renderHistory();

//页面初始化加载音乐分类
loadCloudList("music/");

//弹窗控制函数
function openLoginModal() {
    loginModalOverlay.style.display = "flex";
    resetLoginModal();
}
function closeLoginModal() {
    loginModalOverlay.style.display = "none";
}
function resetLoginModal() {
    loginTabBtns.forEach(btn => btn.classList.remove("active"));
    loginTabBtns[0].classList.add("active");
    loginForm.classList.add("active");
    registerForm.classList.remove("active");
    loginModalTitle.innerText = "账号登录";
    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("registerUsername").value = "";
    document.getElementById("registerPassword").value = "";
    document.getElementById("registerPassword2").value = "";
}

loginBtn.onclick = openLoginModal;
loginModalClose.onclick = closeLoginModal;
loginModalOverlay.onclick = e => {
    if (e.target === loginModalOverlay) closeLoginModal();
};

loginTabBtns.forEach(btn => {
    btn.onclick = () => {
        loginTabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        if (tab === "login") {
            loginForm.classList.add("active");
            registerForm.classList.remove("active");
            loginModalTitle.innerText = "账号登录";
        } else {
            loginForm.classList.remove("active");
            registerForm.classList.add("active");
            loginModalTitle.innerText = "账号注册";
        }
    };
});

//播放暂停点击事件
playPauseBtn.onclick = ()=>{
    if(!mediaEl) return;
    if(mediaEl.paused){
        mediaEl.play();
        playPauseBtn.innerText = "⏸";
    }else{
        mediaEl.pause();
        playPauseBtn.innerText = "▶";
    }
}

bigPlayBtn.onclick = ()=>{
    if(!mediaEl) return;
    if(mediaEl.paused){
        mediaEl.play();
    }else{
        mediaEl.pause();
    }
}

//上一曲
prevBtn.onclick = ()=>{
    if(playList.length===0) return;
    currentIndex--;
    if(currentIndex < 0) currentIndex = playList.length -1;
    const obj = playList[currentIndex];
    const url = `${API_BASE}/getmusic?key=${encodeURIComponent(obj.key)}`;
    loadCloudMedia(url,obj.key);
}
//下一曲
nextBtn.onclick = ()=>{
    if(playList.length===0) return;
    currentIndex++;
    if(currentIndex >= playList.length) currentIndex = 0;
    const obj = playList[currentIndex];
    const url = `${API_BASE}/getmusic?key=${encodeURIComponent(obj.key)}`;
    loadCloudMedia(url,obj.key);
}

//全屏
fullBtn.onclick = ()=>{
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
}

//进度条点击跳转
progressBar.onclick = function(e){
    if(!mediaEl || !mediaEl.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const percent = offsetX / rect.width;
    mediaEl.currentTime = percent * mediaEl.duration;
}

//登录提交
loginForm.onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    if (!username || !password) {
        alert("请输入账号和密码");
        return;
    }
    const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    alert(json.msg);
    if (json.code === 0) {
        loginUser = { username };
        localStorage.setItem("loginUser", JSON.stringify(loginUser));
        closeLoginModal();
        loginBtn.innerText = `已登录：${loginUser.username}`;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.65";
    }
};

//注册提交
registerForm.onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById("registerUsername").value.trim();
    const password = document.getElementById("registerPassword").value.trim();
    const password2 = document.getElementById("registerPassword2").value.trim();
    if (!username || !password || !password2) {
        alert("请填写完整信息");
        return;
    }
    if (password !== password2) {
        alert("两次密码不一致");
        return;
    }
    const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    alert(json.msg);
    if (json.code === 0) {
        loginUser = { username };
        localStorage.setItem("loginUser", JSON.stringify(loginUser));
        closeLoginModal();
        loginBtn.innerText = `已登录：${loginUser.username}`;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.65";
    }
};

//上传文件按钮事件
uploadBtn.onclick = async ()=>{
    alert("上传接口待后端实现");
}

//发送评论
sendCommentBtn.onclick = async ()=>{
    if(!loginUser){
        alert("登录后才能发送评论");
        openLoginModal();
        return;
    }
    const text = commentInput.value.trim();
    if(!text) return;
    const res = await fetch(`${API_BASE}/addcomment`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            songKey:currentPlayingKey,
            username:loginUser.username,
            content:text
        })
    })
    const json = await res.json();
    alert(json.msg);
    commentInput.value = "";
    loadCommentList(currentPlayingKey);
    refreshMediaMeta(currentPlayingKey);
}

//加载评论列表
async function loadCommentList(songKey){
    if(!songKey) return;
    const res = await fetch(`${API_BASE}/getcomment?songKey=${encodeURIComponent(songKey)}`);
    const json = await res.json();
    if(json.code!==0){
        commentListBox.innerHTML = `<div style="color:#777;text-align:center;">读取评论失败</div>`;
        return;
    }
    const list = json.comments;
    if(list.length===0){
        commentListBox.innerHTML = `<div style="color:#777;text-align:center;">暂无评论</div>`;
        return;
    }
    commentListBox.innerHTML = "";
    list.forEach(item=>{
        const div = document.createElement("div");
        div.className = "comment-item";
        const timeStr = new Date(item.time).toLocaleString();
        div.innerHTML = `
            <div class="comment-name">${item.username} <span style="font-size:12px;color:#888">${timeStr}</span></div>
            <div>${item.content}</div>
        `;
        commentListBox.appendChild(div);
    })
}

//刷新当前文件元信息展示
async function refreshMediaMeta(key){
    if(!key || !mediaMetaInfo) return;
    const res = await fetch(`${API_BASE}/getmeta?key=${encodeURIComponent(key)}`);
    const json = await res.json();
    if(json.code!==0){
        mediaMetaInfo.innerText = "统计信息读取失败";
        return;
    }
    const m = json.data;
    const uploadDate = new Date(m.uploadTime).toLocaleString();
    mediaMetaInfo.innerHTML = `
📊播放：${m.playCount}次 | ⭐收藏：${m.favCount} | 💬评论：${m.commentCount}
<br>📅上传时间：${uploadDate}
    `
}

//收藏按钮
collectBtn.onclick = async ()=>{
    if(!loginUser){
        alert("登录后可收藏");
        openLoginModal();
        return;
    }
    if(!currentPlayingKey) return;
    const idx = favList.indexOf(currentPlayingKey);
    let isAdd = true;
    if(idx>-1){
        favList.splice(idx,1);
        alert("已取消收藏");
        collectBtn.innerText = "⭐收藏";
        isAdd = false;
    }else{
        favList.push(currentPlayingKey);
        alert("收藏成功");
        collectBtn.innerText = "★已收藏";
        isAdd = true;
    }
    localStorage.setItem("favList",JSON.stringify(favList));
    await fetch(`${API_BASE}/togglobalfav`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({key:currentPlayingKey,isAdd})
    })
    refreshMediaMeta(currentPlayingKey);
}

//歌词切换
function toggleLyricPanel(){
    lyricPanelOpen = !lyricPanelOpen;
    if(lyricPanelOpen){
        lyricWrap.style.maxHeight = "260px";
        lyricScrollContainer.style.maxHeight = "200px";
        lyricBarBtn.innerText = "📄 关闭歌词";
    }else{
        lyricWrap.style.maxHeight = "0px";
        lyricScrollContainer.style.maxHeight = "0px";
        lyricBarBtn.innerText = "📄 打开歌词";
    }
}
lyricBarBtn.addEventListener("click",toggleLyricPanel);

//歌词更新高亮滚动函数
function updateLyric(nowSecond){
    if(lyricData.length===0) return;
    let activeIdx = 0;
    for(let i=0;i<lyricData.length;i++){
        if(lyricData[i].time <= nowSecond){
            activeIdx = i;
        }else{
            break;
        }
    }
    const allLines = document.querySelectorAll('.lyric-line');
    allLines.forEach((el,index)=>{
        if(index === activeIdx){
            el.classList.add('active-line');
        }else{
            el.classList.remove('active-line');
        }
    })
    const currentItem = allLines[activeIdx];
    if(currentItem && lyricScrollContainer){
        lyricScrollContainer.scrollTo({
            top: currentItem.offsetTop - lyricScrollContainer.clientHeight / 2,
            behavior:"smooth"
        })
    }
}

//自动云端搜索歌词
async function autoSearchLyric(fileFullName){
    let fileName = fileFullName.replace("music/","");
    let baseName = fileName.substring(0,fileName.lastIndexOf('.'));
    const lrcKey = `music/${baseName}.lrc`;
    console.log("自动搜索歌词，歌名：",baseName,"歌词路径：",lrcKey);
    try{
        const res = await fetch(`${API_BASE}/getmusic?key=${encodeURIComponent(lrcKey)}`);
        if(res.ok){
            const lrcText = await res.text();
            lyricData = parseSimpleLrc(lrcText);
            renderLyric();
        }else{
            clearLyric();
        }
    }catch(err){
        console.log("未找到云端歌词",err);
        clearLyric();
    }
}

//对接Worker /list接口 获取R2云端列表
async function loadCloudList(prefix){
    currentCloudPrefix = prefix;
    cloudBox.innerHTML = `<div style="color:#777;text-align:center;">加载中...</div>`;
    try{
        const res = await fetch(`${API_BASE}/list?prefix=${encodeURIComponent(prefix)}`);
        const json = await res.json();
        if(json.code!==0){
            cloudBox.innerHTML = `<div style="color:#777;text-align:center;">读取资源失败</div>`;
            return;
        }
        playList = json.objects;
        if(playList.length===0){
            cloudBox.innerHTML = `<div style="color:#777;text-align:center;">该分类暂无文件</div>`;
            return;
        }
        cloudBox.innerHTML = "";
        for(let idx=0; idx<playList.length; idx++){
            const obj = playList[idx];
            const div = document.createElement("div");
            div.className = "cloud-item";
            const metaRes = await fetch(`${API_BASE}/getmeta?key=${encodeURIComponent(obj.key)}`);
            const metaJson = await metaRes.json();
            let metaText = "";
            if(metaJson.code===0){
                metaText = ` ▶${metaJson.data.playCount} ⭐${metaJson.data.favCount}`;
            }
            div.innerHTML = `
                <div class="item-name">${obj.key.replace(prefix,"")}</div>
                <div class="item-meta">${metaText}</div>
            `;
            div.dataset.key = obj.key;
            div.dataset.index = idx;
            div.onclick = ()=>{
                currentIndex = Number(div.dataset.index);
                const url = `${API_BASE}/getmusic?key=${encodeURIComponent(obj.key)}`;
                loadCloudMedia(url, obj.key);
            };
            cloudBox.appendChild(div);
        }
    }catch(err){
        cloudBox.innerHTML = `<div style="color:#777;text-align:center;">网络请求异常</div>`;
        console.error(err);
    }
}

//加载云端媒体
async function loadCloudMedia(url,key){
    currentPlayingKey = key;
    refreshMediaMeta(key);
    loadCommentList(key);
    autoSearchLyric(key);
    const historyItem = {key,name:key};
    const exist = playHistory.find(x=>x.key===key);
    if(!exist){
        playHistory.unshift(historyItem);
        if(playHistory.length>50) playHistory.pop();
        localStorage.setItem("playHistory",JSON.stringify(playHistory));
        renderHistory();
    }
    mediaEl = audioEl;
    mediaEl.src = url;
    await mediaEl.play();
    playPauseBtn.innerText = "⏸";
    if(favList.includes(currentPlayingKey)){
        collectBtn.innerText = "★已收藏";
    }else{
        collectBtn.innerText = "⭐收藏";
    }
}

//渲染播放历史
function renderHistory(){
    if(!historyWrap) return;
    historyWrap.innerHTML = "";
    playHistory.forEach((item,i)=>{
        const d = document.createElement("div");
        d.className = "history-item";
        d.innerText = item.key;
        d.onclick = ()=>{
            const url = `${API_BASE}/getmusic?key=${encodeURIComponent(item.key)}`;
            loadCloudMedia(url,item.key);
        }
        historyWrap.appendChild(d);
    })
}

//清空歌词
function clearLyric(){
    lyricData = [];
    if(lyricWrap) lyricWrap.innerHTML = "";
}

//解析简单lrc歌词
function parseSimpleLrc(text){
    const lines = text.split("\n");
    const res = [];
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    for(let line of lines){
        const m = line.match(reg);
        if(!m) continue;
        const min = Number(m[1]);
        const sec = Number(m[2]);
        const ms = Number(m[3]);
        const time = min*60 + sec + ms/1000;
        const content = line.replace(reg,"").trim();
        res.push({time,content});
    }
    return res.sort((a,b)=>a.time-b.time);
}

//渲染歌词DOM
function renderLyric(){
    if(!lyricWrap) return;
    lyricWrap.innerHTML = "";
    lyricData.forEach(item=>{
        const lineDiv = document.createElement("div");
        lineDiv.className = "lyric-line";
        lineDiv.innerText = item.content;
        lyricWrap.appendChild(lineDiv);
    })
}

//媒体时间更新事件，驱动进度条、歌词高亮
audioEl.ontimeupdate = function(){
    if(!audioEl.duration) return;
    const cur = audioEl.currentTime;
    const total = audioEl.duration;
    curTimeDom.innerText = formatTime(cur);
    totalTimeDom.innerText = formatTime(total);
    const percent = cur / total;
    progressDot.style.left = (percent*100)+"%";
    updateLyric(cur);
}

//格式化秒数为 00:00
function formatTime(s){
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

//播放结束自动下一曲
audioEl.onended = function(){
    nextBtn.click();
}
